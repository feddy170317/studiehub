oversat: "<b>Ny liste, spørgsmål 5</b> (det var spm. 11 på den gamle liste, med de samme tal). Listen siger <b>delingsdiameter</b> (= delediameter) og <b>trykvinkel</b> (= indgrebsvinkel). En tand på et tandhjul er en lille, kort, tyk <b>udkraget bjælke</b>, der sidder fast i hjulets krop. Når hjulet overfører moment, skubber det andet hjuls tand på den, og den bøjes. Del (a): forklar, hvordan tandhjul beskrives (modul, delediameter, trykvinkel), og hvordan Lewis beregnede bøjespændingen ved tandfoden, så hele tandens form samles i ét tal, $Y$. Del (b): én indsætning, men vurdér resultatet.",

historie: [
 {h:"Modul: tandens størrelse i ét tal",
  t:"Modulet $m$ er delediameteren divideret med antallet af tænder: $m=d/N$. Det er et <b>størrelsesmål</b> for tanden: modul 4 betyder, at hver tand &bdquo;fylder&ldquo; 4 mm af delediameteren. To hjul kan kun gribe ind i hinanden, hvis de har samme modul. Tandhøjden er ca. $2{,}25m$, og afstanden mellem tænderne langs delecirklen er $p=\\pi m$."},
 {h:"Delecirklen og indgrebsvinklen",
  t:"Delecirklen er den tænkte cirkel, hvor to hjul ruller på hinanden uden at glide, som to friktionshjul. Kraften mellem tænderne virker ikke langs tangenten, men langs <b>indgrebslinjen</b>, der hælder med indgrebsvinklen $\\phi$ (standard 20°). Den samlede kraft $W$ deles i en tangential del $F_t=W\\cos\\phi$, som overfører momentet og bøjer tanden, og en radial del $F_r=F_t\\tan\\phi$, som skubber hjulene fra hinanden."},
 {h:"Lewis' trick: en bjælke med ens styrke",
  t:"En tand er ikke en simpel bjælke &mdash; den er bred ved foden og smal ved toppen. Lewis indskrev en <b>parabel</b> i tanden med toppunkt i lastens angrebspunkt. En udkraget bjælke formet som den parabel har præcis samme bøjningsspænding overalt (ens styrke). Den rigtige tand er bredere end parablen overalt, <i>undtagen</i> ved foden, hvor de to rører hinanden. Dér er tanden svagest, og dér regnes spændingen."},
 {h:"Hvad Y betyder",
  t:"Når man regner parablens geometri igennem, forsvinder alle tandens absolutte mål, og der står kun forholdet mellem tandens form og modulet tilbage: $Y=2x/(3m)$. $Y$ afhænger derfor kun af <b>tandformen</b> &mdash; antal tænder og indgrebsvinkel &mdash; ikke af størrelsen. Flere tænder giver bredere, mere retlinede tænder og højere $Y$ (lavere spænding). Få tænder giver smalle, underskårne tænder og lavt $Y$."}

modelsvar: [
 {h:"Del (a) · teori og forklaring (ca. 7 min)", afsnit:[
  {t:"0:00", o:"Åbning", s:"Jeg har trukket bøjespænding i cylindriske tandhjul. Jeg vil først forklare tandhjulets geometri, altså modul, delingsdiameter og trykvinkel. Så viser jeg, at en tand er en udkraget bjælke, og hvordan Lewis samlede tandens form i formfaktoren Y. Til sidst regner jeg designopgaven og vurderer resultatet."},
  {t:"0:45", o:"Geometrien", tavle:["d=m\\,N,\\qquad p=\\pi m","F_t=W\\cos\\phi,\\qquad F_r=W\\sin\\phi,\\qquad \\phi=20°"], s:"Delingsdiameteren er diameteren på de to cirkler, der ruller på hinanden uden at glide. Modulet er delingsdiameteren divideret med antal tænder, så d er m gange N, og modulet er et mål for tandens størrelse. To hjul kan kun gå i indgreb, hvis de har samme modul. Tandkraften virker langs indgrebslinjen, som hælder med trykvinklen, typisk 20 grader. Jeg deler den i en tangential del F t, der overfører momentet og bøjer tanden, og en radial del F r, der skubber hjulene fra hinanden."},
  {t:"2:30", o:"Tanden som udkraget bjælke", tavle:"\\sigma=\\frac{Mc}{I}=\\frac{F_t\\,l\\cdot t/2}{b\\,t^3/12}=\\frac{6F_t\\,l}{b\\,t^2}", s:"Tanden sidder fast i hjulets krop og bliver skubbet i spidsen. Det er en udkraget bjælke. Værste tilfælde er, at hele F t virker i tandspidsen. Momentet ved foden er F t gange armen l, og med et rektangulært tværsnit med tykkelsen t og bredden b giver bjælkeformlen 6 F t l over b t i anden. Problemet er, at l og t afhænger af tandens form og er svære at måle."},
  {t:"4:00", o:"Lewis' trick og formfaktoren Y", tavle:["\\frac{t/2}{x}=\\frac{l}{t/2}\\;\\Rightarrow\\;x=\\frac{t^2}{4l}","\\sigma_b=\\frac{F_t}{b\\,m\\,Y},\\qquad Y=\\frac{2x}{3m}"], s:"Lewis tegnede en parabel ind i tanden med toppunkt i lastpunktet og tangent til flankerne ved foden. En parabel er en bjælke med konstant spænding, så det svageste sted er netop der, hvor parablen rører tanden. Med ligedannede trekanter bliver t i anden over l lig 4 x, og så kan jeg skrive spændingen med x. Ganger jeg med m over m, får jeg Lewis-ligningen: F t over b gange m gange Y. F t er den tangentiale kraft, b tandbredden, m modulet og Y formfaktoren. Y er dimensionsløs og afhænger kun af tandens form, altså antal tænder og trykvinkel, ikke af størrelsen. Flere tænder giver en tykkere fod og et større Y. Et større modul giver en større tand og en lavere spænding."}]},
 {h:"Del (b) · designopgaven og vurdering (ca. 6 min)", afsnit:[
  {t:"7:00", o:"Bøjespændingen", tavle:"\\sigma_b=\\frac{F_t}{b\\,m\\,Y}=\\frac{1600}{40\\cdot4\\cdot0{,}32}=\\frac{1600}{51{,}2}=31{,}25\\ \\text{MPa}", s:"Jeg regner i newton og millimeter. Nævneren er 40 gange 4 gange 0,32, altså 51,2 kvadratmillimeter. 1600 newton delt med 51,2 giver en bøjespænding i tandfoden på 31,25 megapascal."},
  {t:"8:00", o:"Hvad overfører hjulet?", tavle:["d=m\\,N=4\\cdot20=80\\ \\text{mm}","T=F_t\\,\\frac{d}{2}=1600\\cdot0{,}040=64\\ \\text{N}\\cdot\\text{m},\\qquad F_r=F_t\\tan20°=582\\ \\text{N}"], s:"For at give tallet mening finder jeg delingsdiameteren, 4 gange 20, altså 80 millimeter. Momentet er F t gange radius, 1600 gange 40 millimeter, altså 64 newtonmeter. Den radiale kraft er F t gange tangens 20 grader, 582 newton. Den bøjer akslen og skal bæres af lejerne."},
  {t:"9:30", o:"Er det rimeligt?", tavle:"\\sigma_b=31\\ \\text{MPa}\\ll\\sigma_{till}\\approx100\\text{–}200\\ \\text{MPa (stål, antaget)}", s:"Er det rimeligt? 31 megapascal er lavt. Den tilladte bøjespænding for et almindeligt tandhjulsstål er typisk 100 til 200 megapascal, det er en antagelse, fordi opgaven ikke giver den. Tanden har altså god reserve. Selv hvis jeg ganger med en dynamikfaktor og en kærvfaktor, som Lewis ikke har med, er den stadig under grænsen."},
  {t:"11:00", o:"Antagelser og begrænsninger", s:"Mine antagelser er, at hele kraften virker i tandspidsen og bæres af én tand, at lasten er statisk, og at der ikke er spændingskoncentration ved tandfoden. Lewis ser bort fra den radiale trykkomposant, fra stød ved høj hastighed og fra, at to tandpar ofte deler lasten. Det er derfor, AGMA-metoden lægger faktorer ovenpå, for eksempel en dynamikfaktor og geometrifaktoren J. Lewis er et godt første overslag, ikke en endelig dimensionering."}]}
],

qa: [
 {q:"Hvorfor regner Lewis med lasten i tandens spids?",
  a:"Det er værste tilfælde: størst arm. I praksis deler to tandpar lasten, når spidsen er i indgreb (kontaktforhold > 1), så den største spænding optræder, når lasten sidder ved det højeste punkt med kun ét tandpar &mdash; det er det punkt, AGMA's geometrifaktor $J$ bygger på."},
 {q:"Hvad sker der med spændingen, hvis modulet fordobles?",
  a:"$\\sigma\\propto1/m$ ved samme $F_t$. Men med samme antal tænder fordobles $d$ også, så for samme <i>moment</i> halveres $F_t$. Samlet: $\\sigma\\propto1/m^2$ for fast moment og tandantal. Modulet er det stærkeste håndtag."},
 {q:"Hvad er dynamikfaktoren?",
  a:"Ved høje hastigheder slår tænderne mod hinanden pga. fremstillingsfejl. Barths faktor $K_v=(6{,}1+v)/6{,}1$ (fræste tænder, $v$ i m/s på delecirklen) ganges på spændingen. Ved 1500 o/min og $d=80$ mm: $v=6{,}3$ m/s → $K_v=2{,}0$ &mdash; spændingen fordobles."},
 {q:"Hvorfor er indgrebsvinklen typisk 20°?",
  a:"Større vinkel giver bredere tandfod (stærkere tand, mindre underskæring), men større radialkraft (mere lejelast). 20° er et kompromis. 14,5° er ældre standard; 25° bruges til hårdt belastede gear."},
 {q:"Hvilket moment overfører drevet?",
  a:"$T=F_t\\cdot d/2=1600\\cdot0{,}040=64$ N·m, med $d=mN=80$ mm."},
 {q:"Hvordan hænger det sammen med udmattelse?",
  a:"En tand belastes én gang pr. omdrejning (pulserende, $R\\approx0$) &mdash; i et mellemhjul endda vekslende. Tandfodens bøjningsspænding skal derfor sammenlignes med en udmattelsesstyrke, ikke flydespændingen. Det er Goodman-logikken fra udmattelseskapitlet."}
],

sammenhaeng: "Lewis er <b>bøjningsformlen</b> $\\sigma=Mc/I$ anvendt på en ny geometri. Tandkræfterne $F_t$ og $F_r$ er lasterne på akslen (<b>spm. 3</b>), og reaktionerne bæres af lejerne (<b>spm. 4</b>). Tandhjul, remme (<b>spm. 9</b>) og koblinger (<b>spm. 8</b>) er tre måder at overføre et moment på. Til <b>semesterprojektet</b>: har dit maskinelement et gear, skal du kunne begrunde modul og tandbredde med denne formel.",

links: [
 {k:"MATHCAD", t:"Del (a) og (b) regnet i Mathcad (PDF)", u:"../opgaver/eksamen/tidligere-eksamen-spm-11-lewis-tandhjul.pdf"},
 {k:"LISTEN", t:"Den nye spørgsmålsliste (PDF)", u:"Mundtlige_eksamensspoergsmaal_ny_9.pdf"},
 {k:"WIDGET", t:"Ligetandede tandhjul", u:"../interaktiv/tandhjul_ligetandet.html"},
 {k:"KAP. 14", t:"Formeloverblik (PDF)", u:"../Kapitel14_Overblik.pdf"},
 {k:"KAP. 14", t:"Quiz", u:"../../../quiz/mem1/Kapitel14_Quiz.html"}
]
};

/* Lewis formfaktor, 20° indgrebsvinkel, fuld tandhøjde */
var YTAB = [[12,.245],[13,.261],[14,.277],[15,.290],[16,.296],[17,.303],[18,.309],[19,.314],[20,.322],[21,.328],[22,.331],[24,.337],[26,.346],[28,.353],[30,.359],[34,.371],[38,.384],[43,.397],[50,.409],[60,.422],[75,.435],[100,.447],[150,.460],[300,.472],[400,.480]];
function Ytab(N){ if (N<=YTAB[0][0]) return YTAB[0][1];
  for (var i=1;i<YTAB.length;i++) if (N<=YTAB[i][0]) { var a=YTAB[i-1], b=YTAB[i]; return a[1]+(b[1]-a[1])*(N-a[0])/(b[0]-a[0]); }
  return YTAB[YTAB.length-1][1]; }

var LAB = {
w: 720, h: 440,
intro: "Til højre er tanden tegnet som udkraget bjælke med Lewis-parablen (stiplet). Skift <b>Y-kilde</b> til tabellen, og træk i tandantallet: med få tænder bliver foden smal og spændingen høj. Øg modulet, og hele tanden vokser &mdash; formen (og $Y$) er den samme, men spændingen falder.",
preset2: {navn: "Lille pinion: N = 12 (tabel-Y)", v: {N: 12, ysrc: 1}},

inputs: [
 {id:"m",    label:"Modul $m$",               min:1,   max:10,   step:0.5, value:4,    dec:1, unit:"mm"},
 {id:"b",    label:"Tandbredde $b$",           min:10,  max:120,  step:1,   value:40,   unit:"mm"},
 {id:"N",    label:"Antal tænder $N$",         min:12,  max:100,  step:1,   value:20,   unit:""},
 {id:"Ft",   label:"Tangentialkraft $F_t$",    min:100, max:8000, step:50,  value:1600, unit:"N"},
 {id:"ysrc", label:"Y-kilde",                  min:0,   max:1,    step:1,   value:0,    choices:["Opgavens Y (skyder nedenfor)", "Tabel, 20° fuld tandhøjde"]},
 {id:"Y",    label:"Formfaktor $Y$ (manuel)",  min:0.2, max:0.5,  step:0.01,value:0.32, dec:2, unit:""}
],

compute: function (v) {
  var Y = v.ysrc >= 0.5 ? Ytab(v.N) : v.Y;
  var sb = v.Ft / (v.b * v.m * Y);
  var d = v.m * v.N;
  var x = 1.5 * Y * v.m, l = 2.25 * v.m, t = 2 * Math.sqrt(l * x);
  return { Y:Y, sb:sb, d:d, p:Math.PI * v.m, T:v.Ft * d / 2 / 1000, Fr:v.Ft * Math.tan(20 * Math.PI / 180),
           W:v.Ft / Math.cos(20 * Math.PI / 180), x:x, l:l, t:t, Ytab:Ytab(v.N) };
},

readout: function (v, r) {
  return [
   {l:"Anvendt $Y$", v:r.Y, dec:3, unit:"", k:"hi"},
   {l:"Tabel-$Y$ for N = "+v.N+" (20°)", v:r.Ytab, dec:3, unit:""},
   {l:"Bøjningsspænding $\\sigma_b$", v:r.sb, dec:2, unit:"MPa", k:"hi"},
   {l:"Delediameter $d=mN$", v:r.d, dec:1, unit:"mm"},
   {l:"Deling $p=\\pi m$", v:r.p, dec:2, unit:"mm"},
   {l:"Moment $T=F_td/2$", v:r.T, dec:1, unit:"N·m"},
   {l:"Radialkraft $F_r$ (20°)", v:r.Fr, dec:0, unit:"N"},
   {l:"Lewis-mål $x$ / $t$", raw: Eks.num(r.x,2)+" / "+Eks.num(r.t,2), unit:"mm"}
  ];
},

steps: function (v, r) {
  var T = Eks.tnum;
  return [
   {h:"1 · Geometri",
    m:"d=m\\,N="+T(v.m,1)+"\\cdot"+T(v.N,0)+"="+T(r.d,1)+"\\ \\text{mm},\\qquad p=\\pi m="+T(r.p,2)+"\\ \\text{mm}",
    c:"Momentet der overføres: $T=F_t\\,d/2="+Eks.num(r.T,1)+"$ N·m."},
   {h:"2 · Lewis' ligning",
    m:"\\sigma_b=\\frac{F_t}{b\\,m\\,Y}=\\frac{"+T(v.Ft,0)+"}{"+T(v.b,0)+"\\cdot"+T(v.m,1)+"\\cdot"+T(r.Y,3)+"}="+T(r.sb,2)+"\\ \\text{MPa}",
    c:"Nævneren $b\\,m\\,Y="+Eks.num(v.b*v.m*r.Y,2)+"$ mm² er tandens &bdquo;effektive bøjningsareal&ldquo;."},
   {h:"3 · Hvad Y svarer til geometrisk",
    m:"x=\\tfrac32\\,Y\\,m="+T(r.x,2)+"\\ \\text{mm},\\qquad l\\approx2{,}25\\,m="+T(r.l,2)+",\\qquad t=2\\sqrt{l\\,x}="+T(r.t,2)+"\\ \\text{mm}",
    c:"Tandfodens bredde $t$ bag parablen, hvis lasten sidder i spidsen."},
   {h:"4 · Kontrol med bjælkeformlen",
    m:"\\sigma=\\frac{6F_tl}{bt^2}=\\frac{6\\cdot"+T(v.Ft,0)+"\\cdot"+T(r.l,2)+"}{"+T(v.b,0)+"\\cdot"+T(r.t,2)+"^2}="+T(6*v.Ft*r.l/(v.b*r.t*r.t),2)+"\\ \\text{MPa}",
    c:"Samme tal: Lewis <i>er</i> bøjningsformlen."}
  ];
},

facit: function (v, r) {
  if (v.m===4 && v.b===40 && v.N===20 && v.Ft===1600 && v.ysrc===0 && Math.abs(v.Y-0.32)<1e-9) {
    return {t:"<b>✓ Eksamensopgavens facit:</b> $\\sigma_b=\\frac{1600}{40\\cdot4\\cdot0{,}32}=\\frac{1600}{51{,}2}=31{,}25$ MPa. Delediameter $d=80$ mm, moment $T=64$ N·m. Med tabellens $Y=0{,}322$ bliver det 31,06 MPa."};
  }
  return {off:true, t:"Du har ændret inddata. Tryk på knappen for at komme tilbage til eksamensopgavens tal."};
},

draw: function (ctx, W, H, v, r, C) {
  C.grid(ctx, W, H, 40);
  var CY='#5ec8ff', GR='#00d984', GO='#ffa500', RD='#ff5e5e', PU='#d984ff', DIM='rgba(227,235,243,.45)';

  /* ---------- tandhjulet ---------- */
  var gx=150, gy=H/2+14, Rp=118, Nn=Math.round(v.N);
  var ra=Rp*(1+2/Nn), rf=Rp*(1-2.5/Nn), pitch=2*Math.PI/Nn;
  C.txt(ctx,'N = '+Nn+', d = mN = '+Eks.num(r.d,0)+' mm', gx, 24, DIM, 11, 'center');
  ctx.save(); ctx.beginPath();
  for (var i=0;i<Nn;i++){
    var a0=i*pitch - Math.PI/2;
    var pts=[[rf, a0-0.30*pitch],[rf, a0-0.25*pitch],[ra, a0-0.12*pitch],[ra, a0+0.12*pitch],[rf, a0+0.25*pitch],[rf, a0+0.30*pitch]];
    pts.forEach(function(q,k){ var X=gx+q[0]*Math.cos(q[1]), Y=gy+q[0]*Math.sin(q[1]); if(i===0&&k===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y); });
  }
  ctx.closePath(); ctx.fillStyle='rgba(94,200,255,.12)'; ctx.fill(); ctx.strokeStyle=CY; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore();
  C.circle(ctx, gx, gy, Rp, GO, null, 1.3, [5,4]);
  C.circle(ctx, gx, gy, 12, CY, 'rgba(10,26,43,1)', 1.6);
  C.mono(ctx,'delecirkel', gx+Rp*0.72, gy+Rp*0.72+14, GO, 10);
  // markér tanden øverst
  C.circle(ctx, gx, gy-ra, 5, null, RD);
  C.arrow(ctx, gx+46, gy-ra-2, gx+8, gy-ra-2, RD, 2.4);
  C.mono(ctx,'Ft', gx+50, gy-ra+2, RD, 11);

  /* ---------- tanden som udkraget bjælke ---------- */
  var bx=520, base=H-112, sc=Math.min(230/r.l, 90/r.x, 230/r.t, 60);
  var L=r.l*sc, T2=r.t*sc/2, tip=0.35*r.t*sc/2, X=r.x*sc;
  C.txt(ctx,'Tanden = udkraget bjælke (Lewis)', bx, 24, DIM, 11, 'center');
  // tandprofil
  C.poly(ctx, [[bx-T2-26, base],[bx-T2, base],[bx-tip, base-L-6],[bx+tip, base-L-6],[bx+T2, base],[bx+T2+26, base],[bx+T2+26, base+22],[bx-T2-26, base+22]],
         CY, 'rgba(94,200,255,.12)', 2);
  // Lewis-parabel: toppunkt i lastpunktet (bx, base-L), gennem (bx±T2, base)
  var par=[];
  for (var k=-30;k<=30;k++){ var w=k/30*T2; par.push([bx+w, base-L + L*(w/T2)*(w/T2)]); }
  C.poly(ctx, par, GO, null, 1.8, [5,3]);
  // last
  C.arrow(ctx, bx+tip+70, base-L, bx+tip+4, base-L, RD, 2.8);
  C.mono(ctx,'Ft='+Eks.num(v.Ft,0)+' N', bx+tip+74, base-L+4, RD, 11);
  // maal: l og t
  C.dim(ctx, bx-T2-40, base-L, bx-T2-40, base, GR, null);
  C.mono(ctx,'l', bx-T2-52, base-L/2+4, GR, 12);
  C.dim(ctx, bx-T2, base+X+20, bx+T2, base+X+20, GR, null);
  C.mono(ctx,'t', bx, base+X+36, GR, 12, 'center');
  // ligedannede trekanter: a (lastpunkt), c (fodens midte), b (tangentpunkt), e (x under foden)
  var ax_=bx, ay_=base-L, bxp=bx+T2, byp=base, ey=base+X;
  C.line(ctx, ax_, ay_, bxp, byp, PU, 1.3);
  C.line(ctx, bxp, byp, ax_, ey, PU, 1.3);
  C.line(ctx, ax_, ay_, ax_, ey, 'rgba(217,132,255,.5)', 1, [3,3]);
  C.mono(ctx,'x', ax_-12, base+X/2+4, PU, 12, 'right');
  C.circle(ctx, bxp, byp, 3.5, null, PU);
  // spændingsfordeling i foden
  var sfy=base+4;
  C.poly(ctx, [[bx-T2, sfy],[bx-T2, sfy+18],[bx, sfy]], null, 'rgba(94,200,255,.35)');
  C.poly(ctx, [[bx+T2, sfy],[bx+T2, sfy+18],[bx, sfy]], null, 'rgba(255,94,94,.35)');
  C.txt(ctx,'σb = '+Eks.num(r.sb,2)+' MPa i tandfoden', bx, 46, GO, 13, 'center', true);
}
};
</script>
