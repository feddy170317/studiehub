spmA: "Sammenlign teorierne om konstant tryk og konstant slid for lamelkoblinger. Forklar momentkapacitetsformlen $T=N\\mu F\\frac{r_o+r_i}{2}$ under antagelsen om konstant slid, herunder betydningen af leddene og de fysiske antagelser bag formlen.",

oversat: "<b>Ny liste, spørgsmål 8</b> (det var spm. 14 på den gamle liste, med de samme tal). Listen siger <b>lamelkobling</b> (= flerskivet friktionskobling). Friktionen mellem pladerne overfører momentet, og spørgsmålet er, hvordan trykket fordeler sig over den ringformede flade. En helt ny kobling har konstant tryk. Når den har kørt lidt, er den slidt til, så sliddet er ens overalt, og så er trykket størst inderst. Del (a): sammenlign de to modeller, og forklar formlen for konstant slid. Del (b): regn momentet, og vurdér det.",
kerne: "Slid ∝ tryk × glidevej. Glidevejen vokser med radius, så en tilslidt kobling har $p\\cdot r=$ konstant: størst tryk inderst. Det giver lidt mindre moment end ensformigt tryk &mdash; derfor dimensionerer man efter slid.",

historie: [
 {h:"Hvorfor trykfordelingen betyder noget",
  t:"Momentet er friktionskraft gange arm. En friktionskraft langt ude giver meget moment; tæt på centrum giver den lidt. Så det er ikke ligegyldigt, <i>hvor</i> på ringen trykket sidder. Den samme spændkraft $F$ kan give forskelligt moment afhængigt af fordelingen."},
 {h:"Ny kobling: ensformigt tryk",
  t:"Når fladerne er nye og helt plane, og pladerne er stive, er det rimeligt at antage, at trykket er det samme overalt: $p=F/[\\pi(r_o^2-r_i^2)]$. Men det holder ikke længe. Den ydre del af fladen glider hurtigere (hastighed $v=\\omega r$) og bliver derfor slidt mere."},
 {h:"Tilslidt kobling: ensformigt slid",

],

modelsvar: [
 {h:"Del (a) · teori og forklaring (ca. 7 min)", afsnit:[
  {t:"0:00", o:"Åbning", s:"Jeg har trukket lamelfriktionskoblinger. Jeg vil først opstille momentet fra et lille ringelement, så udlede formlen for konstant tryk og for konstant slid og sammenligne dem. Til sidst regner jeg designopgaven og vurderer resultatet."},
  {t:"0:45", o:"Ringelementet", tavle:"dT=\\mu\\,p\\,(2\\pi r\\,dr)\\cdot r", s:"Friktionsfladen er en ring med inderradius r i og yderradius r o, og pladerne trykkes sammen af den aksiale kraft F. Jeg ser på en tynd ring i afstanden r med tykkelsen d r. Dens areal er 2 pi r d r, normalkraften er trykket gange arealet, friktionskraften er mu gange det, og momentbidraget er friktionskraften gange armen r. Spørgsmålet er bare, hvordan trykket p afhænger af r."},
  {t:"2:00", o:"Konstant tryk", tavle:["F=p\\,\\pi(r_o^2-r_i^2)","T=\\tfrac23\\pi\\mu p(r_o^3-r_i^3)=\\tfrac23\\,\\mu F\\,\\frac{r_o^3-r_i^3}{r_o^2-r_i^2}"], s:"I en ny kobling med plane, stive plader er trykket det samme overalt. Så er kraften trykket gange ringarealet, og momentet er integralet af r i anden, som giver r i tredje. Fjerner jeg p med kraften, får jeg momentet udtrykt ved F."},
  {t:"3:15", o:"Konstant slid", tavle:["\\text{slid}\\propto p\\cdot v,\\quad v\\propto r\\;\\Rightarrow\\;p\\,r=\\text{konst.}=p_{max}\\,r_i","F=2\\pi p_{max}r_i(r_o-r_i),\\qquad T=N\\mu F\\,\\frac{r_o+r_i}{2}"], s:"Men sliddet er proportionalt med tryk gange glidehastighed, og hastigheden vokser med radius. Med konstant tryk slides ydersiden altså hurtigst. Efter indkøring har koblingen slidt sig til, så sliddet er ens overalt. Det kræver, at p gange r er konstant, så trykket er størst inderst, p max ved r i. Integrerer jeg igen, får jeg en meget enkel formel: momentet er mu F gange middelradius for hver friktionsflade, og med N flader ganger jeg med N. Fysisk betyder det, at hele friktionskraften virker ved middelradius. Det er N aktive flader, fordi den samme kraft F går igennem alle pladerne."},
  {t:"5:15", o:"Sammenligningen", s:"Konstant slid giver altid lidt mindre moment end konstant tryk, fordi trykket er flyttet ind mod centrum, hvor armen er kortere. Derfor dimensionerer man efter slid: det er konservativt, og det er den tilstand, koblingen er i det meste af sin levetid. Til gengæld er det største tryk inderst, og det er dét, belægningen skal kunne tåle. Mine antagelser er stive plader, konstant friktionskoefficient og et slid, der er kørt helt ind."}]},
 {h:"Del (b) · designopgaven og vurdering (ca. 6 min)", afsnit:[
  {t:"7:00", o:"Momentet ved konstant slid", tavle:"T=N\\mu F\\,\\frac{r_o+r_i}{2}=4\\cdot0{,}30\\cdot2000\\cdot\\frac{100+50}{2}=180\\,000\\ \\text{N}\\cdot\\text{mm}=180\\ \\text{N}\\cdot\\text{m}", s:"Middelradius er 100 plus 50 delt med 2, altså 75 millimeter. 4 flader gange 0,30 gange 2000 newton gange 75 millimeter giver 180.000 newtonmillimeter, altså 180 newtonmeter."},
  {t:"8:30", o:"Sammenlign med konstant tryk", tavle:"T_{tryk}=4\\cdot0{,}30\\cdot2000\\cdot\\tfrac23\\cdot\\frac{100^3-50^3}{100^2-50^2}=186{,}7\\ \\text{N}\\cdot\\text{m}", s:"Til sammenligning giver konstant tryk 186,7 newtonmeter. Forskellen er kun 3,6 procent, fordi ringen ikke er særlig bred. Slidmodellen er den lille, sikre værdi."},
  {t:"9:30", o:"Trykket på belægningen", tavle:"p_{max}=\\frac{F}{2\\pi r_i(r_o-r_i)}=\\frac{2000}{2\\pi\\cdot50\\cdot50}=0{,}127\\ \\text{MPa}", s:"Det største tryk sidder ved inderradius og er 0,127 megapascal. Opgaven giver ikke belægningens tilladte tryk, men typiske værdier er 0,3 til 1 megapascal. Belægningen er altså langt fra grænsen, og kraften kunne godt øges."},
  {t:"10:30", o:"Vurdering og antagelser", s:"Er det rimeligt? 180 newtonmeter er cirka momentet fra en mindre bilmotor, med en klemkraft på kun 2000 newton, fordi der er fire flader. Med én flade skulle kraften være fire gange så stor. Det er hele pointen med en lamelkobling: flere flader giver mere moment i samme diameter. Mine antagelser er fire aktive flader, en konstant friktionskoefficient på 0,30, som falder, hvis koblingen bliver varm eller olieret, stive plader og ingen friktion i noterne, så hele F når alle flader. Med olie, hvor mu er 0,1, ville momentet falde til en tredjedel."}]}
],

antagelser: ["Konstant slid: koblingen er kørt ind, så $p\\,r$ er konstant.","$N=4$ aktive friktionsflader, og hele $F$ går gennem alle flader (ingen friktion i noterne).","Konstant friktionskoefficient $\\mu=0{,}30$ (tør belægning). Varme eller olie sænker den.","Stive, plane plader."],

trin: [
 {t:"Ringelementet: kraft og moment",
  m:["dF=p\\cdot2\\pi r\\,dr,\\qquad dT=r\\cdot\\mu\\,dF=2\\pi\\mu\\,p\\,r^2\\,dr"],
  hvorfor:"Et tyndt ringelement i afstanden $r$ med bredden $dr$ har arealet $2\\pi r\\,dr$. Normalkraften er tryk gange areal, friktionskraften $\\mu$ gange den, og momentbidraget er friktionskraften gange armen $r$. Resten er integration med den valgte trykfordeling.",

  hvorfor:"Med $p$ konstant er integralerne trivielle. Divider $T$ med $F$ for at eliminere $p$. Den effektive friktionsradius er $\\tfrac23\\frac{r_o^3-r_i^3}{r_o^2-r_i^2}$ &mdash; lidt større end middelradius.",
  sig:"Med ensformigt tryk integrerer jeg og eliminerer trykket. Den effektive friktionsradius bliver to tredjedele af forholdet mellem kubikkerne og kvadraterne."},

  m:"\\text{slid}\\propto p\\cdot v=p\\cdot\\omega r\\quad\\Rightarrow\\quad\\text{ens slid}:\\ p\\,r=\\text{konst.}=p_{max}\\,r_i",
  hvorfor:"Archards slidlov: slidt volumen ∝ normalkraft × glidevej. Pr. arealenhed: slidt dybde ∝ $p\\cdot$ glidevej. Glidevejen pr. omdrejning er $2\\pi r$. Efter indkøring er sliddet ens overalt, ellers ville de højeste steder fortsat blive slidt ned. Trykket er størst, hvor $r$ er mindst: ved $r_i$.",

qa: [
 {q:"Hvor stort er maksimaltrykket i opgaven?",
  a:"$p_{max}=\\frac{F}{2\\pi r_i(r_o-r_i)}=\\frac{2000}{2\\pi\\cdot50\\cdot50}=0{,}127$ MPa ved indersiden. Ved ensformigt tryk ville det være $\\frac{2000}{\\pi(100^2-50^2)}=0{,}085$ MPa overalt. Bemærk: $F$ er den samme for alle fladerne i pakken, så trykket er det samme på hver."},
 {q:"Hvad er det optimale forhold mellem rᵢ og rₒ?",
  a:"For en given $r_o$ og tilladt $p_{max}$ giver ensformigt slid det største moment ved $r_i=r_o/\\sqrt3\\approx0{,}577r_o$. I praksis bruges $r_i/r_o=0{,}45$&ndash;$0{,}8$."},
 {q:"Hvorfor er forskellen mellem modellerne så lille her?",
  a:"Fordi ringen er forholdsvis smal ($r_i/r_o=0{,}5$). Jo smallere ringen er, jo mindre betyder fordelingen &mdash; i grænsen $r_i\\to r_o$ giver begge $\\mu F r$. Ved en fuld skive ($r_i=0$) er forskellen 25 % ($\\tfrac23r_o$ mod $\\tfrac12r_o$)."},
 {q:"Hvad begrænser en koblings levetid?",
  a:"Varme. Ved hver indkobling glider fladerne, og energien bliver til varme i belægningen. For høj temperatur giver &bdquo;fading&ldquo; (faldende $\\mu$) og slid. Derfor tjekkes $p\\cdot v$ og energi pr. indkobling (§18.2)."},
 {q:"Hvad er forskellen på en kobling og en bremse?",
  a:"Ingen fysisk: begge overfører moment via friktion. En kobling forbinder to roterende dele, en bremse forbinder en roterende del med en stillestående. Formlerne er de samme."},
 {q:"Hvorfor bruger automatgear våde lamelkoblinger?",
  a:"Mange flader ($N$ stor) giver stort moment i lille diameter. Olien køler og giver blød indkobling, men sænker $\\mu$ (ca. 0,1), så man skal bruge flere lameller."}
],

sammenhaeng: "Koblingen er <b>friktion</b> som i kraftskruen (<b>spm. 6</b>) og remtrækket (<b>spm. 9</b>), men integreret over en flade. Momentet går videre i akslen (<b>spm. 3</b>). Koblinger, tandhjul (<b>spm. 5</b>) og remme er tre måder at overføre moment på. Til <b>semesterprojektet</b>: har dit maskinelement en kobling eller en bremse, er det denne formel og valget af model, du skal begrunde.",

preset2: {navn: "Fuld skive: rᵢ = 5 mm", v: {ri: 5}},

inputs: [
 {id:"N",  label:"Antal friktionsflader $N$",  min:1,   max:12,   step:1,    value:4,    unit:""},
 {id:"ri", label:"Inderradius $r_i$",          min:5,   max:150,  step:1,    value:50,   unit:"mm"},
 {id:"ro", label:"Yderradius $r_o$",           min:20,  max:200,  step:1,    value:100,  unit:"mm"},
 {id:"mu", label:"Friktionskoefficient $\\mu$", min:0.05,max:0.6,  step:0.01, value:0.30, dec:2, unit:""},
 {id:"F",  label:"Spændkraft $F$",             min:100, max:10000,step:50,   value:2000, unit:"N"}
],

compute: function (v) {
  var ri = Math.min(v.ri, v.ro - 1), ro = v.ro;
  var Tw = v.N * v.mu * v.F * (ro + ri) / 2;
  var Tp = v.N * v.mu * v.F * (2 / 3) * (Math.pow(ro, 3) - Math.pow(ri, 3)) / (ro * ro - ri * ri);
  var pmaxW = v.F / (2 * Math.PI * ri * (ro - ri));
  var pP = v.F / (Math.PI * (ro * ro - ri * ri));
  return { ri:ri, ro:ro, Tw:Tw, Tp:Tp, pmaxW:pmaxW, pP:pP, rW:(ro + ri) / 2,
           rP:(2 / 3) * (Math.pow(ro, 3) - Math.pow(ri, 3)) / (ro * ro - ri * ri) };
},

readout: function (v, r) {
  return [
   {l:"$T$ ensformigt slid", v:r.Tw/1000, dec:1, unit:"N·m", k:"hi"},
   {l:"$T$ ensformigt tryk", v:r.Tp/1000, dec:1, unit:"N·m"},
   {l:"Forhold slid/tryk", v:r.Tw/r.Tp, dec:4, unit:""},
   {l:"Friktionsradius (slid)", v:r.rW, dec:1, unit:"mm"},
   {l:"Friktionsradius (tryk)", v:r.rP, dec:1, unit:"mm"},
   {l:"$p_{max}$ ved $r_i$ (slid)", v:r.pmaxW, dec:4, unit:"MPa"},
   {l:"$p$ ensformigt tryk", v:r.pP, dec:4, unit:"MPa"}
  ];
},

steps: function (v, r) {
  var T = Eks.tnum;
  return [
   {h:"1 · Middelradius",
    m:"r_m=\\frac{r_o+r_i}{2}=\\frac{"+T(r.ro,0)+"+"+T(r.ri,0)+"}{2}="+T(r.rW,1)+"\\ \\text{mm}",
    c:"Den effektive friktionsradius ved ensformigt slid."},
   {h:"2 · Moment ved ensformigt slid",
    m:"T=N\\mu F\\,\\frac{r_o+r_i}{2}="+T(v.N,0)+"\\cdot"+T(v.mu,2)+"\\cdot"+T(v.F,0)+"\\cdot"+T(r.rW,1)+"="+T(r.Tw,0)+"\\ \\text{N·mm}="+T(r.Tw/1000,1)+"\\ \\text{N·m}",
    c:"Dimensionerende (konservativ) værdi."},
   {h:"3 · Til sammenligning: ensformigt tryk",
    m:"T=N\\mu F\\cdot\\tfrac23\\,\\frac{r_o^3-r_i^3}{r_o^2-r_i^2}="+T(v.N*v.mu*v.F,0)+"\\cdot"+T(r.rP,2)+"="+T(r.Tp/1000,1)+"\\ \\text{N·m}",
    c:"Forholdet slid/tryk er "+Eks.num(r.Tw/r.Tp,3)+"."},
   {h:"4 · Maksimaltryk ved indersiden",
    m:"p_{max}=\\frac{F}{2\\pi r_i(r_o-r_i)}=\\frac{"+T(v.F,0)+"}{2\\pi\\cdot"+T(r.ri,0)+"\\cdot"+T(r.ro-r.ri,0)+"}="+T(r.pmaxW,4)+"\\ \\text{MPa}",
    c:"Det er det, belægningen skal tåle."}
  ];
},

facit: function (v, r) {
  if (v.N===4 && v.ri===50 && v.ro===100 && Math.abs(v.mu-0.30)<1e-9 && v.F===2000) {
    return {t:"<b>✓ Eksamensopgavens facit:</b> $T=4\\cdot0{,}30\\cdot2000\\cdot\\frac{100+50}{2}=180\\,000$ N·mm $=180$ N·m. Med ensformigt tryk ville det være 186,7 N·m &mdash; slidmodellen er 3,6 % mere konservativ. Maksimaltrykket ved indersiden er 0,127 MPa."};
  }
  return {off:true, t:"Du har ændret inddata. Tryk på knappen for at komme tilbage til eksamensopgavens tal."};
},

draw: function (ctx, W, H, v, r, C) {
  C.grid(ctx, W, H, 40);
  var CY='#5ec8ff', GR='#00d984', GO='#ffa500', RD='#ff5e5e', PU='#d984ff', DIM='rgba(227,235,243,.45)';

  /* ---------- friktionsfladen, farvet efter p (slid) ---------- */
  var cx=150, cy=178, Ro=132, Ri=Ro*r.ri/r.ro;
  C.txt(ctx,'Friktionsflade — tryk ved ensformigt slid', cx, 22, DIM, 11, 'center');
  var n=40;
  for (var k=0;k<n;k++){
    var ra=Ri+(Ro-Ri)*k/n, rb=Ri+(Ro-Ri)*(k+1)/n, rr=r.ri+(r.ro-r.ri)*(k+0.5)/n;
    var s=(r.ri/rr - r.ri/r.ro)/Math.max(1 - r.ri/r.ro, 1e-6);    // 1 ved indersiden, 0 ved ydersiden
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,rb,0,2*Math.PI); ctx.arc(cx,cy,ra,0,2*Math.PI,true);
    ctx.fillStyle='rgba(255,'+Math.round(200-150*s)+','+Math.round(90-60*s)+','+(0.25+0.6*s)+')'; ctx.fill(); ctx.restore();
  }
  C.circle(ctx, cx, cy, Ro, '#e3ebf3', null, 1.5);
  C.circle(ctx, cx, cy, Ri, '#e3ebf3', null, 1.5);
  // friktionskraefter (tangentielle) ved tre radier
  [0.15,0.5,0.85].forEach(function(f){ var rp=Ri+(Ro-Ri)*f, rrmm=r.ri+(r.ro-r.ri)*f, pr=r.ri/rrmm;
    for (var a=0;a<6;a++){ var th=a/6*2*Math.PI+f; var x=cx+Math.cos(th)*rp, y=cy+Math.sin(th)*rp, L=8+16*pr;
      C.arrow(ctx, x, y, x-Math.sin(th)*L, y+Math.cos(th)*L, GO, 1.5, 5); } });
  C.circle(ctx, cx, cy, (Ri+Ro)/2, GR, null, 1.3, [5,4]);
  C.mono(ctx,'rm='+Eks.num(r.rW,0), cx, cy-(Ri+Ro)/2-6, GR, 10, 'center');
  C.mono(ctx,'ri', cx+Ri*0.7, cy+Ri*0.7, '#e3ebf3', 10);
  C.mono(ctx,'ro', cx+Ro*0.72, cy+Ro*0.72+10, '#e3ebf3', 10);

  /* ---------- lamelpakke ---------- */
  var sx0=40, sy=H-58, nf=Math.round(v.N), plates=nf+1, pw=Math.min(22, 250/plates), gap=4;
  C.txt(ctx,'Lamelpakke: '+plates+' plader → '+nf+' friktionsflader', sx0, sy-38, DIM, 10);
  for (var p=0;p<plates;p++){ var x=sx0+30+p*(pw+gap);
    ctx.save(); ctx.fillStyle = p%2 ? 'rgba(255,165,0,.55)' : 'rgba(94,200,255,.55)';
    ctx.fillRect(x, sy-24+(p%2?6:0), pw, 44-(p%2?6:0)); ctx.restore(); }
  var xe=sx0+30+plates*(pw+gap);
  C.arrow(ctx, sx0, sy, sx0+26, sy, RD, 2.6);
  C.arrow(ctx, xe+26, sy, xe+2, sy, RD, 2.6);
  C.mono(ctx,'F', sx0+4, sy-8, RD, 11);

  /* ---------- p(r) for begge modeller ---------- */
  var gx0=356, gx1=W-22, gy0=48, gy1=300;
  var pm=Math.max(r.pmaxW, r.pP)*1.2;
  function GX(rr){ return gx0 + (rr)/(r.ro*1.05)*(gx1-gx0); }
  function GY(p){ return gy1 - p/pm*(gy1-gy0); }
  C.axes(ctx, gx0, gy0-10, gx1, gy1, 'r [mm]', 'p [MPa]');
  C.txt(ctx,'Trykfordeling ved samme F', gx0+10, 22, DIM, 11);
  // ensformigt tryk
  C.poly(ctx, [[GX(r.ri),GY(0)],[GX(r.ri),GY(r.pP)],[GX(r.ro),GY(r.pP)],[GX(r.ro),GY(0)]], CY, 'rgba(94,200,255,.1)', 2.2);
  // ensformigt slid
  var wp=[[GX(r.ri),GY(0)]];
  for (var j=0;j<=50;j++){ var rr2=r.ri+(r.ro-r.ri)*j/50; wp.push([GX(rr2), GY(r.pmaxW*r.ri/rr2)]); }
  wp.push([GX(r.ro),GY(0)]);
  C.poly(ctx, wp, GO, 'rgba(255,165,0,.12)', 2.4);
  C.line(ctx, GX(r.rW), gy1, GX(r.rW), gy0, GR, 1.2, [4,3]);
  C.mono(ctx,'rm', GX(r.rW)+4, gy0+10, GR, 10);
  C.mono(ctx,'pmax='+Eks.num(r.pmaxW,3), GX(r.ri)+6, GY(r.pmaxW)-6, GO, 10);
  C.mono(ctx,'p='+Eks.num(r.pP,3), GX(r.ro)-4, GY(r.pP)-6, CY, 10, 'right');
  C.mono(ctx,'ri', GX(r.ri), gy1+13, DIM, 9, 'center');
  C.mono(ctx,'ro', GX(r.ro), gy1+13, DIM, 9, 'center');
  C.txt(ctx,'— ensformigt slid (p·r = konst.)', gx0+8, gy1+36, GO, 11, 'left', true);
  C.txt(ctx,'— ensformigt tryk (ny kobling)', gx0+8, gy1+52, CY, 11, 'left', true);
  C.txt(ctx,'T slid = '+Eks.num(r.Tw/1000,1)+' N·m    T tryk = '+Eks.num(r.Tp/1000,1)+' N·m', gx0+8, gy1+76, '#e3ebf3', 12, 'left', true);
}
};
</script>
