    const tb = L('balance').start;
    const r = text(1, 'W (h + δ) = ½ k δ²', 560, 230, 48, 'red', tb + 0.3, we('balance', 'anden'));

  B.goto('tjek_q', 2);
  B.tjek(2, ['Meget stiv konstruktion,', 'lille δ_{st}. Og V_f?'], ['V_f bliver meget stor', '2h/δ_{st} vokser'], 'tjek_q', 'tjek_a');

  B.goto('slut', 3);
  B.slut(3, 'Abou-Hayt (2026), MEM1 Chapter 7, slide 29 · Hamrock, Schmid & Jacobson, kap. 7', 'stødeksemplet', 'slut');
  text(3, 'W(h + δ) = ½ k δ²', 200, 270, 46, 'blue', L('slut').start + 0.4, we('slut', 'anden'));
  text(3, 'V_f = 1 + √(1 + 2h/δ_{st}) ≥ 2', 200, 360, 44, 'red', wt('slut', 'stødfaktoren') - 0.1, we('slut', 'to'));
