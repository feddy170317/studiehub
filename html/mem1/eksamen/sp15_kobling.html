 {q:"Hvad er det optimale forhold mellem rᵢ og rₒ?",

sammenhaeng: "Koblingen forbinder <b>friktion</b> (som i bevægelsesskruen, <b>spm. 13</b>, hvor friktion var et tab &mdash; her er den ønsket) med <b>slid</b> (Archards lov, kap. 8). Det overførte moment er præcis det $T$, akslen skal dimensioneres for (<b>spm. 9</b>), og spændkraften $F$ kommer typisk fra en fjeder (<b>spm. 14</b>: tallerkenfjedre eller skruefjedre). Remme (<b>spm. 16</b>) er den anden friktionsbaserede kraftoverførsel i pensum &mdash; der er tricket bare en eksponentialfunktion i stedet for et integral over radius.",

var LAB = {
w: 720, h: 440,
intro: "Ringen til venstre er farvet efter trykket ved ensformigt slid &mdash; mørkest inderst. Diagrammet til højre sammenligner de to trykfordelinger ved samme kraft $F$. Træk $r_i$ ned mod nul, og se forskellen mellem modellerne vokse; træk den op mod $r_o$, og se den forsvinde.",
preset2: {navn: "Fuld skive: rᵢ = 5 mm", v: {ri: 5}},

inputs: [
 {id:"N",  label:"Antal friktionsflader $N$",  min:1,   max:12,   step:1,    value:4,    unit:""},
 {id:"ri", label:"Inderradius $r_i$",          min:5,   max:150,  step:1,    value:50,   unit:"mm"},
 {id:"ro", label:"Yderradius $r_o$",           min:20,  max:200,  step:1,    value:100,  unit:"mm"},
 {id:"mu", label:"Friktionskoefficient $\\mu$", min:0.05,max:0.6,  step:0.01, value:0.30, dec:2, unit:""},
 {id:"F",  label:"Spændkraft $F$",             min:100, max:10000,step:50,   value:2000, unit:"N"}
],

compute: function (v) {
  var ri = Math.min(v.ri, v.ro - 1), ro = v.ro;
  var Tw = v.N * v.mu * v.F * (ro + ri) / 2;
  var Tp = v.N * v.mu * v.F * (2 / 3) * (Math.pow(ro, 3) - Math.pow(ri, 3)) / (ro * ro - ri * ri);
  var pmaxW = v.F / (2 * Math.PI * ri * (ro - ri));
  var pP = v.F / (Math.PI * (ro * ro - ri * ri));
  return { ri:ri, ro:ro, Tw:Tw, Tp:Tp, pmaxW:pmaxW, pP:pP, rW:(ro + ri) / 2,
           rP:(2 / 3) * (Math.pow(ro, 3) - Math.pow(ri, 3)) / (ro * ro - ri * ri) };
},

readout: function (v, r) {
  return [
   {l:"$T$ ensformigt slid", v:r.Tw/1000, dec:1, unit:"N·m", k:"hi"},
   {l:"$T$ ensformigt tryk", v:r.Tp/1000, dec:1, unit:"N·m"},
   {l:"Forhold slid/tryk", v:r.Tw/r.Tp, dec:4, unit:""},
   {l:"Friktionsradius (slid)", v:r.rW, dec:1, unit:"mm"},
   {l:"Friktionsradius (tryk)", v:r.rP, dec:1, unit:"mm"},
   {l:"$p_{max}$ ved $r_i$ (slid)", v:r.pmaxW, dec:4, unit:"MPa"},
   {l:"$p$ ensformigt tryk", v:r.pP, dec:4, unit:"MPa"}
  ];
},

steps: function (v, r) {
  var T = Eks.tnum;
  return [
   {h:"1 · Middelradius",
    m:"r_m=\\frac{r_o+r_i}{2}=\\frac{"+T(r.ro,0)+"+"+T(r.ri,0)+"}{2}="+T(r.rW,1)+"\\ \\text{mm}",
    c:"Den effektive friktionsradius ved ensformigt slid."},
   {h:"2 · Moment ved ensformigt slid",
    m:"T=N\\mu F\\,\\frac{r_o+r_i}{2}="+T(v.N,0)+"\\cdot"+T(v.mu,2)+"\\cdot"+T(v.F,0)+"\\cdot"+T(r.rW,1)+"="+T(r.Tw,0)+"\\ \\text{N·mm}="+T(r.Tw/1000,1)+"\\ \\text{N·m}",
    c:"Dimensionerende (konservativ) værdi."},
   {h:"3 · Til sammenligning: ensformigt tryk",
    m:"T=N\\mu F\\cdot\\tfrac23\\,\\frac{r_o^3-r_i^3}{r_o^2-r_i^2}="+T(v.N*v.mu*v.F,0)+"\\cdot"+T(r.rP,2)+"="+T(r.Tp/1000,1)+"\\ \\text{N·m}",
    c:"Forholdet slid/tryk er "+Eks.num(r.Tw/r.Tp,3)+"."},
   {h:"4 · Maksimaltryk ved indersiden",
    m:"p_{max}=\\frac{F}{2\\pi r_i(r_o-r_i)}=\\frac{"+T(v.F,0)+"}{2\\pi\\cdot"+T(r.ri,0)+"\\cdot"+T(r.ro-r.ri,0)+"}="+T(r.pmaxW,4)+"\\ \\text{MPa}",
    c:"Det er det, belægningen skal tåle."}
  ];
},

facit: function (v, r) {
  if (v.N===4 && v.ri===50 && v.ro===100 && Math.abs(v.mu-0.30)<1e-9 && v.F===2000) {
    return {t:"<b>✓ Eksamensopgavens facit:</b> $T=4\\cdot0{,}30\\cdot2000\\cdot\\frac{100+50}{2}=180\\,000$ N·mm $=180$ N·m. Med ensformigt tryk ville det være 186,7 N·m &mdash; slidmodellen er 3,6 % mere konservativ. Maksimaltrykket ved indersiden er 0,127 MPa."};
  }
  return {off:true, t:"Du har ændret inddata. Tryk på knappen for at komme tilbage til eksamensopgavens tal."};
},

draw: function (ctx, W, H, v, r, C) {
  C.grid(ctx, W, H, 40);
  var CY='#5ec8ff', GR='#00d984', GO='#ffa500', RD='#ff5e5e', PU='#d984ff', DIM='rgba(227,235,243,.45)';

  /* ---------- friktionsfladen, farvet efter p (slid) ---------- */
  var cx=150, cy=178, Ro=132, Ri=Ro*r.ri/r.ro;
  C.txt(ctx,'Friktionsflade — tryk ved ensformigt slid', cx, 22, DIM, 11, 'center');
  var n=40;
  for (var k=0;k<n;k++){
    var ra=Ri+(Ro-Ri)*k/n, rb=Ri+(Ro-Ri)*(k+1)/n, rr=r.ri+(r.ro-r.ri)*(k+0.5)/n;
    var s=(r.ri/rr - r.ri/r.ro)/Math.max(1 - r.ri/r.ro, 1e-6);    // 1 ved indersiden, 0 ved ydersiden
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,rb,0,2*Math.PI); ctx.arc(cx,cy,ra,0,2*Math.PI,true);
    ctx.fillStyle='rgba(255,'+Math.round(200-150*s)+','+Math.round(90-60*s)+','+(0.25+0.6*s)+')'; ctx.fill(); ctx.restore();
  }
  C.circle(ctx, cx, cy, Ro, '#e3ebf3', null, 1.5);
  C.circle(ctx, cx, cy, Ri, '#e3ebf3', null, 1.5);
  // friktionskraefter (tangentielle) ved tre radier
  [0.15,0.5,0.85].forEach(function(f){ var rp=Ri+(Ro-Ri)*f, rrmm=r.ri+(r.ro-r.ri)*f, pr=r.ri/rrmm;
    for (var a=0;a<6;a++){ var th=a/6*2*Math.PI+f; var x=cx+Math.cos(th)*rp, y=cy+Math.sin(th)*rp, L=8+16*pr;
      C.arrow(ctx, x, y, x-Math.sin(th)*L, y+Math.cos(th)*L, GO, 1.5, 5); } });
  C.circle(ctx, cx, cy, (Ri+Ro)/2, GR, null, 1.3, [5,4]);
  C.mono(ctx,'rm='+Eks.num(r.rW,0), cx, cy-(Ri+Ro)/2-6, GR, 10, 'center');
  C.mono(ctx,'ri', cx+Ri*0.7, cy+Ri*0.7, '#e3ebf3', 10);
  C.mono(ctx,'ro', cx+Ro*0.72, cy+Ro*0.72+10, '#e3ebf3', 10);

  /* ---------- lamelpakke ---------- */
  var sx0=40, sy=H-58, nf=Math.round(v.N), plates=nf+1, pw=Math.min(22, 250/plates), gap=4;
  C.txt(ctx,'Lamelpakke: '+plates+' plader → '+nf+' friktionsflader', sx0, sy-38, DIM, 10);
  for (var p=0;p<plates;p++){ var x=sx0+30+p*(pw+gap);
    ctx.save(); ctx.fillStyle = p%2 ? 'rgba(255,165,0,.55)' : 'rgba(94,200,255,.55)';
    ctx.fillRect(x, sy-24+(p%2?6:0), pw, 44-(p%2?6:0)); ctx.restore(); }
  var xe=sx0+30+plates*(pw+gap);
  C.arrow(ctx, sx0, sy, sx0+26, sy, RD, 2.6);
  C.arrow(ctx, xe+26, sy, xe+2, sy, RD, 2.6);
  C.mono(ctx,'F', sx0+4, sy-8, RD, 11);

  /* ---------- p(r) for begge modeller ---------- */
  var gx0=356, gx1=W-22, gy0=48, gy1=300;
  var pm=Math.max(r.pmaxW, r.pP)*1.2;
  function GX(rr){ return gx0 + (rr)/(r.ro*1.05)*(gx1-gx0); }
  function GY(p){ return gy1 - p/pm*(gy1-gy0); }
  C.axes(ctx, gx0, gy0-10, gx1, gy1, 'r [mm]', 'p [MPa]');
  C.txt(ctx,'Trykfordeling ved samme F', gx0+10, 22, DIM, 11);
  // ensformigt tryk
  C.poly(ctx, [[GX(r.ri),GY(0)],[GX(r.ri),GY(r.pP)],[GX(r.ro),GY(r.pP)],[GX(r.ro),GY(0)]], CY, 'rgba(94,200,255,.1)', 2.2);
  // ensformigt slid
  var wp=[[GX(r.ri),GY(0)]];
  for (var j=0;j<=50;j++){ var rr2=r.ri+(r.ro-r.ri)*j/50; wp.push([GX(rr2), GY(r.pmaxW*r.ri/rr2)]); }
  wp.push([GX(r.ro),GY(0)]);
  C.poly(ctx, wp, GO, 'rgba(255,165,0,.12)', 2.4);
  C.line(ctx, GX(r.rW), gy1, GX(r.rW), gy0, GR, 1.2, [4,3]);
  C.mono(ctx,'rm', GX(r.rW)+4, gy0+10, GR, 10);
  C.mono(ctx,'pmax='+Eks.num(r.pmaxW,3), GX(r.ri)+6, GY(r.pmaxW)-6, GO, 10);
  C.mono(ctx,'p='+Eks.num(r.pP,3), GX(r.ro)-4, GY(r.pP)-6, CY, 10, 'right');
  C.mono(ctx,'ri', GX(r.ri), gy1+13, DIM, 9, 'center');
  C.mono(ctx,'ro', GX(r.ro), gy1+13, DIM, 9, 'center');
  C.txt(ctx,'— ensformigt slid (p·r = konst.)', gx0+8, gy1+36, GO, 11, 'left', true);
  C.txt(ctx,'— ensformigt tryk (ny kobling)', gx0+8, gy1+52, CY, 11, 'left', true);
  C.txt(ctx,'T slid = '+Eks.num(r.Tw/1000,1)+' N·m    T tryk = '+Eks.num(r.Tp/1000,1)+' N·m', gx0+8, gy1+76, '#e3ebf3', 12, 'left', true);
}
};
</script>
