<script>
var QDATA = {
nr: 16,
titel: "Kraftoverførsel og remfriktion i flade remme",
kapitel: 19,
kapitelNavn: "Fleksible maskinelementer",
mappe: "Spørgsmål 16 - Remtræk",
prev: "sp15_kobling.html",
bog: "Kap. 19: §19.2 <i>Flat Belts</i>, §19.2.2 <i>Belt Forces</i> (inkl. centrifugalkraft), s. 549 &middot; §19.2.3 <i>Slip</i>, s. 550.",

spmA: "Udled sammenhængen for remfriktion $\\frac{F_1-F_c}{F_2-F_c}=e^{\\mu\\phi}$ for flade remme. Forklar, hvordan centrifugalkraften påvirker kapaciteten for kraftoverførsel ved høje hastigheder.",
spmB: "Et fladremstræk ved lav hastighed ($F_c\\approx0$) har omslutningsvinklen $\\phi=\\pi$ rad (180°) og friktionskoefficienten $\\mu=0{,}35$ ($e^{0{,}35\\pi}\\approx3{,}0$). Den maksimalt tilladte remkraft er $F_1=3000$ N. Bestem den mindste kraft i slækparten $F_2$ og det maksimale moment $T$, der kan overføres af en remskive med radius $r=0{,}2$ m.",

oversat: "En rem overfører moment, fordi den ene part (den stramme, $F_1$) trækker hårdere end den anden (den slappe, $F_2$). Forskellen gange radius er momentet. Men hvor stor kan forskellen blive, før remmen glider? Det afhænger af friktionen og af, hvor meget af skiven remmen ligger rundt om. Del (a): udled den berømte eksponentialsammenhæng (samme fysik som et reb om en pullert) og forklar, hvorfor en hurtigtløbende rem mister greb: centrifugalkraften løfter den fra skiven. Del (b): to indsætninger.",
kerne: "Friktion om en bue forstærker eksponentielt: hvert lille stykke rem kan tåle en lidt større kraftforskel, og det ganges op. Centrifugalkraften trækker et fast beløb fra begge parter, som ikke bidrager til greb.",

historie: [
 {h:"Hvor momentet kommer fra",
  t:"Remskiven drejes, fordi remmen trækker i den med $F_1$ på den ene side og $F_2$ på den anden. Nettokraften $F_1-F_2$ virker med armen $r$, så $T=(F_1-F_2)r$. Uden forskel intet moment. Men forskellen kan kun eksistere, fordi friktionen mellem rem og skive holder på den &mdash; ellers ville remmen bare glide rundt."},
 {h:"Rebet om pullerten",
  t:"En sømand kan holde et stort skib med ét reb viklet et par gange om en pullert. Kraften i rebet falder <b>eksponentielt</b> for hver vinding: hvert lille stykke reb presses mod pullerten af rebkraften selv, og friktionen på det stykke tager en fast <i>procentdel</i> af kraften. Procent af procent er eksponentiel vækst. For en rem gælder præcis det samme: $F_1/F_2=e^{\\mu\\phi}$."},
 {h:"Hvorfor centrifugalkraften stjæler kapacitet",
  t:"En rem, der løber rundt om en skive, har masse. Den vil gerne flyve ud af cirkelbanen, og derfor trækker centrifugalkraften i remmen: $F_c=m'v^2$. Den lægger sig oven i begge parter som en ekstra, ens kraft. Men den <b>presser ikke remmen mod skiven</b> &mdash; den gør det modsatte. Kun den del af trækket, der overstiger $F_c$, giver normalkraft og dermed friktion. Derfor står $F_c$ trukket fra i begge led."},
 {h:"Effekten har et maksimum",
  t:"Effekten er $P=(F_1-F_2)v$. Ved lav hastighed stiger den med $v$. Men remmen tåler kun $F_1=F_{max}$, og jo hurtigere den kører, jo mere af $F_{max}$ går til centrifugalkraften. Ved $v=\\sqrt{F_{max}/(3m')}$ er effekten størst; derover falder den igen. Det er grunden til, at fladremme har en optimal hastighed, typisk 20&ndash;30 m/s."}
],
analogi: "Et reb om et træ: du kan holde en tung last med lille kraft, hvis rebet går én gang rundt. To gange rundt, og du kan holde endnu mere &mdash; eksponentielt mere. Omslutningsvinklen er antallet af &bdquo;gange rundt&ldquo;.",

plan: [
 {t:"0&ndash;2 min", k:"warm", w:"Tegn remskiven",
  d:"Skive med radius $r$, rem med stram part $F_1$ og slap part $F_2$, omslutningsvinklen $\\phi$. $T=(F_1-F_2)r$. Sig: &bdquo;Momentet er forskellen i remkraft gange radius.&ldquo;"},
 {t:"2&ndash;7 min", w:"Frilegeme af et remelement",
  d:"Element med vinklen $d\\theta$: $F$ og $F+dF$ i enderne, normalkraft $dN$, friktion $\\mu dN$, centrifugalkraft $m'v^2d\\theta$ udad. Radial ligevægt: $dN=(F-m'v^2)d\\theta$. Tangential: $dF=\\mu dN$."},
 {t:"7&ndash;9 min", w:"Integrér",
  d:"$\\frac{dF}{F-F_c}=\\mu\\,d\\theta$ → $\\ln\\frac{F_1-F_c}{F_2-F_c}=\\mu\\phi$ → $\\frac{F_1-F_c}{F_2-F_c}=e^{\\mu\\phi}$. Peg på, at $F_c$ trækkes fra begge &mdash; den giver ikke greb."},
 {t:"9&ndash;11 min", w:"Centrifugalkraften og optimal hastighed",
  d:"$P=(F_1-F_c)(1-e^{-\\mu\\phi})v$ med $F_1=F_{max}$. Maksimum ved $v^*=\\sqrt{F_{max}/(3m')}$, hvor $F_c=F_{max}/3$. Tegn $P(v)$-kurven."},
 {t:"11&ndash;13 min", w:"Regn designopgaven",
  d:"$F_2=F_1/e^{\\mu\\phi}=3000/3=1000$ N. $T=(3000-1000)\\cdot0{,}2=400$ N·m. Forspænding $F_i=(F_1+F_2)/2=2000$ N, akselbelastning $F_1+F_2=4000$ N."},
 {t:"13&ndash;20 min", k:"end", w:"Pointe og spørgsmål",
  d:"&bdquo;Akslen skal bære $F_1+F_2=4000$ N, dobbelt så meget som nettokraften, der overfører momentet. Det er remtrækkets skjulte pris &mdash; og grunden til, at tandremme og kæder findes.&ldquo;"}
],

trin: [
 {t:"Momentet fra remkræfterne",
  m:"T=(F_1-F_2)\\,r,\\qquad P=(F_1-F_2)\\,v",
  hvorfor:"Den stramme part trækker skiven den ene vej, den slappe den anden. Kun forskellen overfører moment. Det er værd at sige med det samme, fordi resten af udledningen handler om, hvor stor forskellen <i>kan</i> blive.",
  sig:"Momentet er forskellen mellem den stramme og den slappe part gange radius."},

 {t:"Frilegeme af et lille remstykke",
  m:["\\text{radialt:}\\quad dN+m'v^2\\,d\\theta=(2F+dF)\\sin\\tfrac{d\\theta}{2}\\approx F\\,d\\theta",
     "\\text{tangentialt:}\\quad dF=\\mu\\,dN"],
  hvorfor:"Remstykket spænder vinklen $d\\theta$. Trækkene $F$ og $F+dF$ har hver en lille komposant ind mod centrum, der tilsammen er $F\\,d\\theta$. Den presser remmen mod skiven, men centrifugalkraften $m'v^2d\\theta$ (masse $m'r\\,d\\theta$ gange centripetalacceleration $v^2/r$) trækker den den anden vej. Resten er normalkraften. Ved glidningsgrænsen er friktionen fuldt udnyttet: $dF=\\mu dN$.",
  sig:"Remkræfterne presser stykket mod skiven, centrifugalkraften trækker det væk. Forskellen er normalkraften, og ved glidning er friktionen my gange normalkraften."},

 {t:"Sæt sammen til en differentialligning",
  m:"dF=\\mu\\,(F-m'v^2)\\,d\\theta\\quad\\Rightarrow\\quad\\frac{dF}{F-F_c}=\\mu\\,d\\theta,\\qquad F_c=m'v^2",
  hvorfor:"Indsæt $dN$ fra den radiale ligning. Separation af de variable: alle $F$ på venstre side, alle $\\theta$ på højre. $F_c=m'v^2$ er centrifugaltrækket i remmen &mdash; en konstant, der ikke afhænger af $\\theta$.",
  sig:"Jeg indsætter normalkraften og separerer de variable. Centrifugalkraften optræder som en konstant, der trækkes fra remkraften."},

 {t:"Integrér over omslutningsvinklen",
  m:["\\int_{F_2}^{F_1}\\frac{dF}{F-F_c}=\\mu\\int_0^{\\phi}d\\theta\\quad\\Rightarrow\\quad\\ln\\frac{F_1-F_c}{F_2-F_c}=\\mu\\phi",
     "\\boxed{\\ \\frac{F_1-F_c}{F_2-F_c}=e^{\\mu\\phi}\\ }"],
  hvorfor:"Fra slap part ($\\theta=0$, $F=F_2$) til stram part ($\\theta=\\phi$, $F=F_1$). Naturlig logaritme, så eksponentialfunktion. Det er Euler&ndash;Eytelweins formel (kapstanformlen) med centrifugalkorrektion. Bemærk: $r$ indgår slet ikke &mdash; kun friktion og vinkel.",
  sig:"Integrerer jeg fra den slappe til den stramme part, får jeg en logaritme og dermed eksponentialsammenhængen. Radius indgår ikke."},

 {t:"Centrifugalkraften og kapaciteten",
  m:["F_1-F_2=(F_1-F_c)\\left(1-e^{-\\mu\\phi}\\right)",
     "P=(F_{max}-m'v^2)\\left(1-e^{-\\mu\\phi}\\right)v\\quad\\Rightarrow\\quad\\frac{dP}{dv}=0:\\ \\ v^*=\\sqrt{\\frac{F_{max}}{3m'}}"],
  hvorfor:"$F_1$ er begrænset af remmens styrke. Jo hurtigere remmen kører, jo større del af $F_1$ er centrifugalkraft, der ikke giver greb, så $F_1-F_2$ falder. Effekten vokser først lineært med $v$ og falder så. Ved den optimale hastighed er præcis en tredjedel af remmens kapacitet brugt på centrifugalkraft.",
  sig:"Centrifugalkraften æder af den kraft, der kan overføre moment. Effekten har derfor et maksimum ved en bestemt hastighed, hvor centrifugalkraften er en tredjedel af den tilladte remkraft."}
],

faldgruber: [
 {t:"φ i radianer", d:"$\\mu\\phi=0{,}35\\cdot\\pi=1{,}10$, ikke $0{,}35\\cdot180=63$. $e^{63}$ er et astronomisk tal &mdash; en god indikator på, at noget er galt."},
 {t:"Hvilken skive tæller?", d:"Ved to forskellige skiver er omslutningsvinklen mindst på den <b>lille</b> skive, og det er dér, remmen glider først. Brug den mindste $\\phi$."},
 {t:"Fc trækkes fra begge", d:"Ved høj hastighed: $(F_1-F_c)/(F_2-F_c)=e^{\\mu\\phi}$, ikke $F_1/F_2$. Opgaven siger $F_c\\approx0$, så her er det simpelt &mdash; men sig at du ved, den findes."},
 {t:"T bruger forskellen, ikke F₁", d:"$T=(F_1-F_2)r=400$ N·m, ikke $F_1r=600$ N·m."},
 {t:"Akselbelastningen", d:"Akslen og lejerne skal bære $F_1+F_2$ (ved parallelle parter), ikke $F_1-F_2$. Det er 4000 N her &mdash; dobbelt så meget som nettokraften."}
],

qa: [
 {q:"Hvad er den nødvendige forspænding?",
  a:"Ved $F_c=0$ er $F_i=(F_1+F_2)/2=2000$ N. Remmen skal forspændes, så den stramme part kan stige og den slappe falde, når der overføres moment. For lidt forspænding → remmen glider. For meget → lejer og rem overbelastes."},
 {q:"Hvordan øger man kapaciteten uden stærkere rem?",
  a:"Øg $\\mu\\phi$: større omslutningsvinkel (spændhjul, der presser remmen om skiven), eller højere friktion (kilerem: kilevirkningen giver effektivt $\\mu/\\sin(\\beta/2)$, ca. 3 gange så meget). Eller skift til tandrem, der ikke er friktionsbaseret."},
 {q:"Hvad er glidning, og hvorfor sker det altid lidt?",
  a:"Remmen er elastisk: den strækkes mere i den stramme part end i den slappe. Når den løber over skiven, trækker den sig sammen og glider lidt (krybning, ca. 1&ndash;2 %). Det er derfor, remtræk ikke giver præcist omsætningsforhold. Egentlig glidning (&bdquo;slip&ldquo;) sker, når $F_1/F_2>e^{\\mu\\phi}$."},
 {q:"Hvor meget effekt kan remmen overføre ved 10 m/s?",
  a:"Ved lav hastighed: $P=(F_1-F_2)v=2000\\cdot10=20$ kW. Med centrifugalkraft og fx $m'=0{,}5$ kg/m bliver $F_c=50$ N, og $P=(3000-50)(1-1/3{,}0)\\cdot10\\approx19{,}7$ kW."},
 {q:"Hvorfor indgår radius ikke i eksponentialformlen?",
  a:"Fordi en større skive både giver længere kontaktlængde og mindre normaltryk pr. længde &mdash; de to ophæver hinanden. Kun vinklen tæller. Radius kommer først ind, når man går fra kraft til moment."},
 {q:"Hvordan hænger remmen sammen med akslen og lejerne?",
  a:"$F_1+F_2$ bøjer akslen (spm. 9) og belaster lejerne radialt (spm. 10). En høj forspænding forkorter lejelevetiden med tredje potens af lasten. Det er en af grundene til, at man vælger kilerem eller tandrem."}
],

sammenhaeng: "Remtrækket er den anden friktionsbaserede kraftoverførsel i pensum (den første er koblingen, <b>spm. 15</b>) og bruger samme grundidé: friktion = $\\mu\\times$ normalkraft, integreret over kontaktområdet. Momentet $T=(F_1-F_2)r$ er det, akslen skal overføre (<b>spm. 9</b>), mens summen $F_1+F_2$ bøjer akslen og bestemmer lejernes last og dermed deres levetid (<b>spm. 10</b>). Og remmen udsættes for cyklisk bøjning hver gang den løber over en skive &mdash; udmattelse (<b>spm. 6</b>) bestemmer dens levetid.",

links: [
 {k:"SPM 15", t:"Kobling: friktion over en flade", u:"sp15_kobling.html"},
 {k:"SPM 10", t:"F₁ + F₂ belaster lejerne", u:"sp10_rulleleje.html"},
 {k:"SPM 9", t:"Akslen bærer momentet og bøjningen", u:"sp09_akseldesign.html"},
 {k:"WIDGET", t:"Remtræk", u:"../interaktiv/remtraek.html"},
 {k:"KAP. 19", t:"Formeloverblik (PDF)", u:"../Kapitel19_Overblik.pdf"},
 {k:"KAP. 19", t:"Quiz", u:"../../../quiz/mem1/Kapitel19_Quiz.html"}
]
};

var LAB = {
w: 720, h: 440,
intro: "Til venstre vokser remkraften eksponentielt rundt om skiven fra $F_2$ til $F_1$ (tykkelse og farve). Øverst til højre er den samme kurve som funktion af vinklen. Nederst til højre er effekten mod remhastighed: <b>centrifugalkraften</b> giver et maksimum. Opgaven er ved lav hastighed ($v=0$ → $F_c=0$); skru op for $v$ og se, hvordan grebet forsvinder.",
preset2: {navn: "Høj hastighed: v = 40 m/s", v: {v: 40}},

inputs: [
 {id:"F1",  label:"Tilladt remkraft $F_1$",     min:500, max:8000, step:50,  value:3000, unit:"N"},
 {id:"mu",  label:"Friktionskoefficient $\\mu$", min:0.1, max:0.8,  step:0.01,value:0.35, dec:2, unit:""},
 {id:"phi", label:"Omslutningsvinkel $\\phi$",   min:60,  max:300,  step:5,   value:180,  unit:"°"},
 {id:"r",   label:"Skiveradius $r$",             min:0.05,max:0.5,  step:0.01,value:0.2,  dec:2, unit:"m"},
 {id:"v",   label:"Remhastighed $v$",            min:0,   max:60,   step:1,   value:0,    unit:"m/s"},
 {id:"m",   label:"Remmasse $m'$",               min:0.1, max:2,    step:0.05,value:0.5,  dec:2, unit:"kg/m"}
],

compute: function (v) {
  var ph = v.phi * Math.PI / 180, ex = Math.exp(v.mu * ph);
  var Fc = v.m * v.v * v.v;
  var F2 = Fc + (v.F1 - Fc) / ex;
  var T = (v.F1 - F2) * v.r;
  var P = (v.F1 - F2) * v.v;
  var vopt = Math.sqrt(v.F1 / (3 * v.m));
  var Popt = (v.F1 - v.m * vopt * vopt) * (1 - 1 / ex) * vopt;
  return { ph:ph, ex:ex, Fc:Fc, F2:F2, T:T, P:P, vopt:vopt, Popt:Popt, Fi:(v.F1 + F2) / 2, Fs:v.F1 + F2, ok: Fc < v.F1 };
},

readout: function (v, r) {
  return [
   {l:"$e^{\\mu\\phi}$", v:r.ex, dec:4, unit:""},
   {l:"Slap part $F_2$", v:r.F2, dec:1, unit:"N", k:"hi"},
   {l:"Moment $T=(F_1-F_2)r$", v:r.T, dec:1, unit:"N·m", k:"hi"},
   {l:"Centrifugal $F_c=m'v^2$", v:r.Fc, dec:1, unit:"N", k: r.ok?"":"warn"},
   {l:"Effekt $P$", v:r.P/1000, dec:2, unit:"kW"},
   {l:"Forspænding $F_i$", v:r.Fi, dec:0, unit:"N"},
   {l:"Akselbelastning $F_1+F_2$", v:r.Fs, dec:0, unit:"N"},
   {l:"Optimal $v^*$ / $P_{max}$", raw: Eks.num(r.vopt,1)+" m/s / "+Eks.num(r.Popt/1000,1), unit:"kW"}
  ];
},

steps: function (v, r) {
  var T = Eks.tnum;
  return [
   {h:"1 · Friktionsforstærkningen",
    m:"e^{\\mu\\phi}=e^{"+T(v.mu,2)+"\\cdot"+T(r.ph,4)+"}=e^{"+T(v.mu*r.ph,4)+"}="+T(r.ex,4),
    c:"$\\phi="+Eks.num(v.phi,0)+"°="+Eks.num(r.ph,4)+"$ rad. Opgaven afrunder $e^{0{,}35\\pi}$ til 3,0."},
   {h:"2 · Centrifugalkraft",
    m:"F_c=m'v^2="+T(v.m,2)+"\\cdot"+T(v.v,0)+"^2="+T(r.Fc,1)+"\\ \\text{N}",
    c: v.v===0 ? "Lav hastighed: $F_c=0$, som i opgaven." : "Trækkes fra begge parter &mdash; giver ikke greb."},
   {h:"3 · Slap part",
    m:"F_2=F_c+\\frac{F_1-F_c}{e^{\\mu\\phi}}="+T(r.Fc,1)+"+\\frac{"+T(v.F1,0)+"-"+T(r.Fc,1)+"}{"+T(r.ex,4)+"}="+T(r.F2,1)+"\\ \\text{N}",
    c:"Den mindste kraft i slækparten, før remmen glider."},
   {h:"4 · Maksimalt moment",
    m:"T=(F_1-F_2)\\,r=("+T(v.F1,0)+"-"+T(r.F2,1)+")\\cdot"+T(v.r,2)+"="+T(r.T,1)+"\\ \\text{N·m}",
    c:"Nettokraften $F_1-F_2="+Eks.num(v.F1-r.F2,0)+"$ N gange radius."},
   {h:"5 · Akselbelastning og forspænding",
    m:"F_1+F_2="+T(r.Fs,0)+"\\ \\text{N},\\qquad F_i=\\frac{F_1+F_2}{2}="+T(r.Fi,0)+"\\ \\text{N}",
    c:"Det, lejerne og akslen skal bære."}
  ];
},

facit: function (v, r) {
  if (v.F1===3000 && Math.abs(v.mu-0.35)<1e-9 && v.phi===180 && Math.abs(v.r-0.2)<1e-9 && v.v===0) {
    return {t:"<b>✓ Eksamensopgavens facit:</b> $F_2=F_1/e^{\\mu\\phi}=3000/3{,}0=1000$ N og $T=(3000-1000)\\cdot0{,}2=400$ N·m. (Med den eksakte $e^{0{,}35\\pi}=3{,}003$: $F_2=999$ N, $T=400{,}2$ N·m.) Akselbelastning $F_1+F_2=4000$ N, forspænding 2000 N."};
  }
  if (!r.ok) return {off:true, t:"<b>Remmen har mistet grebet.</b> $F_c=m'v^2\\ge F_1$: hele den tilladte remkraft går til centrifugalkraft, og der er intet tilbage til at presse remmen mod skiven."};
  return {off:true, t:"Du har ændret inddata. Tryk på knappen for at komme tilbage til eksamensopgavens tal."};
},

draw: function (ctx, W, H, v, r, C) {
  C.grid(ctx, W, H, 40);
  var CY='#5ec8ff', GR='#00d984', GO='#ffa500', RD='#ff5e5e', PU='#d984ff', DIM='rgba(227,235,243,.45)';

  /* ---------- remskiven ---------- */
  var cx=176, cy=214, R=106;
  C.txt(ctx,'Remskive — remkraften vokser rundt om buen', cx, 22, DIM, 11, 'center');
  C.circle(ctx, cx, cy, R, CY, 'rgba(94,200,255,.08)', 2);
  C.circle(ctx, cx, cy, 8, CY, null, 1.5);
  // omslutning symmetrisk om bunden: fra (90° + phi/2) til (90° - phi/2) i canvas-vinkler
  var a0=Math.PI/2 + r.ph/2, a1=Math.PI/2 - r.ph/2, n=60;
  for (var i=0;i<n;i++){
    var t0=i/n, t1=(i+1)/n, th0=a0-(a0-a1)*t0, th1=a0-(a0-a1)*t1;
    var F=r.Fc+(r.F2-r.Fc)*Math.exp(v.mu*r.ph*(t0+t1)/2);           // fra F2 (venstre) til F1 (hoejre)
    var s=(F-r.F2)/Math.max(v.F1-r.F2,1e-6);
    ctx.save(); ctx.strokeStyle='rgba(255,'+Math.round(200-150*s)+','+Math.round(90-70*s)+',0.95)';
    ctx.lineWidth=4+8*s; ctx.beginPath(); ctx.arc(cx, cy, R+6, th0, th1, true); ctx.stroke(); ctx.restore();
  }
  // frie parter (tangentielt, opad)
  function strand(th, F, lab, col){
    var x=cx+Math.cos(th)*(R+6), y=cy+Math.sin(th)*(R+6);
    var tx=Math.sin(th), ty=-Math.cos(th);                      // tangent
    if (ty>0){ tx=-tx; ty=-ty; }                               // peg opad/vaek
    var L=40+80*(F/Math.max(v.F1,1));
    C.arrow(ctx, x, y, x+tx*L, y+ty*L, col, 2.8);
    C.mono(ctx, lab+'='+Eks.num(F,0)+' N', x+tx*L+(tx>0?6:-6), y+ty*L-4, col, 11, tx>0?'left':'right');
  }
  strand(a0, r.F2, 'F2', GO);
  strand(a1, v.F1, 'F1', RD);
  C.mono(ctx,'φ='+Eks.num(v.phi,0)+'°', cx, cy+R+36, DIM, 11, 'center');
  C.mono(ctx,'T='+Eks.num(r.T,0)+' N·m', cx, cy+34, GR, 13, 'center');

  /* ---------- F(theta) ---------- */
  var gx0=392, gx1=W-22, gy0=44, gy1=196;
  C.axes(ctx, gx0, gy0-10, gx1, gy1, 'θ', 'F [N]');
  C.txt(ctx,'Remkraft rundt om buen', gx0+10, 22, DIM, 11);
  function GX(t){ return gx0 + t/r.ph*(gx1-gx0-10); }
  function GY(F){ return gy1 - F/(v.F1*1.1)*(gy1-gy0); }
  var pts=[]; for (var k=0;k<=60;k++){ var th=k/60*r.ph; pts.push([GX(th), GY(r.Fc+(r.F2-r.Fc)*Math.exp(v.mu*th))]); }
  C.poly(ctx, pts, GO, null, 2.6);
  C.line(ctx, gx0, GY(r.Fc), gx1-10, GY(r.Fc), PU, 1.2, [4,3]);
  if (r.Fc>1) C.mono(ctx,'Fc', gx1-12, GY(r.Fc)-5, PU, 10, 'right');
  C.mono(ctx,'F2', gx0+6, GY(r.F2)+14, GO, 10);
  C.mono(ctx,'F1', gx1-14, GY(v.F1)-6, RD, 10, 'right');

  /* ---------- P(v) ---------- */
  var hx0=392, hx1=W-22, hy0=254, hy1=H-36;
  C.axes(ctx, hx0, hy0-10, hx1, hy1, 'v [m/s]', 'P [kW]');
  C.txt(ctx,'Effekt mod remhastighed (centrifugal-effekten)', hx0+10, hy0-18, DIM, 11);
  var vmax=Math.sqrt(v.F1/v.m)*1.02, Pm=Math.max(r.Popt,1)*1.15;
  function HX(u){ return hx0 + u/vmax*(hx1-hx0-10); }
  function HY(P){ return hy1 - Math.max(P,0)/Pm*(hy1-hy0); }
  var pp=[]; for (var j=0;j<=80;j++){ var u=j/80*vmax; pp.push([HX(u), HY((v.F1-v.m*u*u)*(1-1/r.ex)*u)]); }
  C.poly(ctx, pp, GR, null, 2.6);
  C.line(ctx, HX(r.vopt), hy1, HX(r.vopt), HY(r.Popt), GR, 1.2, [3,3]);
  C.mono(ctx,'v*='+Eks.num(r.vopt,1), HX(r.vopt), hy1+13, GR, 10, 'center');
  var vv=Math.min(v.v, vmax);
  C.circle(ctx, HX(vv), HY(r.P), 6, '#fff', PU, 2);
  C.mono(ctx,'P='+Eks.num(r.P/1000,1)+' kW', HX(vv)+(vv>vmax*0.6?-10:10), HY(r.P)-8, PU, 11, vv>vmax*0.6?'right':'left');
}
};
