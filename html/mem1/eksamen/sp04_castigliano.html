oversat: "I stedet for at regne bjælkens form ud punkt for punkt (dobbeltintegration med randbetingelser), regner du ud, <b>hvor meget energi der er gemt i den</b>. Castiglianos idé er genial i sin enkelhed: hvis du skruer en lille smule op for en kraft, stiger energien &mdash; og <i>hvor hurtigt</i> den stiger, er præcis hvor langt kraftens angrebspunkt flytter sig. Del (a): vis hvor energiformlen kommer fra, og hvorfor differentiation giver udbøjningen. Del (b): energien og udbøjningen for en udkraget bjælke med endelast.",
kerne: "Udbøjning = hvor følsom den lagrede energi er over for lasten: $\\delta=\\partial U/\\partial P$. Du behøver aldrig finde hele bjælkens kurve &mdash; kun momentet.",

historie: [
 {h:"Samme idé som i spørgsmål 2",
  t:"I spm. 2 lærte du, at et elastisk emne gemmer energien $u=\\sigma^2/(2E)$ pr. rumfang. En bøjet bjælke er ikke anderledes &mdash; spændingen varierer bare over tværsnittet ($\\sigma=My/I$) og langs bjælken ($M$ afhænger af $x$). Integrerer du $\\sigma^2/(2E)$ over hele rumfanget, falder $\\int y^2 dA=I$ ud af sig selv, og du står med $U=\\int M^2/(2EI)\\,dx$. Samme struktur: last i anden divideret med to gange stivhed."},
 {h:"Hvorfor differentiation giver udbøjningen",
  t:"Forestil dig, at du øger lasten med en lille smule $dP$. Kraften flytter sig $\\delta$ og udfører det ekstra arbejde $dP\\cdot\\delta$ (plus et andenordens led, der forsvinder). Det arbejde går ind som energi: $dU=\\delta\\,dP$. Del med $dP$: $\\delta=\\partial U/\\partial P$. Det er hele sætningen &mdash; energibevarelse set gennem et forstørrelsesglas."},
 {h:"Hvorfor metoden er så stærk",
  t:"Du skal kun kende momentet $M(x)$ &mdash; ikke løse en differentialligning med randbetingelser. Metoden virker lige godt på krumme bjælker, rammer og sammensatte konstruktioner. Og vil du kende udbøjningen et sted, hvor der <i>ikke</i> sidder en last, sætter du en fiktiv last $Q$ dér, differentierer og sætter $Q=0$ bagefter. Samme trick med et fiktivt moment giver vinkeldrejningen."},

],

  hvorfor:"Energitætheden fra spm. 2 med bøjningsspændingen fra spm. 3 indsat. Integralet over tværsnittet giver præcis inertimomentet. Læg mærke til mønsteret: (last)² divideret med 2·(stivhed) &mdash; for træk er det $F^2L/(2EA)$, for vridning $T^2L/(2GJ)$, for bøjning $M^2/(2EI)$ pr. længde.",

var LAB = {
w: 720, h: 470,
intro: "Skru på lasten, længden og stivheden. Nederste diagram viser <b>energitætheden</b> $M^2/(2EI)$ langs bjælken &mdash; arealet under kurven er $U$. Læg mærke til, hvordan energien klumper sig ved væggen, og hvordan $L$ i tredje potens slår igennem: gør bjælken dobbelt så lang, og udbøjningen bliver otte gange større.",
preset2: {navn: "Halv længde: L = 0,5 m", v: {L: 0.5}},

inputs: [
 {id:"P",  label:"Endelast $P$",          min:0,   max:1000, step:10,   value:300, unit:"N"},
 {id:"L",  label:"Længde $L$",            min:0.2, max:2,    step:0.05, value:1,   dec:2, unit:"m"},
 {id:"EI", label:"Bøjningsstivhed $EI$",  min:2,   max:40,   step:0.5,  value:10,  dec:1, unit:"kN·m²"}
],

compute: function (v) {
  var EI = v.EI * 1000;                       // N*m2
  var U = v.P * v.P * Math.pow(v.L, 3) / (6 * EI);   // J
  var d = v.P * Math.pow(v.L, 3) / (3 * EI);         // m
  var th = v.P * v.L * v.L / (2 * EI);               // rad
  var k = 3 * EI / Math.pow(v.L, 3);                 // N/m
  var Mmax = v.P * v.L;                               // N*m
  return { EI:EI, U:U, d:d, dmm:d * 1000, th:th, k:k, Mmax:Mmax, dmid: 5 * v.P * Math.pow(v.L,3) / (48 * EI) * 1000 };
},

readout: function (v, r) {
  return [
   {l:"Lagret energi $U$", v:r.U, dec:3, unit:"J", k:"hi"},
   {l:"Udbøjning $\\delta$ i spidsen", v:r.dmm, dec:2, unit:"mm", k:"hi"},
   {l:"Kontrol $2U/P$", raw: v.P>0 ? Eks.num(2*r.U/v.P*1000,2) : "--", unit:"mm"},
   {l:"$M_{max}$ ved væggen", v:r.Mmax, dec:0, unit:"N·m"},
   {l:"Vinkel $\\theta$ i spidsen", v:r.th*180/Math.PI, dec:3, unit:"°"},
   {l:"Stivhed $k=3EI/L^3$", v:r.k/1000, dec:2, unit:"N/mm"},
   {l:"δ midt på (fiktiv last)", v:r.dmid, dec:2, unit:"mm"}
  ];
},

steps: function (v, r) {
  var T = Eks.tnum;
  return [
   {h:"1 · Momentet (x målt fra spidsen)",
    m:"M(x)=-P\\,x=-"+T(v.P,0)+"\\,x\\quad\\Rightarrow\\quad |M_{max}|=P\\,L="+T(r.Mmax,0)+"\\ \\text{N·m}",
    c:"Og $\\partial M/\\partial P=-x$."},
   {h:"2 · Tøjningsenergien",
    m:"U=\\int_0^L\\frac{M^2}{2EI}dx=\\frac{P^2L^3}{6EI}=\\frac{"+T(v.P,0)+"^2\\cdot"+T(v.L,2)+"^3}{6\\cdot"+T(r.EI,0)+"}="+T(r.U,3)+"\\ \\text{J}",
    c:"$EI="+Eks.num(r.EI,0)+"$ N·m²."},
   {h:"3 · Udbøjningen via Castigliano",
    m:"\\delta=\\frac{\\partial U}{\\partial P}=\\frac{P\\,L^3}{3EI}=\\frac{"+T(v.P,0)+"\\cdot"+T(v.L,2)+"^3}{3\\cdot"+T(r.EI,0)+"}="+T(r.d,5)+"\\ \\text{m}="+T(r.dmm,2)+"\\ \\text{mm}",
    c:"Differentiér $P^2L^3/(6EI)$ med hensyn til $P$: faktoren 2 fra $P^2$ gør 6 til 3."},
   {h:"4 · Kontrol med Clapeyron",
    m:"\\tfrac12\\,P\\,\\delta=\\tfrac12\\cdot"+T(v.P,0)+"\\cdot"+T(r.d,5)+"="+T(0.5*v.P*r.d,3)+"\\ \\text{J}=U\\ \\checkmark",
    c:"Ydre arbejde = indre energi."},
   {h:"5 · Stivheden",
    m:"k=\\frac{P}{\\delta}=\\frac{3EI}{L^3}="+T(r.k/1000,2)+"\\ \\text{N/mm}",
    c:"$L^3$ i nævneren: det er længden, der styrer alt."}
  ];
},

facit: function (v, r) {
  if (v.P===300 && Math.abs(v.L-1)<1e-9 && Math.abs(v.EI-10)<1e-9) {
    return {t:"<b>✓ Eksamensopgavens facit:</b> $U=P^2L^3/(6EI)=1{,}5$ J og $\\delta=PL^3/(3EI)=0{,}010$ m $=10$ mm. Kontrol: $\\tfrac12P\\delta=\\tfrac12\\cdot300\\cdot0{,}010=1{,}5$ J ✓. Stivheden er $30$ N/mm."};
  }
  return {off:true, t:"Du har ændret inddata. Tryk på knappen for at komme tilbage til eksamensopgavens tal."};
},

draw: function (ctx, W, H, v, r, C) {
  C.grid(ctx, W, H, 40);
  var CY='#5ec8ff', GR='#00d984', GO='#ffa500', RD='#ff5e5e', PU='#d984ff', DIM='rgba(227,235,243,.45)';
  var x0=96, x1=W-70, Lpx=x1-x0;

  /* ---------- bjælken (nedbøjet, forstørret) ---------- */
  var by=92, sc=Math.min(7, 110/Math.max(r.dmm, 0.01));   // px pr. mm
  C.txt(ctx,'Udkraget bjælke — udbøjning forstørret ×'+Eks.num(sc,1)+' px/mm', x0, 26, DIM, 11);
  C.hatch(ctx, x0, by-38, by+38, DIM, 1);
  C.line(ctx, x0, by, x1, by, 'rgba(227,235,243,.25)', 1.2, [5,4]);
  var pts=[];
  for (var i=0;i<=60;i++){ var xi=i/60;   // fra vaeggen, 0..1
    var yv = r.dmm * xi*xi*(3-xi)/2;       // P x^2(3L-x)/(6EI), normaliseret til spidsen
    pts.push([x0+xi*Lpx, by+yv*sc]); }
  ctx.save(); ctx.lineCap='round';
  C.poly(ctx, pts, CY, null, 7); ctx.restore();
  var tipY = by + r.dmm*sc;
  C.arrow(ctx, x1, tipY-58, x1, tipY-8, GO, 2.8);
  C.mono(ctx,'P='+Eks.num(v.P,0)+' N', x1+8, tipY-44, GO, 11);
  C.dim(ctx, x1+36, by, x1+36, tipY, GR, null);
  C.mono(ctx,'δ='+Eks.num(r.dmm,2)+' mm', x1+40, (by+tipY)/2+12, GR, 11);
  C.mono(ctx,'L='+Eks.num(v.L,2)+' m', (x0+x1)/2, by-14, DIM, 10, 'center');

  /* ---------- momentdiagram ---------- */
  var my0=228, mh=70;
  C.txt(ctx,'Moment |M(x)| — størst ved væggen', x0, my0-mh-12, CY, 11);
  C.line(ctx, x0, my0, x1, my0, DIM, 1.2);
  C.poly(ctx, [[x0,my0],[x0,my0-mh],[x1,my0]], CY, 'rgba(94,200,255,.16)', 2);
  C.mono(ctx,'PL='+Eks.num(r.Mmax,0)+' N·m', x0+6, my0-mh+14, CY, 10);

  /* ---------- energitæthed ---------- */
  var ey0=H-44, eh=120;
  C.txt(ctx,'Energitæthed M²/(2EI) langs bjælken — arealet er U', x0, ey0-eh-14, GR, 11);
  C.line(ctx, x0, ey0, x1, ey0, DIM, 1.2);
  var ep=[[x0,ey0]];
  for (var j=0;j<=60;j++){ var s=j/60; ep.push([x0+s*Lpx, ey0-eh*(1-s)*(1-s)]); }
  ep.push([x1,ey0]);
  C.poly(ctx, ep, GR, 'rgba(0,217,132,.18)', 2);
  // halvdelsmarkering
  var xh=x0+Lpx/2;
  C.line(ctx, xh, ey0, xh, ey0-eh-4, PU, 1.3, [4,3]);
  C.txt(ctx,'7/8 af energien', x0+Lpx*0.18, ey0-10, PU, 11, 'center', true);
  C.txt(ctx,'1/8', xh+Lpx*0.18, ey0-10, PU, 11, 'center', true);
  C.mono(ctx,'U='+Eks.num(r.U,3)+' J', x1, ey0-eh+4, GR, 12, 'right');
  C.txt(ctx,'væg', x0, ey0+16, DIM, 10, 'center');
  C.txt(ctx,'spids', x1, ey0+16, DIM, 10, 'center');
}
};
</script>
