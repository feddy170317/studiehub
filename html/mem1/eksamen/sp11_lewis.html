  t:"Delecirklen er den tænkte cirkel, hvor to hjul ruller på hinanden uden at glide, som to friktionshjul. Kraften mellem tænderne virker ikke langs tangenten, men langs <b>indgrebslinjen</b>, der hælder med indgrebsvinklen $\\phi$ (standard 20°). Den samlede kraft $W$ deles i en tangential del $F_t=W\\cos\\phi$, som overfører momentet og bøjer tanden, og en radial del $F_r=F_t\\tan\\phi$, som skubber hjulene fra hinanden."},

/* Lewis formfaktor, 20° indgrebsvinkel, fuld tandhøjde */
var YTAB = [[12,.245],[13,.261],[14,.277],[15,.290],[16,.296],[17,.303],[18,.309],[19,.314],[20,.322],[21,.328],[22,.331],[24,.337],[26,.346],[28,.353],[30,.359],[34,.371],[38,.384],[43,.397],[50,.409],[60,.422],[75,.435],[100,.447],[150,.460],[300,.472],[400,.480]];
function Ytab(N){ if (N<=YTAB[0][0]) return YTAB[0][1];
  for (var i=1;i<YTAB.length;i++) if (N<=YTAB[i][0]) { var a=YTAB[i-1], b=YTAB[i]; return a[1]+(b[1]-a[1])*(N-a[0])/(b[0]-a[0]); }
  return YTAB[YTAB.length-1][1]; }

var LAB = {
w: 720, h: 440,
intro: "Til højre er tanden tegnet som udkraget bjælke med Lewis-parablen (stiplet). Skift <b>Y-kilde</b> til tabellen, og træk i tandantallet: med få tænder bliver foden smal og spændingen høj. Øg modulet, og hele tanden vokser &mdash; formen (og $Y$) er den samme, men spændingen falder.",
preset2: {navn: "Lille pinion: N = 12 (tabel-Y)", v: {N: 12, ysrc: 1}},

inputs: [
 {id:"m",    label:"Modul $m$",               min:1,   max:10,   step:0.5, value:4,    dec:1, unit:"mm"},
 {id:"b",    label:"Tandbredde $b$",           min:10,  max:120,  step:1,   value:40,   unit:"mm"},
 {id:"N",    label:"Antal tænder $N$",         min:12,  max:100,  step:1,   value:20,   unit:""},
 {id:"Ft",   label:"Tangentialkraft $F_t$",    min:100, max:8000, step:50,  value:1600, unit:"N"},
 {id:"ysrc", label:"Y-kilde",                  min:0,   max:1,    step:1,   value:0,    choices:["Opgavens Y (skyder nedenfor)", "Tabel, 20° fuld tandhøjde"]},
 {id:"Y",    label:"Formfaktor $Y$ (manuel)",  min:0.2, max:0.5,  step:0.01,value:0.32, dec:2, unit:""}
],

compute: function (v) {
  var Y = v.ysrc >= 0.5 ? Ytab(v.N) : v.Y;
  var sb = v.Ft / (v.b * v.m * Y);
  var d = v.m * v.N;
  var x = 1.5 * Y * v.m, l = 2.25 * v.m, t = 2 * Math.sqrt(l * x);
  return { Y:Y, sb:sb, d:d, p:Math.PI * v.m, T:v.Ft * d / 2 / 1000, Fr:v.Ft * Math.tan(20 * Math.PI / 180),
           W:v.Ft / Math.cos(20 * Math.PI / 180), x:x, l:l, t:t, Ytab:Ytab(v.N) };
},

readout: function (v, r) {
  return [
   {l:"Anvendt $Y$", v:r.Y, dec:3, unit:"", k:"hi"},
   {l:"Tabel-$Y$ for N = "+v.N+" (20°)", v:r.Ytab, dec:3, unit:""},
   {l:"Bøjningsspænding $\\sigma_b$", v:r.sb, dec:2, unit:"MPa", k:"hi"},
   {l:"Delediameter $d=mN$", v:r.d, dec:1, unit:"mm"},
   {l:"Deling $p=\\pi m$", v:r.p, dec:2, unit:"mm"},
   {l:"Moment $T=F_td/2$", v:r.T, dec:1, unit:"N·m"},
   {l:"Radialkraft $F_r$ (20°)", v:r.Fr, dec:0, unit:"N"},
   {l:"Lewis-mål $x$ / $t$", raw: Eks.num(r.x,2)+" / "+Eks.num(r.t,2), unit:"mm"}
  ];
},

steps: function (v, r) {
  var T = Eks.tnum;
  return [
   {h:"1 · Geometri",
    m:"d=m\\,N="+T(v.m,1)+"\\cdot"+T(v.N,0)+"="+T(r.d,1)+"\\ \\text{mm},\\qquad p=\\pi m="+T(r.p,2)+"\\ \\text{mm}",
    c:"Momentet der overføres: $T=F_t\\,d/2="+Eks.num(r.T,1)+"$ N·m."},
   {h:"2 · Lewis' ligning",
    m:"\\sigma_b=\\frac{F_t}{b\\,m\\,Y}=\\frac{"+T(v.Ft,0)+"}{"+T(v.b,0)+"\\cdot"+T(v.m,1)+"\\cdot"+T(r.Y,3)+"}="+T(r.sb,2)+"\\ \\text{MPa}",
    c:"Nævneren $b\\,m\\,Y="+Eks.num(v.b*v.m*r.Y,2)+"$ mm² er tandens &bdquo;effektive bøjningsareal&ldquo;."},
   {h:"3 · Hvad Y svarer til geometrisk",
    m:"x=\\tfrac32\\,Y\\,m="+T(r.x,2)+"\\ \\text{mm},\\qquad l\\approx2{,}25\\,m="+T(r.l,2)+",\\qquad t=2\\sqrt{l\\,x}="+T(r.t,2)+"\\ \\text{mm}",
    c:"Tandfodens bredde $t$ bag parablen, hvis lasten sidder i spidsen."},
   {h:"4 · Kontrol med bjælkeformlen",
    m:"\\sigma=\\frac{6F_tl}{bt^2}=\\frac{6\\cdot"+T(v.Ft,0)+"\\cdot"+T(r.l,2)+"}{"+T(v.b,0)+"\\cdot"+T(r.t,2)+"^2}="+T(6*v.Ft*r.l/(v.b*r.t*r.t),2)+"\\ \\text{MPa}",
    c:"Samme tal: Lewis <i>er</i> bøjningsformlen."}
  ];
},

facit: function (v, r) {
  if (v.m===4 && v.b===40 && v.N===20 && v.Ft===1600 && v.ysrc===0 && Math.abs(v.Y-0.32)<1e-9) {
    return {t:"<b>✓ Eksamensopgavens facit:</b> $\\sigma_b=\\frac{1600}{40\\cdot4\\cdot0{,}32}=\\frac{1600}{51{,}2}=31{,}25$ MPa. Delediameter $d=80$ mm, moment $T=64$ N·m. Med tabellens $Y=0{,}322$ bliver det 31,06 MPa."};
  }
  return {off:true, t:"Du har ændret inddata. Tryk på knappen for at komme tilbage til eksamensopgavens tal."};
},

draw: function (ctx, W, H, v, r, C) {
  C.grid(ctx, W, H, 40);
  var CY='#5ec8ff', GR='#00d984', GO='#ffa500', RD='#ff5e5e', PU='#d984ff', DIM='rgba(227,235,243,.45)';

  /* ---------- tandhjulet ---------- */
  var gx=150, gy=H/2+14, Rp=118, Nn=Math.round(v.N);
  var ra=Rp*(1+2/Nn), rf=Rp*(1-2.5/Nn), pitch=2*Math.PI/Nn;
  C.txt(ctx,'N = '+Nn+', d = mN = '+Eks.num(r.d,0)+' mm', gx, 24, DIM, 11, 'center');
  ctx.save(); ctx.beginPath();
  for (var i=0;i<Nn;i++){
    var a0=i*pitch - Math.PI/2;
    var pts=[[rf, a0-0.30*pitch],[rf, a0-0.25*pitch],[ra, a0-0.12*pitch],[ra, a0+0.12*pitch],[rf, a0+0.25*pitch],[rf, a0+0.30*pitch]];
    pts.forEach(function(q,k){ var X=gx+q[0]*Math.cos(q[1]), Y=gy+q[0]*Math.sin(q[1]); if(i===0&&k===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y); });
  }
  ctx.closePath(); ctx.fillStyle='rgba(94,200,255,.12)'; ctx.fill(); ctx.strokeStyle=CY; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore();
  C.circle(ctx, gx, gy, Rp, GO, null, 1.3, [5,4]);
  C.circle(ctx, gx, gy, 12, CY, 'rgba(10,26,43,1)', 1.6);
  C.mono(ctx,'delecirkel', gx+Rp*0.72, gy+Rp*0.72+14, GO, 10);
  // markér tanden øverst
  C.circle(ctx, gx, gy-ra, 5, null, RD);
  C.arrow(ctx, gx+46, gy-ra-2, gx+8, gy-ra-2, RD, 2.4);
  C.mono(ctx,'Ft', gx+50, gy-ra+2, RD, 11);

  /* ---------- tanden som udkraget bjælke ---------- */
  var bx=520, base=H-112, sc=Math.min(230/r.l, 90/r.x, 230/r.t, 60);
  var L=r.l*sc, T2=r.t*sc/2, tip=0.35*r.t*sc/2, X=r.x*sc;
  C.txt(ctx,'Tanden = udkraget bjælke (Lewis)', bx, 24, DIM, 11, 'center');
  // tandprofil
  C.poly(ctx, [[bx-T2-26, base],[bx-T2, base],[bx-tip, base-L-6],[bx+tip, base-L-6],[bx+T2, base],[bx+T2+26, base],[bx+T2+26, base+22],[bx-T2-26, base+22]],
         CY, 'rgba(94,200,255,.12)', 2);
  // Lewis-parabel: toppunkt i lastpunktet (bx, base-L), gennem (bx±T2, base)
  var par=[];
  for (var k=-30;k<=30;k++){ var w=k/30*T2; par.push([bx+w, base-L + L*(w/T2)*(w/T2)]); }
  C.poly(ctx, par, GO, null, 1.8, [5,3]);
  // last
  C.arrow(ctx, bx+tip+70, base-L, bx+tip+4, base-L, RD, 2.8);
  C.mono(ctx,'Ft='+Eks.num(v.Ft,0)+' N', bx+tip+74, base-L+4, RD, 11);
  // maal: l og t
  C.dim(ctx, bx-T2-40, base-L, bx-T2-40, base, GR, null);
  C.mono(ctx,'l', bx-T2-52, base-L/2+4, GR, 12);
  C.dim(ctx, bx-T2, base+X+20, bx+T2, base+X+20, GR, null);
  C.mono(ctx,'t', bx, base+X+36, GR, 12, 'center');
  // ligedannede trekanter: a (lastpunkt), c (fodens midte), b (tangentpunkt), e (x under foden)
  var ax_=bx, ay_=base-L, bxp=bx+T2, byp=base, ey=base+X;
  C.line(ctx, ax_, ay_, bxp, byp, PU, 1.3);
  C.line(ctx, bxp, byp, ax_, ey, PU, 1.3);
  C.line(ctx, ax_, ay_, ax_, ey, 'rgba(217,132,255,.5)', 1, [3,3]);
  C.mono(ctx,'x', ax_-12, base+X/2+4, PU, 12, 'right');
  C.circle(ctx, bxp, byp, 3.5, null, PU);
  // spændingsfordeling i foden
  var sfy=base+4;
  C.poly(ctx, [[bx-T2, sfy],[bx-T2, sfy+18],[bx, sfy]], null, 'rgba(94,200,255,.35)');
  C.poly(ctx, [[bx+T2, sfy],[bx+T2, sfy+18],[bx, sfy]], null, 'rgba(255,94,94,.35)');
  C.txt(ctx,'σb = '+Eks.num(r.sb,2)+' MPa i tandfoden', bx, 46, GO, 13, 'center', true);
}
};
</script>
