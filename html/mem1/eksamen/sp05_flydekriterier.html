oversat: "Du kender kun materialets flydespænding fra <b>ét</b> forsøg: en trækprøve, hvor der kun er spænding i én retning. Men din drivstift er trukket i én retning og trykket i en anden på samme tid. Flyder den eller ej? Du kan ikke lave et nyt forsøg for hver tænkelig kombination. Et <b>flydekriterium</b> er en regel, der oversætter en vilkårlig spændingstilstand til ét tal, som kan sammenlignes med trækprøven. Tresca og von Mises er to bud på, hvad det tal skal være. Del (b) beder dig regne begge og sammenligne.",
kerne: "Duktilt metal flyder, fordi atomlag glider &mdash; forskydning, ikke træk. Begge kriterier måler forskydning: Tresca den største forskydningsspænding, von Mises den energi, der går til at ændre form.",

historie: [
 {h:"Hvorfor ikke bare sammenligne σ₁ med S_y?",

 {h:"Hvad der fysisk sker, når metal flyder",
  t:"Metal er krystaller. Flydning er atomplaner, der glider over hinanden langs gitterfejl (dislokationer). Glidning drives af <b>forskydningsspænding</b>. Et rent hydrostatisk tryk &mdash; lige meget fra alle sider &mdash; giver ingen forskydning på noget plan og kan derfor ikke få metal til at flyde, uanset hvor stort det er. Det er nøglen til begge kriterier."},
 {h:"Tresca: den største forskydningsspænding",
  t:"Den enkleste idé: flydning starter, når den største forskydningsspænding i emnet når den værdi, den havde ved flydning i trækprøven. I trækprøven er $\\tau_{max}=S_y/2$. I emnet er $\\tau_{max}=(\\sigma_{max}-\\sigma_{min})/2$ &mdash; og her skal alle <b>tre</b> hovedspændinger med, også $\\sigma_3=0$ ud af planet."},

  hvorfor:"Den største forskydningsspænding er radius i den største af de tre Mohr-cirkler. I trækprøven ved flydning er $\\sigma_1=S_y$, $\\sigma_2=\\sigma_3=0$, så $\\tau_{max}=S_y/2$. Kriteriet siger: flydning, når de to er ens. Med sikkerhedsfaktor divideres $S_y$ med $n_s$.",

  sig:"Jeg sætter deformationsenergien lig den ved flydning i trækprøven. E og ny forsvinder, og jeg får den ækvivalente von Mises-spænding."},

 {t:"Plan spænding og geometrien i σ₁-σ₂-planet",

  sig:"I planet er von Mises en ellipse og Tresca en sekskant inde i den. Tresca er altid på den sikre side, og forskellen er størst ved ren forskydning."}

qa: [
 {q:"Hvilket kriterium skal man vælge i praksis?",
  a:"von Mises stemmer bedst med forsøg på duktile metaller og bruges i de fleste FEM-programmer. Tresca er enklere at regne i hånden og altid konservativ (op til 15,5 %), så det bruges ofte ved hurtige overslag og i nogle standarder."},
 {q:"Hvad betyder det, at hydrostatisk tryk ikke giver flydning?",
  a:"Lægger du samme spænding $p$ til alle tre hovedspændinger, ændres ingen forskelle, og hverken $\\tau_{max}$ eller $\\sigma_e$ ændres. Metal på bunden af havet flyder ikke af vandtrykket alene. Mohrs cirkler flytter sig bare langs $\\sigma$-aksen uden at ændre størrelse."},
 {q:"Hvad er flydespændingen i ren forskydning efter de to kriterier?",
  a:"Ren forskydning er $\\sigma_1=\\tau$, $\\sigma_3=-\\tau$. Tresca: $2\\tau=S_y$ → $S_{sy}=0{,}5S_y$. von Mises: $\\sqrt3\\,\\tau=S_y$ → $S_{sy}=0{,}577S_y$. Det bruges direkte i akseldimensionering (spm. 9) og fjedre (spm. 14)."},
 {q:"Hvorfor kaldes σₑ også oktaedrisk forskydningsspænding?",
  a:"Forskydningsspændingen på de otte planer, der hælder lige meget mod alle tre hovedakser, er $\\tau_{oct}=\\frac{\\sqrt2}{3}\\sigma_e$. De to formuleringer er matematisk ækvivalente &mdash; energi og oktaederplan giver samme kriterium."},
 {q:"Hvor ligger punktet (120, −40) i σ₁-σ₂-planet, og hvorfor betyder det noget?",
  a:"I 4. kvadrant, hvor fortegnene er modsatte. Her afviger de to kriterier mest, fordi vi nærmer os ren forskydning. Lastlinjen fra origo rammer sekskanten før ellipsen, deraf $1{,}75<1{,}94$."},
 {q:"Hvordan kobles det til Mohrs cirkel?",
  a:"$\\sigma_1$ og $\\sigma_2$ er netop resultatet af Mohrs cirkel i spm. 1. Tresca er radius i den største af de tre cirkler. Et flydekriterium er altså sidste led i kæden: last → spændinger → Mohr → hovedspændinger → kriterium → sikkerhedsfaktor."}
],

sammenhaeng: "Her samles tråden fra de første spørgsmål: laster giver spændinger (spm. 3), Mohrs cirkel giver hovedspændinger (spm. 1), og flydekriteriet omsætter dem til én sikkerhedsfaktor. Tresca-kriteriet er præcis det, der bruges i <b>spm. 9</b> til at udlede $T_e=\\sqrt{M^2+T^2}$ for aksler. Energiopdelingen bygger på Hookes lov i 3D fra <b>spm. 2</b>. Og ved cyklisk belastning (<b>spm. 6</b>) bruges von Mises til at samle fleraksede spændinger til én ækvivalent amplitude og middelspænding.",

var LAB = {
w: 720, h: 440,
intro: "Flyt spændingspunktet rundt i $\\sigma_1$-$\\sigma_2$-planet. Den stiplede lastlinje viser, hvor langt lasten kan skaleres op, før hvert kriterium melder flydning. Prøv $\\sigma_1=\\sigma_2$ (kriterierne er enige) og $\\sigma_2=-\\sigma_1$ (ren forskydning, største uenighed). Til højre ses de tre Mohr-cirkler &mdash; Tresca er radius i den største.",
preset2: {navn: "Ren forskydning: σ₁ = 100, σ₂ = −100", v: {s1: 100, s2: -100}},

inputs: [
 {id:"s1", label:"$\\sigma_1$ (i planet)", min:-300, max:300, step:5,  value:120, unit:"MPa"},
 {id:"s2", label:"$\\sigma_2$ (i planet)", min:-300, max:300, step:5,  value:-40, unit:"MPa"},
 {id:"Sy", label:"Flydespænding $S_y$",    min:100,  max:600, step:10, value:280, unit:"MPa"}
],

compute: function (v) {
  var p = [v.s1, v.s2, 0].sort(function (a, b) { return b - a; });
  var tre = p[0] - p[2];                               // stoerste forskel
  var vm = Math.sqrt(0.5 * (Math.pow(v.s1 - v.s2, 2) + v.s2 * v.s2 + v.s1 * v.s1));
  return { p:p, tre:tre, tmax:tre / 2, vm:vm,
           nT: tre > 0 ? v.Sy / tre : Infinity, nV: vm > 0 ? v.Sy / vm : Infinity };
},

readout: function (v, r) {
  function n(x){ return isFinite(x) ? Eks.num(x,3) : "∞"; }
  return [
   {l:"Ordnet: $\\sigma_1,\\sigma_2,\\sigma_3$", raw: r.p.map(function(x){return Eks.num(x,0);}).join(" / "), unit:"MPa"},
   {l:"$\\tau_{max}$ (største cirkel)", v:r.tmax, dec:1, unit:"MPa"},
   {l:"Tresca: $\\sigma_1-\\sigma_3$", v:r.tre, dec:1, unit:"MPa"},
   {l:"von Mises $\\sigma_e$", v:r.vm, dec:1, unit:"MPa"},
   {l:"$n_s$ Tresca", raw:n(r.nT), unit:"", k: r.nT<1?"warn":"hi"},
   {l:"$n_s$ von Mises", raw:n(r.nV), unit:"", k: r.nV<1?"warn":"hi"},
   {l:"Forskel (vM/Tresca)", raw: (isFinite(r.nT)&&isFinite(r.nV)) ? Eks.num((r.nV/r.nT-1)*100,1) : "--", unit:"%"}
  ];
},

steps: function (v, r) {
  var T = Eks.tnum;
  return [
   {h:"1 · Ordn alle tre hovedspændinger",
    m:"\\{"+T(v.s1,0)+",\\ "+T(v.s2,0)+",\\ 0\\}\\ \\Rightarrow\\ \\sigma_1="+T(r.p[0],0)+",\\ \\sigma_2="+T(r.p[1],0)+",\\ \\sigma_3="+T(r.p[2],0)+"\\ \\text{MPa}",
    c:"Nul-spændingen vinkelret på planet skal med."},
   {h:"2 · Tresca (MSST)",
    m:"n_s=\\frac{S_y}{\\sigma_1-\\sigma_3}=\\frac{"+T(v.Sy,0)+"}{"+T(r.p[0],0)+"-("+T(r.p[2],0)+")}="+(isFinite(r.nT)?T(r.nT,3):"\\infty"),
    c:"$\\tau_{max}="+Eks.num(r.tmax,1)+"$ MPa mod $S_y/2="+Eks.num(v.Sy/2,0)+"$ MPa."},
   {h:"3 · von Mises-spændingen (plan spænding)",
    m:"\\sigma_e=\\sqrt{\\sigma_1^2-\\sigma_1\\sigma_2+\\sigma_2^2}=\\sqrt{"+T(v.s1,0)+"^2-("+T(v.s1,0)+")("+T(v.s2,0)+")+("+T(v.s2,0)+")^2}="+T(r.vm,2)+"\\ \\text{MPa}",
    c:"Midterleddet: $-("+Eks.num(v.s1,0)+")\\cdot("+Eks.num(v.s2,0)+")="+Eks.num(-v.s1*v.s2,0)+"$. Pas på fortegnet."},
   {h:"4 · von Mises (DET)",
    m:"n_s=\\frac{S_y}{\\sigma_e}=\\frac{"+T(v.Sy,0)+"}{"+T(r.vm,2)+"}="+(isFinite(r.nV)?T(r.nV,3):"\\infty"),
    c:"Altid ≥ Tresca-værdien: sekskanten ligger inden i ellipsen."}
  ];
},

facit: function (v, r) {
  if (v.s1===120 && v.s2===-40 && v.Sy===280) {
    return {t:"<b>✓ Eksamensopgavens facit:</b> Tresca: $\\sigma_1-\\sigma_3=160$ MPa → $n_s=280/160=1{,}75$. von Mises: $\\sigma_e=\\sqrt{20\\,800}=144{,}2$ MPa → $n_s=1{,}94$. Tresca er 11 % mere konservativ, fordi punktet ligger i 4. kvadrant, tæt på ren forskydning."};
  }
  if (Math.abs(v.s1 + v.s2) < 1e-9 && v.s1 !== 0) {
    return {off:true, t:"<b>Ren forskydning.</b> Her er kriterierne mest uenige: forholdet $n_{vM}/n_{T}=2/\\sqrt3=1{,}155$. Tresca siger $S_{sy}=0{,}5S_y$, von Mises $0{,}577S_y$."};
  }
  if (v.s1 === v.s2) {
    return {off:true, t:"<b>Ligeligt toakset.</b> $\\sigma_1=\\sigma_2$: de to kriterier er enige, fordi punktet ligger på et af sekskantens hjørner, som også ligger på ellipsen."};
  }
  return {off:true, t:"Du har ændret inddata. Tryk på knappen for at komme tilbage til eksamensopgavens tal."};
},

draw: function (ctx, W, H, v, r, C) {
  C.grid(ctx, W, H, 40);
  var CY='#5ec8ff', GR='#00d984', GO='#ffa500', RD='#ff5e5e', PU='#d984ff', DIM='rgba(227,235,243,.45)';

  /* ---------- flydeflader i sigma1-sigma2-planet ---------- */
  var cx=228, cy=H/2+6, R=150, sc=R/v.Sy*0.95;
  function P(a,b){ return [cx+a*sc, cy-b*sc]; }
  var lim=Math.max(v.Sy*1.35, Math.abs(v.s1)*1.1, Math.abs(v.s2)*1.1);
  sc=Math.min(sc, 190/lim);
  C.line(ctx, cx-200, cy, cx+200, cy, DIM, 1.1);
  C.line(ctx, cx, cy-200, cx, cy+200, DIM, 1.1);
  C.txt(ctx,'σ1', cx+196, cy-8, DIM, 12, 'right');
  C.txt(ctx,'σ2', cx+8, cy-186, DIM, 12);
  // von Mises-ellipse
  var ell=[];
  for (var i=0;i<=120;i++){ var t=i/120*2*Math.PI;
    var a=Math.sqrt(2)*v.Sy*Math.cos(t), b=Math.sqrt(2/3)*v.Sy*Math.sin(t);
    ell.push(P((a+b)/Math.sqrt(2), (a-b)/Math.sqrt(2))); }
  C.poly(ctx, ell, CY, 'rgba(94,200,255,.07)', 2.2);
  // Tresca-sekskant
  var S=v.Sy, hx=[[S,0],[S,S],[0,S],[-S,0],[-S,-S],[0,-S],[S,0]].map(function(q){return P(q[0],q[1]);});
  C.poly(ctx, hx, GO, 'rgba(255,165,0,.08)', 2.2);
  // lastlinje og skaeringer
  var Pt=P(v.s1,v.s2);
  if (isFinite(r.nV)) {
    var ev=P(v.s1*r.nV, v.s2*r.nV), et=P(v.s1*r.nT, v.s2*r.nT);
    C.line(ctx, cx, cy, ev[0], ev[1], PU, 1.4, [5,4]);
    C.circle(ctx, et[0], et[1], 4.5, null, GO);
    C.circle(ctx, ev[0], ev[1], 4.5, null, CY);
  }
  C.circle(ctx, Pt[0], Pt[1], 6, '#fff', PU, 2);
  C.mono(ctx,'('+Eks.num(v.s1,0)+', '+Eks.num(v.s2,0)+')', Pt[0]-10, Pt[1]-10, PU, 11, 'right');
  C.txt(ctx,'von Mises (ellipse)', 16, 22, CY, 11, 'left', true);
  C.txt(ctx,'Tresca (sekskant)', 16, 38, GO, 11, 'left', true);
  C.mono(ctx,'Sy='+Eks.num(v.Sy,0), P(v.Sy,0)[0]+4, cy+14, DIM, 10);

  /* ---------- 3D Mohr-cirkler ---------- */
  var mx0=462, mx1=W-18, my=H/2+20;
  C.txt(ctx,'Tre Mohr-cirkler (σ3 = 0 med)', mx0, 22, DIM, 11);
  var mn=Math.min(r.p[2],0), mxv=Math.max(r.p[0],0), span=Math.max(mxv-mn, 10);
  var ms=(mx1-mx0-20)/span;
  function MX(s){ return mx0+10+(s-mn)*ms; }
  C.line(ctx, mx0, my, mx1, my, DIM, 1.1);
  C.line(ctx, MX(0), my-150, MX(0), my+60, DIM, 1);
  var cols=[GR, 'rgba(0,217,132,.5)', 'rgba(0,217,132,.5)'];
  var pairs=[[r.p[0],r.p[2]],[r.p[0],r.p[1]],[r.p[1],r.p[2]]];
  pairs.forEach(function(pp,k){
    var c=(pp[0]+pp[1])/2, rr=(pp[0]-pp[1])/2*ms;
    C.circle(ctx, MX(c), my, rr, cols[k], k===0?'rgba(0,217,132,.08)':null, k===0?2.4:1.4, k===0?null:[4,3]);
  });
  var big=(r.p[0]-r.p[2])/2*ms;
  C.line(ctx, MX((r.p[0]+r.p[2])/2), my, MX((r.p[0]+r.p[2])/2), my-big, RD, 1.4, [3,3]);
  C.mono(ctx,'τmax='+Eks.num(r.tmax,0), MX((r.p[0]+r.p[2])/2)+6, my-big-6, RD, 10);
  r.p.forEach(function(s,k){ C.circle(ctx, MX(s), my, 3.5, null, '#e3ebf3');
    C.mono(ctx,'σ'+(k+1)+'='+Eks.num(s,0), MX(s), my+18+k*13, DIM, 10, 'center'); });
  C.txt(ctx,'Største cirkel = Tresca', mx0, H-16, GR, 10);
}
};
</script>
