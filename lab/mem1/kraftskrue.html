<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kraftskrue og selvlåsning · 3D-lab</title>
<meta name="description" content="En skruedonkraft: løft, sænk eller slip håndtaget. Se momentet, virkningsgraden, og om skruen er selvlåsende, eller om lasten kører ned af sig selv.">
<link rel="stylesheet" href="../assets/lab.css">
</head>
<body>
<script src="../assets/three.min.js"></script>
<script src="../assets/lab.js"></script>
<script>
(function () {
'use strict';
var F = Lab.fmt, n = Lab.n, PI = Math.PI;
var UI = Lab.build({
  chip: 'MEM1 · kap. 16 · eksamensspm. 12', title: 'Kraftskrue: moment og selvlåsning',
  src: 'Hamrock kap. 16: kraftskruer med firkantgevind (bogen: bevægelsesskruer)',
  side: ['Gevind', 'Last og betjening', 'Aflæsning'],
  graphs: [{ id: 'gU', title: 'Ét gevindomløb rullet ud', sub: 'en klods på et skråplan' }, { id: 'gT', title: 'Moment mod friktion', sub: 'løft og sænk' }],
  notes: '<li><b>Et gevind er et skråplan viklet om en cylinder.</b> Rul ét omløb ud: grundlinjen er πd<sub>m</sub> og højden er stigningen l. Lasten er en klods, og dit moment er en vandret kraft P = 2T/d<sub>m</sub>.</li>' +
    '<li>Ved løft modvirker friktionen bevægelsen, så den lægges til. Ved sænkning vender friktionen. Er μ > tan λ, skal du stadig dreje for at sænke: skruen er <b>selvlåsende</b>.</li>' +
    '<li>Tryk <b>Slip håndtaget</b>. Med eksamenstallene bliver bilen stående. Gør stigningen stor (dobbeltløb, flere starter) eller friktionen lille, og lasten kører ned af sig selv.</li>' +
    '<li>Selvlåsning har en pris: en selvlåsende skrue med firkantgevind har altid virkningsgrad under 50 %.</li>',
  model: '<li>Firkantgevind uden kravefriktion, jævnt fordelt last. Løft: T = (Wd<sub>m</sub>/2)·(l + πμd<sub>m</sub>)/(πd<sub>m</sub> − μl). Sænk: T = (Wd<sub>m</sub>/2)·(πμd<sub>m</sub> − l)/(πd<sub>m</sub> + μl).</li>' +
    '<li>Gevindet er vist som en rund vinding, og bevægelsen er stærkt forstørret. Når lasten kører ned af sig selv, er accelerationen kun illustration.</li>'
});
var lab = Lab.scene(UI.stage, { view: { target: new THREE.Vector3(0, 1.45, 0), theta: 0.6, phi: 1.3, radius: 5.4 } });
var S = { dm: 20, l: 5, mu: 0.10, W: 10, arm: 300, mode: 'hold', h: 0.3, v: 0, ang: 0 };

/* ---------- 3D: skruedonkraft ---------- */
var steel = Lab.mat(0xb8c7d6, { metal: 0.45, rough: 0.35 }), dark = Lab.mat(0x2b3c50, { metal: 0.3, rough: 0.7 });
var base = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.7, 0.35, 6), dark); base.position.y = 0.175; lab.scene.add(base);
var nut = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.35, 6), Lab.mat(0xc08a3e, { metal: 0.5 })); nut.position.y = 0.52; lab.scene.add(nut);
var screwG = new THREE.Group(); lab.scene.add(screwG);
var core = null, thread = null, Ls = 2.2, rDisp = 0.17;
function buildScrew() {
  [core, thread].forEach(function (m) { if (m) { screwG.remove(m); m.geometry.dispose(); } });
  var pitchW = S.l / S.dm * 2 * rDisp, turns = Ls / pitchW, pts = [], N = Math.min(4000, Math.ceil(turns * 40));
  core = new THREE.Mesh(new THREE.CylinderGeometry(rDisp * 0.82, rDisp * 0.82, Ls, 32), steel); core.position.y = Ls / 2; screwG.add(core);
  for (var i = 0; i <= N; i++) { var t = i / N, a = t * turns * 2 * PI; pts.push(new THREE.Vector3(rDisp * Math.cos(a), t * Ls, rDisp * Math.sin(a))); }
  thread = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), N, Math.min(0.045, pitchW * 0.28), 6, false), steel); screwG.add(thread);
}
var cap = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.24, 0.16, 32), dark); screwG.add(cap);
var handle = Lab.rod(0.025, Lab.mat(0xe3e9ef, { metal: 0.6 })); screwG.add(handle);
var knob = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 12), Lab.mat(0xff5e5e)); screwG.add(knob);
var load = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.45, 0.8), Lab.mat(0x5f7287, { metal: 0.2, rough: 0.7 })); lab.scene.add(load);
var tagW = Lab.tag(lab, '', '#e3e9ef'), tagT = Lab.tag(lab, '', '#00d984');
var arcT = Lab.arc(0x00d984, { thick: 0.014 }); lab.scene.add(arcT);
var wArrow = Lab.arrow(0xffa500, { radius: 0.02 }); lab.scene.add(wArrow);
Lab.grid(lab, 4, 0.002);
var ground = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshStandardMaterial({ color: 0x0d2033, roughness: 1 })); ground.rotation.x = -PI / 2; lab.scene.add(ground);

/* ---------- kontroller ---------- */
var c = UI.side;
var sdm = Lab.slider(c[0], { label: 'Middeldiameter d<sub>m</sub>', min: 8, max: 60, step: 1, value: S.dm, unit: 'mm', fmt: function (x) { return F(x, 0); }, onInput: function (v) { S.dm = v; buildScrew(); } });
var sl = Lab.slider(c[0], { label: 'Stigning l (pr. omgang)', min: 1, max: 40, step: 0.5, value: S.l, unit: 'mm', fmt: function (x) { return F(x, 1); }, onInput: function (v) { S.l = v; buildScrew(); }, sub: 'Enkeltløb: l = p. Dobbeltløb: l = 2p.' });
var smu = Lab.slider(c[0], { label: 'Gevindfriktion μ', min: 0.01, max: 0.3, step: 0.005, value: S.mu, unit: '', fmt: function (x) { return F(x, 3); }, onInput: function (v) { S.mu = v; } });
Lab.presets(c[0], [
  ['<b>Eksamensspm. 12:</b> d<sub>m</sub> = 20 mm, l = 5 mm, μ = 0,10, W = 10 kN', function () { set(20, 5, 0.10, 10); }],
  ['<b>Firdobbelt gevind:</b> l = 20 mm (ikke selvlåsende)', function () { set(20, 20, 0.10, 10); }],
  ['<b>Smurt kugleskrue:</b> μ = 0,01', function () { set(20, 5, 0.01, 10); }]
]);
function set(d, l, m, w) { S.dm = d; S.l = l; S.mu = m; S.W = w; sdm.set(d, true); sl.set(l, true); smu.set(m, true); sW.set(w, true); buildScrew(); S.mode = 'hold'; S.v = 0; }
var sW = Lab.slider(c[1], { label: 'Last W', min: 0.5, max: 40, step: 0.5, value: S.W, unit: 'kN', fmt: function (x) { return F(x, 1); }, onInput: function (v) { S.W = v; } });
var sA = Lab.slider(c[1], { label: 'Håndtagets arm', min: 100, max: 800, step: 10, value: S.arm, unit: 'mm', fmt: function (x) { return F(x, 0); }, onInput: function (v) { S.arm = v; } });
var br = Lab.btnRow(c[1]);
var bUp = Lab.button(br, '▲ Løft', 'primary', function () { S.mode = 'up'; }), bDn = Lab.button(br, '▼ Sænk', '', function () { S.mode = 'down'; }), bRel = Lab.button(br, 'Slip håndtaget', 'gold', function () { S.mode = 'free'; S.v = 0; });
var ro = Lab.readouts(c[2], [['lam', 'Stigningsvinkel tan λ = l/(πd<sub>m</sub>)'], ['self', 'Selvlåsende? (μ > tan λ)'], '-', ['Tu', 'Moment til løft'], ['Td', 'Moment til sænkning'], ['Fh', 'Håndkraft (løft)'], ['e', 'Virkningsgrad e = Wl/(2πT)']]);
Lab.legendKeys(UI.legend, [['#ffa500', 'last W'], ['#00d984', 'moment på håndtaget'], ['#c08a3e', 'møtrik (fast)']]);
buildScrew();

function calc() {
  var dm = S.dm, l = S.l, mu = S.mu, W = S.W * 1000, pd = PI * dm;
  var Tu = W * dm / 2 * (l + PI * mu * dm) / (pd - mu * l) / 1000, Td = W * dm / 2 * (PI * mu * dm - l) / (pd + mu * l) / 1000;
  return { lam: l / pd, self: mu > l / pd, Tu: Tu, Td: Td, e: W * l / (2 * PI * Tu * 1000), Fh: Tu / (S.arm / 1000) };
}
var gU = Lab.plot(UI.graphs.gU), gT = Lab.plot(UI.graphs.gT);
Lab.loop(function (dt, rdt) {
  var K = calc(), pitchW = S.l / S.dm * 2 * rDisp, w = 0;
  if (S.mode === 'up') w = 2.5; else if (S.mode === 'down') w = -2.5;
  else if (S.mode === 'free') { if (!K.self && S.h > 0.05) { S.v -= dt * 4 * (1 - S.mu * PI * S.dm / S.l); w = S.v; } else { S.v = 0; w = 0; } }
  var dh = w * dt * pitchW / (2 * PI) * 4;
  if (S.h + dh > 1.1 || S.h + dh < 0.02) { w = 0; dh = 0; if (S.mode === 'free') S.v = 0; }
  S.h += dh; S.ang += w * dt * 4;
  screwG.position.y = S.h - 0.6; screwG.rotation.y = S.ang;
  cap.position.y = Ls + 0.08;
  var a0 = new THREE.Vector3(0, Ls + 0.08, 0), a1 = new THREE.Vector3(0.95, Ls + 0.08, 0); handle.between(a0, a1); knob.position.copy(a1);
  load.position.y = screwG.position.y + Ls + 0.16 + 0.225;
  var al = 0.2 + 0.3 * Math.min(1, S.W / 30);
  wArrow.set(new THREE.Vector3(0, load.position.y + 0.225 + al + 0.05, 0), new THREE.Vector3(0, -al, 0));
  tagW.set(new THREE.Vector3(0.65, load.position.y + 0.1, 0.45), 'W = ' + F(S.W, 1) + ' kN');
  var topY = load.position.y - 0.38;
  arcT.set(new THREE.Vector3(0, screwG.position.y + Ls + 0.08, 0), new THREE.Vector3(0, 1, 0), 1.05, S.mode === 'up' ? 1 : S.mode === 'down' ? -1 : 0, 1.2);
  tagT.set(new THREE.Vector3(-0.6, screwG.position.y + Ls + 0.3, 0.6), S.mode === 'up' ? 'T = ' + F(K.Tu, 1) + ' N·m (løft)' : S.mode === 'down' ? 'T = ' + F(K.Td, 1) + ' N·m (sænk)' : S.mode === 'free' ? 'T = 0 (sluppet)' : 'holder');
  ro.set('lam', F(K.lam, 4) + ' (λ = ' + F(Math.atan(K.lam) * 180 / PI, 2) + '°)'); ro.set('self', K.self ? 'ja' : 'NEJ', K.self ? 'ok' : 'bad');
  ro.set('Tu', F(K.Tu, 2) + ' N·m', 'hi'); ro.set('Td', F(K.Td, 2) + ' N·m', K.Td < 0 ? 'bad' : ''); ro.set('Fh', F(K.Fh, 1) + ' N'); ro.set('e', F(K.e * 100, 1) + ' %');
  var st = S.mode === 'free' ? (K.self ? 'Sluppet: selvlåsende, lasten bliver stående' : 'Sluppet: IKKE selvlåsende, lasten kører ned!') : S.mode === 'up' ? 'Løfter' : S.mode === 'down' ? 'Sænker' : 'Holder';
  Lab.setStatus(UI.status, st, S.mode === 'free' && !K.self ? 'bad' : S.mode === 'free' ? '' : 'warn');
  UI.note.textContent = 'Bevægelsen er stærkt forstørret';
  // udrullet gevind
  var pd = PI * S.dm, hmax = Math.max(S.l * 1.6, pd * 0.25);
  gU.begin({ xmin: -pd * 0.05, xmax: pd * 1.15, ymin: -hmax * 0.1, ymax: hmax * 1.35, xlabel: 'πd_m [mm]', ylabel: 'l [mm]', fx: function (x) { return F(x, 0); }, fy: function (y) { return F(y, 0); } });
  gU.fill([[0, 0], [pd, 0], [pd, S.l]], 'rgba(138,157,179,.25)'); gU.line([[0, 0], [pd, 0], [pd, S.l], [0, 0]], '#8a9db3', 2);
  var bx = pd * 0.55, by = S.l * 0.55; gU.dot(bx, by, '#c08a3e', 8);
  var sc = hmax * 0.5, Wl = sc, Pl = sc * (S.mode === 'down' ? Math.max(K.Td, 0) : K.Tu) / Math.max(K.Tu, 1e-9);
  gU.line([[bx, by], [bx, by - Wl * 0.5]], '#ffa500', 2.5); gU.text(bx + 1, by - Wl * 0.45, ' W', '#ffa500');
  gU.line([[bx, by], [bx + (S.mode === 'down' ? -1 : 1) * Pl * 0.5 * (pd / hmax) * 0.3, by]], '#00d984', 2.5); gU.text(bx + Pl * 0.18 * (pd / hmax), by + hmax * 0.07, 'P = 2T/d_m', '#00d984');
  gU.text(pd * 0.15, S.l * 0.05 + hmax * 0.06, 'λ', '#ffd27a'); gU.text(pd * 0.02, hmax * 1.2, 'friktionsvinkel ρ = atan μ = ' + F(Math.atan(S.mu) * 180 / PI, 2) + '°, λ = ' + F(Math.atan(K.lam) * 180 / PI, 2) + '°', '#ffd27a');
  gU.end();
  // moment mod μ
  var mus = [], up = [], dn = [], Tm = Math.max(K.Tu * 1.6, 1);
  for (var i = 0; i <= 60; i++) { var mu = 0.3 * i / 60, pdd = PI * S.dm, W = S.W * 1000; up.push([mu, W * S.dm / 2 * (S.l + PI * mu * S.dm) / (pdd - mu * S.l) / 1000]); dn.push([mu, W * S.dm / 2 * (PI * mu * S.dm - S.l) / (pdd + mu * S.l) / 1000]); }
  var lo = Math.min(0, dn[0][1]) * 1.1;
  gT.begin({ xmin: 0, xmax: 0.3, ymin: lo, ymax: Math.max(up[60][1], Tm) * 1.05, xlabel: 'μ', ylabel: 'T [N·m]', fx: function (x) { return F(x, 2); }, fy: function (y) { return F(y, 0); } });
  gT.fill([[K.lam, lo], [0.3, lo], [0.3, 0], [K.lam, 0]], 'rgba(0,217,132,.08)');
  gT.line(up, '#00d984', 2.2); gT.line(dn, '#5ec8ff', 2.2); gT.vline(Math.min(K.lam, 0.3), 'rgba(255,210,122,.8)', 'μ = tan λ'); gT.hline(0, 'rgba(227,233,239,.4)');
  gT.dot(S.mu, K.Tu, '#00d984', 5); gT.dot(S.mu, K.Td, '#5ec8ff', 5); gT.text(0.01, up[60][1] * 0.95, 'løft', '#00d984'); gT.text(0.01, lo * 0.6 + 0.1, 'sænk (< 0: kører selv)', '#5ec8ff');
  gT.end();
  UI.formulas.innerHTML =
    Lab.F('T = (Wd<sub>m</sub>/2)·(l + πμd<sub>m</sub>)/(πd<sub>m</sub> − μl) = (' + n(S.W * 1000, 0) + '·' + n(S.dm, 0) + '/2)·(' + n(S.l, 1) + ' + ' + n(PI * S.mu * S.dm, 3) + ')/(' + n(PI * S.dm, 2) + ' − ' + n(S.mu * S.l, 2) + ') = ' + n(K.Tu * 1000, 0) + ' N·mm = ' + n(K.Tu, 2) + ' N·m',
      'Løftemomentet for firkantgevind (Hamrock kap. 16). Udledt af ligevægt på klodsen på skråplanet. Eksamensfacit: 18,1 N·m.') +
    Lab.F('Selvlåsning: T<sub>sænk</sub> ≥ 0 ⇔ πμd<sub>m</sub> ≥ l ⇔ μ ≥ tan λ:&nbsp; ' + n(S.mu, 3) + (K.self ? ' > ' : ' < ') + n(K.lam, 4) + ' ⇒ ' + (K.self ? 'selvlåsende' : 'IKKE selvlåsende'),
      'Friktionsvinklen ρ = atan μ skal være større end stigningsvinklen λ. Ellers kan lasten selv dreje skruen tilbage.') +
    Lab.F('e = Wl/(2πT) = ' + n(S.W * 1000, 0) + '·' + n(S.l, 1) + '/(2π·' + n(K.Tu * 1000, 0) + ') = ' + n(K.e * 100, 1) + ' %', 'Virkningsgrad: nyttigt løftearbejde pr. omgang divideret med tilført arbejde. Eksamenstallene giver 44 %.');
  lab.render(rdt);
});
})();
</script>
</body>
</html>
