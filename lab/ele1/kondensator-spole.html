<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kondensator og spole · 3D-lab</title>
<meta name="description" content="Energilagring i kondensator og spole: ladninger og elektrisk felt mellem pladerne, magnetfelt i spolen, i = C dv/dt og v = L di/dt, og energien ½Cv² og ½Li².">
<link rel="stylesheet" href="../assets/lab.css">
</head>
<body>
<script src="../assets/three.min.js"></script>
<script src="../assets/lab.js"></script>
<script>
(function () {
'use strict';
var F = Lab.fmt, n = Lab.n, PI = Math.PI;
var UI = Lab.build({
  chip: 'ELE1 · dag 3–4 · Rizzoni kap. 3.1–3.2', title: 'Kondensator og spole: energilagring',
  src: 'Slides dag 3–4: i = C dv/dt, v = L di/dt, w<sub>C</sub> = ½Cv², w<sub>L</sub> = ½Li²',
  side: ['Komponent', 'Kilde', 'Aflæsning'],
  graphs: [{ id: 'gV', title: 'Spænding og strøm', sub: 'v(t) og i(t)' }, { id: 'gW', title: 'Effekt og oplagret energi', sub: 'p = v·i og w(t)' }],
  notes: '<li><b>Kondensatoren lagrer energi i et elektrisk felt</b> mellem pladerne. Konstant strøm ind giver en spænding, der vokser lineært (dag 3-eksemplet: hældning i/C).</li>' +
    '<li><b>Spolen lagrer energi i et magnetfelt.</b> Den modsætter sig ændringer i strømmen: v = L di/dt. Prøv at slukke strømmen brat, og spændingen springer.</li>' +
    '<li>Spændingen over en kondensator kan ikke springe, og strømmen i en spole kan ikke springe. Begge dele ville kræve uendelig effekt.</li>' +
    '<li>Med sinus: i en kondensator er strømmen 90° <b>foran</b> spændingen, i en spole 90° <b>bagefter</b>. Effekten p = vi skifter fortegn: energi lagres og gives tilbage hver halve periode, og middeleffekten er nul.</li>',
  model: '<li>Ideelle komponenter uden modstand. Kondensator: C = εA/d er ikke brugt. Du vælger C direkte.</li>' +
    '<li>Feltlinjerne og ladningerne er illustration: tætheden følger |v| (kondensator) og |i| (spole).</li>'
});
var lab = Lab.scene(UI.stage, { view: { target: new THREE.Vector3(0, 0.2, 0), theta: 0.6, phi: 1.2, radius: 4.2 } });
var S = { comp: 'C', src: 'pulse', C: 0.1, L: 50, Ip: 2, Tp: 3, Vamp: 10, f: 50, t: 0, v: 0, i: 0, hist: [] };

/* ---------- 3D ---------- */
var gC = new THREE.Group(), gL = new THREE.Group(); lab.scene.add(gC); lab.scene.add(gL);
var pTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.05, 1.2), Lab.mat(0xb8c7d6, { metal: 0.6 })), pBot = pTop.clone(); pTop.position.y = 0.6; pBot.position.y = -0.2; gC.add(pTop); gC.add(pBot);
var leadT = Lab.rod(0.02, Lab.mat(0xd9a441)), leadB = Lab.rod(0.02, Lab.mat(0xd9a441)); leadT.between(new THREE.Vector3(0, 0.6, 0), new THREE.Vector3(0, 1.3, 0)); leadB.between(new THREE.Vector3(0, -0.2, 0), new THREE.Vector3(0, -0.9, 0)); gC.add(leadT); gC.add(leadB);
var NQ = 40, qp = [], qn = [];
for (var i = 0; i < NQ; i++) { var x = -0.7 + 1.4 * ((i % 8) + 0.5) / 8, z = -0.5 + 1.0 * (Math.floor(i / 8) + 0.5) / 5;
  var a = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff5e5e })); a.position.set(x, 0.65, z); gC.add(a); qp.push(a);
  var b = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshBasicMaterial({ color: 0x5ec8ff })); b.position.set(x, -0.25, z); gC.add(b); qn.push(b); }
var eLines = []; for (i = 0; i < 20; i++) { var ar = Lab.arrow(0xffd27a, { radius: 0.008 }); ar.userData.x = -0.6 + 1.2 * ((i % 5) + 0.5) / 5; ar.userData.z = -0.4 + 0.8 * (Math.floor(i / 5) + 0.5) / 4; gC.add(ar); eLines.push(ar); }
// spole
var coil = Lab.spring({ R: 0.35, wire: 0.03, turns: 9, mat: Lab.mat(0xd9a441, { metal: 0.7, rough: 0.3 }) }); coil.set(1.3); coil.rotation.z = -PI / 2; coil.position.set(-0.65, 0.2, 0); gL.add(coil);
var core = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 1.5, 32), Lab.mat(0x44586e, { opacity: 0.5 })); core.rotation.z = PI / 2; core.position.y = 0.2; gL.add(core);
var bLines = []; for (i = 0; i < 6; i++) { var l = Lab.line(0x5ec8ff, false, 0.8); gL.add(l); bLines.push(l); }
var bArrows = []; for (i = 0; i < 3; i++) { var ba = Lab.arrow(0x5ec8ff, { radius: 0.012 }); gL.add(ba); bArrows.push(ba); }
var tagV = Lab.tag(lab, '', '#ffd27a'), tagI = Lab.tag(lab, '', '#00d984'), tagW = Lab.tag(lab, '', '#ff7a59');
var iArrow = Lab.arrow(0x00d984, { radius: 0.02 }); lab.scene.add(iArrow);

/* ---------- kontroller ---------- */
var c = UI.side;
Lab.seg(c[0], { value: 'C', options: [{ value: 'C', label: 'Kondensator' }, { value: 'L', label: 'Spole' }], onChange: function (v) { S.comp = v; ui(); reset(); } });
var bxC = document.createElement('div'), bxL = document.createElement('div'); c[0].appendChild(bxC); c[0].appendChild(bxL);
Lab.slider(bxC, { label: 'Kapacitans C', min: 0.01, max: 1, step: 0.01, value: S.C, unit: 'µF', fmt: function (x) { return F(x, 2); }, onInput: function (v) { S.C = v; reset(); } });
Lab.slider(bxL, { label: 'Induktans L', min: 1, max: 500, step: 1, value: S.L, unit: 'mH', fmt: function (x) { return F(x, 0); }, onInput: function (v) { S.L = v; reset(); } });
var srcSeg = Lab.seg(c[1], { value: 'pulse', options: [{ value: 'pulse', label: 'Strømpuls' }, { value: 'sine', label: 'Sinus' }], onChange: function (v) { S.src = v; ui(); reset(); } });
var bxP = document.createElement('div'), bxS = document.createElement('div'); c[1].appendChild(bxP); c[1].appendChild(bxS);
Lab.slider(bxP, { label: 'Pulsens strøm I', min: 0.5, max: 10, step: 0.1, value: S.Ip, unit: 'mA', fmt: function (x) { return F(x, 1); }, onInput: function (v) { S.Ip = v; reset(); } });
Lab.slider(bxP, { label: 'Pulsens varighed T', min: 0.5, max: 8, step: 0.1, value: S.Tp, unit: 'ms', fmt: function (x) { return F(x, 1); }, onInput: function (v) { S.Tp = v; reset(); } });
Lab.slider(bxS, { label: 'Amplitude (spænding)', min: 1, max: 325, step: 1, value: S.Vamp, unit: 'V', fmt: function (x) { return F(x, 0); }, onInput: function (v) { S.Vamp = v; } });
Lab.slider(bxS, { label: 'Frekvens f', min: 10, max: 1000, step: 5, value: S.f, unit: 'Hz', fmt: function (x) { return F(x, 0); }, onInput: function (v) { S.f = v; reset(); } });
var br = Lab.btnRow(c[1]); var pauseBtn = Lab.button(br, '⏸ Pause', '', function () {}); Lab.button(br, '↺ Forfra', 'primary', reset);
Lab.presets(c[1], [['<b>Dag 3-eksemplet:</b> 2 mA i 3 ms ind i C = 0,1 µF', function () { S.comp = 'C'; S.src = 'pulse'; S.Ip = 2; S.Tp = 3; S.C = 0.1; srcSeg.set('pulse', true); ui(); reset(); }]]);
var ro = Lab.readouts(c[2], [['v', 'Spænding v'], ['i', 'Strøm i'], ['p', 'Effekt p = v·i'], ['w', 'Oplagret energi w'], '-', ['x', 'Reaktans |X|'], ['ph', 'Fase af i i forhold til v']]);
Lab.legendKeys(UI.legend, [['#ff5e5e', '+ ladning'], ['#5ec8ff', '− ladning / magnetfelt B'], ['#ffd27a', 'elektrisk felt E'], ['#00d984', 'strøm i']]);
function ui() { gC.visible = S.comp === 'C'; gL.visible = S.comp === 'L'; bxC.style.display = S.comp === 'C' ? '' : 'none'; bxL.style.display = S.comp === 'L' ? '' : 'none'; bxP.style.display = S.src === 'pulse' ? '' : 'none'; bxS.style.display = S.src === 'sine' ? '' : 'none'; }
function reset() { S.t = 0; S.v = 0; S.i = 0; S.hist = []; }
ui(); reset();

// tidsskala: puls vises over 2·T ms, sinus over 3 perioder; simuleringstid går 1 periode/visningstid
var gVp = Lab.plot(UI.graphs.gV), gWp = Lab.plot(UI.graphs.gW);
function state(t) { // t i sekunder
  var C = S.C * 1e-6, L = S.L * 1e-3;
  if (S.src === 'pulse') {
    var I = S.Ip * 1e-3, T = S.Tp * 1e-3, on = t >= 0 && t < T;
    if (S.comp === 'C') { var v = I / C * Math.min(Math.max(t, 0), T); return { v: v, i: on ? I : 0 }; }
    // spole: strømmen rampes lineært op (1 mA/ms·I) i 80 % af T og brat ned → spændingsspring
    var ramp = I / (0.8 * T), tt = Math.max(t, 0), il = tt < 0.8 * T ? ramp * tt : tt < T ? I : Math.max(0, I - (tt - T) * I / (0.02 * T));
    var vl = tt < 0.8 * T ? L * ramp : tt < T ? 0 : tt < T + 0.02 * T ? -L * I / (0.02 * T) : 0;
    return { v: vl, i: il };
  }
  var w = 2 * PI * S.f, Vm = S.Vamp;
  if (S.comp === 'C') return { v: Vm * Math.sin(w * t), i: w * C * Vm * Math.cos(w * t) };
  return { v: Vm * Math.sin(w * t), i: -Vm / (w * L) * Math.cos(w * t) };
}
Lab.loop(function (dt, rdt) {
  var span = S.src === 'pulse' ? 2 * S.Tp * 1e-3 : 3 / S.f;
  S.t += dt * span / 4; if (S.t > span) { S.t = 0; S.hist = []; }
  var st = state(S.t), C = S.C * 1e-6, L = S.L * 1e-3, w = S.comp === 'C' ? 0.5 * C * st.v * st.v : 0.5 * L * st.i * st.i, p = st.v * st.i;
  if (dt > 0) S.hist.push([S.t, st.v, st.i, p, w]);
  var vmax = S.src === 'pulse' ? (S.comp === 'C' ? S.Ip * 1e-3 / C * S.Tp * 1e-3 : S.L * 1e-3 * S.Ip * 1e-3 / (0.02 * S.Tp * 1e-3)) : S.Vamp;
  var imax = S.src === 'pulse' ? S.Ip * 1e-3 : (S.comp === 'C' ? 2 * PI * S.f * C * S.Vamp : S.Vamp / (2 * PI * S.f * L));
  var fv = Math.min(1, Math.abs(st.v) / Math.max(vmax, 1e-12)), fi = Math.min(1, Math.abs(st.i) / Math.max(imax, 1e-12));
  if (S.comp === 'C') {
    var nshow = Math.round(fv * NQ), pos = st.v >= 0;
    for (i = 0; i < NQ; i++) { qp[i].visible = i < nshow; qn[i].visible = i < nshow; qp[i].material.color.setHex(pos ? 0xff5e5e : 0x5ec8ff); qn[i].material.color.setHex(pos ? 0x5ec8ff : 0xff5e5e); }
    eLines.forEach(function (e, k) { e.visible = fv > 0.03 && k < Math.ceil(fv * 20); e.set(new THREE.Vector3(e.userData.x, pos ? 0.55 : -0.15, e.userData.z), new THREE.Vector3(0, (pos ? -1 : 1) * 0.65, 0)); if (!(fv > 0.03 && k < Math.ceil(fv * 20))) e.visible = false; });
    iArrow.set(new THREE.Vector3(0.12, st.i >= 0 ? 0.95 : 1.25, 0), new THREE.Vector3(0, (st.i >= 0 ? -1 : 1) * 0.3, 0)); iArrow.visible = fi > 0.02;
  } else {
    for (i = 0; i < bLines.length; i++) { var rr = 0.4 + i * 0.18, pts = []; for (var k = 0; k <= 64; k++) { var a2 = k / 64 * 2 * PI; pts.push(new THREE.Vector3((0.9 + i * 0.2) * Math.cos(a2), 0.2 + rr * Math.sin(a2) * 1.1, (i % 2 ? 0.05 : -0.05))); } bLines[i].set(pts); bLines[i].visible = i < Math.ceil(fi * bLines.length); bLines[i].material.opacity = 0.3 + 0.6 * fi; }
    bArrows.forEach(function (b2, k) { b2.set(new THREE.Vector3(st.i >= 0 ? -0.4 : 0.4, 0.2 + (k - 1) * 0.1, 0), new THREE.Vector3((st.i >= 0 ? 1 : -1) * 0.8 * fi, 0, 0)); b2.visible = fi > 0.03; });
    iArrow.set(new THREE.Vector3(-0.9, st.i >= 0 ? 0.75 : 0.45, 0.4), new THREE.Vector3(0, (st.i >= 0 ? -1 : 1) * 0.3, 0)); iArrow.visible = fi > 0.02;
  }
  tagV.set(new THREE.Vector3(1.05, 0.2, 0), 'v = ' + F(st.v, 2) + ' V'); tagI.set(new THREE.Vector3(S.comp === 'C' ? 0.45 : -1.25, 1.1, 0.3), 'i = ' + F(st.i * 1000, 2) + ' mA'); tagW.set(new THREE.Vector3(0, -1.05, 0), 'w = ' + (w < 1e-3 ? F(w * 1e6, 2) + ' µJ' : F(w * 1000, 3) + ' mJ'));
  var Xr = S.src === 'sine' ? (S.comp === 'C' ? 1 / (2 * PI * S.f * C) : 2 * PI * S.f * L) : NaN;
  ro.set('v', F(st.v, 3) + ' V', 'hi'); ro.set('i', F(st.i * 1000, 3) + ' mA', 'ok'); ro.set('p', F(p * 1000, 3) + ' mW', p < 0 ? 'bad' : ''); ro.set('w', F(w * 1e6, 3) + ' µJ');
  ro.set('x', isFinite(Xr) ? F(Xr, 1) + ' Ω' : '– (kun ved sinus)'); ro.set('ph', S.src === 'sine' ? (S.comp === 'C' ? '+90° (i foran)' : '−90° (i bagefter)') : '–');
  Lab.setStatus(UI.status, p > 1e-12 ? 'Lagrer energi (p > 0)' : p < -1e-12 ? 'Giver energi tilbage (p < 0)' : 'Ingen effekt lige nu', p < 0 ? 'warn' : '');
  UI.note.textContent = 't = ' + F(S.t * 1000, 2) + ' ms';
  var tms = S.hist.map(function (q) { return q[0] * 1000; }), sm = span * 1000;
  var vm2 = Math.max(vmax, 1e-9) * 1.2, im2 = Math.max(imax, 1e-12) * 1.2;
  gVp.begin({ xmin: 0, xmax: sm, ymin: -vm2, ymax: vm2, xlabel: 't [ms]', ylabel: 'v [V]', fx: function (x) { return F(x, 1); }, fy: function (y) { return F(y, 0); } });
  gVp.line(S.hist.map(function (q, k) { return [tms[k], q[1]]; }), '#ffd27a', 2.2); gVp.line(S.hist.map(function (q, k) { return [tms[k], q[2] / im2 * vm2]; }), '#00d984', 2.2);
  gVp.text(sm * 0.02, vm2 * 0.88, 'v', '#ffd27a'); gVp.text(sm * 0.08, vm2 * 0.88, 'i (skaleret, maks ' + F(imax * 1000, 2) + ' mA)', '#00d984'); gVp.end();
  var pm = Math.max(Math.abs(vmax * imax), 1e-12) * 1.1, wm = (S.comp === 'C' ? 0.5 * C * vmax * vmax : 0.5 * L * imax * imax) * 1.15;
  gWp.begin({ xmin: 0, xmax: sm, ymin: -pm, ymax: pm, xlabel: 't [ms]', ylabel: 'p [W] / w (skaleret)', fx: function (x) { return F(x, 1); }, fy: function (y) { return F(y * 1000, 1) + 'm'; } });
  gWp.fill([[0, 0]].concat(S.hist.map(function (q, k) { return [tms[k], q[3]]; }), [[tms[tms.length - 1] || 0, 0]]), 'rgba(255,165,0,.18)'); gWp.line(S.hist.map(function (q, k) { return [tms[k], q[3]]; }), '#ffa500', 1.8);
  gWp.line(S.hist.map(function (q, k) { return [tms[k], q[4] / Math.max(wm, 1e-15) * pm]; }), '#ff7a59', 2.4); gWp.hline(0, 'rgba(227,233,239,.4)');
  gWp.text(sm * 0.02, pm * 0.88, 'p = v·i', '#ffa500'); gWp.text(sm * 0.2, pm * 0.88, 'w (skaleret)', '#ff7a59'); gWp.end();
  var f;
  if (S.comp === 'C') f = Lab.F('i = C·dv/dt ⇔ v(t) = (1/C)∫i dt + v(0)' + (S.src === 'pulse' ? ' = (I/C)·t = (' + n(S.Ip, 1) + ' mA / ' + n(S.C, 2) + ' µF)·t ⇒ hældning ' + n(S.Ip / S.C, 1) + ' V/ms' : ''), 'Kondensatorens ligning (slides dag 3). Konstant strøm giver lineært voksende spænding. Dag 3-eksemplet: 20 V/ms, altså 60 V efter 3 ms.') + Lab.F('w<sub>C</sub> = ½Cv² = ½·' + n(S.C, 2) + ' µF·(' + n(st.v, 1) + ' V)² = ' + n(w * 1e6, 2) + ' µJ', 'Energi lagret i det elektriske felt (slides dag 4).');
  else f = Lab.F('v = L·di/dt ⇔ i(t) = (1/L)∫v dt + i(0)', 'Spolens ligning (slides dag 3). En brat ændring i strømmen giver en stor spænding (som en tændspole).') + Lab.F('w<sub>L</sub> = ½Li² = ½·' + n(S.L, 0) + ' mH·(' + n(st.i * 1000, 2) + ' mA)² = ' + n(w * 1e6, 3) + ' µJ', 'Energi lagret i magnetfeltet (slides dag 4).');
  if (S.src === 'sine') f += Lab.F('|X| = ' + (S.comp === 'C' ? '1/(ωC)' : 'ωL') + ' = ' + n(Xr, 1) + ' Ω, &nbsp; I<sub>maks</sub> = V<sub>maks</sub>/|X| = ' + n(imax * 1000, 2) + ' mA', 'Middeleffekten over en hel periode er 0: energien svinger frem og tilbage mellem kilde og komponent.');
  UI.formulas.innerHTML = f;
  lab.render(rdt);
}, { button: pauseBtn, flag: UI.paused });
})();
</script>
</body>
</html>
