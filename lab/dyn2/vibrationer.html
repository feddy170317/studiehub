(function () {

var sls = {};

var sx0 = Lab.slider(c[2], { label: 'Startudsving', min: 0.02, max: 1, step: 0.01, value: 0.25, unit: '', fmt: function (x) { return S.mode === 'msd' ? F(x, 2) + ' m' : F(x * 180, 0) + '°'; }, onInput: function (v) { S.x0 = v; reset(); } });
Lab.slider(c[2], { label: 'Afspilningstempo', min: 0.1, max: 2, step: 0.05, value: 1, unit: '×', fmt: function (x) { return F(x, 2); }, onInput: function (v) { S.speed = v; } });
var br = Lab.btnRow(c[2]); var pauseBtn = Lab.button(br, '⏸ Pause', '', function () {}); Lab.button(br, '↺ Slip igen', 'primary', reset);

Lab.legendKeys(UI.legend, [['#ff7a59', 'svingende masse'], ['#ffd27a', 'ligevægt / led'], ['#8a9db3', 'viskøs dæmper']]);

function rodP() { var I = S.mr * S.Lr * S.Lr / 3; return { I: I, keq: S.kr * S.br * S.br, ceq: S.cr * S.ar * S.ar }; }
function params() { // ẍ + 2ζω_n ẋ + ω_n²x = 0 (pendul: eksakt sin)
  if (S.mode === 'msd') { var wn = Math.sqrt(S.k / S.m), cc = 2 * S.m * wn; return { wn: wn, z: S.c / cc, cc: cc, unit: 'm' }; }

}
function ui() { Object.keys(G).forEach(function (k) { G[k].visible = k === S.mode; bx[k].style.display = k === S.mode ? '' : 'none'; }); sx0.show();
  var V = { msd: [0, 1.25, 4.2], pen: [0, 1.0, 4.6], phy: [0, 1.0, 4.6], rod: [0.9, -0.1, 3.9] }[S.mode]; lab.setView({ target: new THREE.Vector3(V[0], V[1], 0), radius: V[2], theta: 0.3, phi: 1.35 }, true); }
function reset() { S.t = 0; S.hist = []; var x0 = S.mode === 'msd' ? S.x0 : S.x0 * PI; if (S.mode === 'rod') x0 = Math.min(x0, 0.35); S.x = [x0, 0]; }
ui(); reset();
var gX = Lab.plot(UI.graphs.gX), gP = Lab.plot(UI.graphs.gP);
Lab.loop(function (dt, rdt) {

  for (var i = 0; i < 10 && dt > 0; i++) {
    var x = S.x, k1 = [x[1], acc(x[0], x[1])], k2 = [x[1] + h / 2 * k1[1], acc(x[0] + h / 2 * k1[0], x[1] + h / 2 * k1[1])], k3 = [x[1] + h / 2 * k2[1], acc(x[0] + h / 2 * k2[0], x[1] + h / 2 * k2[1])], k4 = [x[1] + h * k3[1], acc(x[0] + h * k3[0], x[1] + h * k3[1])];
    S.x = [x[0] + h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]), x[1] + h / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1])]; S.t += h;
  }

    var yeq = 0.9, ym = yeq - X * 1.4; mass.position.set(0, ym, 0); spr.between(new THREE.Vector3(-0.1, 2.05, 0), new THREE.Vector3(-0.1, ym + 0.17, 0));
    dCyl.position.set(0.17, 1.6, 0); dRod.between(new THREE.Vector3(0.17, 1.4, 0), new THREE.Vector3(0.17, ym + 0.17, 0)); dCyl.visible = dRod.visible = S.c > 0;
    eqLine.set([new THREE.Vector3(-0.6, yeq, 0.25), new THREE.Vector3(0.6, yeq, 0.25)]); tagA.set(new THREE.Vector3(0.45, ym, 0.2), 'x = ' + F(X, 3) + ' m'); tagB.set(new THREE.Vector3(-0.85, yeq, 0.25), 'ligevægt'); tagC.set(new THREE.Vector3(0.35, 1.7, 0), S.c > 0 ? 'c' : '');
  } else if (S.mode === 'pen') {
    var L = S.l * 1.2, piv = new THREE.Vector3(0, 2, 0), b = new THREE.Vector3(L * Math.sin(X), 2 - L * Math.cos(X), 0); bob.position.copy(b); pStr.set([piv, b]);
    var ap = []; for (i = 0; i <= 40; i++) { var q = -S.x0 * PI + 2 * S.x0 * PI * i / 40; ap.push(new THREE.Vector3(L * Math.sin(q), 2 - L * Math.cos(q), -0.05)); } pArc.set(ap);

  } else if (S.mode === 'phy') {

    tagA.set(tip.clone().add(new THREE.Vector3(0.2, 0, 0)), 'θ = ' + F(X * 180 / PI, 1) + '°'); tagB.set(new THREE.Vector3(0.2, 2.2, 0), 'O'); tagC.set(new THREE.Vector3(0, 0, 0), '');
  } else {

    var pb = A0.clone().addScaledVector(dirv, S.br * sc), pa = A0.clone().addScaledVector(dirv, Math.min(S.ar, S.Lr) * sc);
    rSpr.between(new THREE.Vector3(pb.x, -0.9, 0.1), pb.clone().setZ(0.1)); rDc.position.set(pa.x, -0.6, -0.1); rDr.between(new THREE.Vector3(pa.x, -0.4, -0.1), pa.clone().setZ(-0.1)); rDc.visible = rDr.visible = S.cr > 0;
    tagA.set(endP.clone().add(new THREE.Vector3(0.1, 0.15, 0)), 'θ = ' + F(X * 180 / PI, 1) + '°'); tagB.set(new THREE.Vector3(pb.x, -1.1, 0.1), 'k, b = ' + F(S.br, 2)); tagC.set(new THREE.Vector3(pa.x, -1.1, -0.1), 'c, a = ' + F(S.ar, 2));
  }
  var typ = !P.z ? 'udæmpet' : P.z < 0.999 ? 'underdæmpet' : P.z <= 1.001 ? 'kritisk dæmpet' : 'overdæmpet';
  var tauExact = null;
  if (S.mode === 'pen') { var k0 = Math.sin(S.x0 * PI / 2), Kk = PI / 2 * (1 + k0 * k0 / 4 + 9 * Math.pow(k0, 4) / 64 + 25 * Math.pow(k0, 6) / 256); tauExact = 4 * Math.sqrt(S.l / g) * Kk; }
  ro.set('wn', F(P.wn, 3) + ' rad/s', 'hi'); ro.set('f', F(P.wn / (2 * PI), 3) + ' Hz'); ro.set('tau', F(2 * PI / P.wn, 3) + ' s' + (tauExact ? ' (eksakt ≈ ' + F(tauExact, 3) + ' s)' : ''));
  ro.set('z', P.cc ? F(P.z, 3) : '–', P.z > 1.001 ? 'bad' : P.z > 0.999 ? 'ok' : ''); ro.set('wd', P.z < 1 ? F(P.wn * Math.sqrt(1 - P.z * P.z), 3) + ' rad/s' : '–'); ro.set('typ', typ, 'hi');
  Lab.setStatus(UI.status, typ.charAt(0).toUpperCase() + typ.slice(1), P.z > 1.001 ? 'warn' : '');
  UI.note.textContent = 't = ' + F(S.t, 2) + ' s · tempo ×' + F(S.speed, 2);
  var tw = Math.max(5 * 2 * PI / P.wn, 3), t0 = Math.max(0, S.t - tw), amp = Math.max(Math.abs(S.hist.length ? S.hist[0][1] : S.x[0]), 0.01) * 1.25, X0 = Math.abs(S.mode === 'msd' ? S.x0 : (S.mode === 'rod' ? Math.min(S.x0 * PI, 0.35) : S.x0 * PI));

  gX.begin({ xmin: t0, xmax: t0 + tw, ymin: -amp, ymax: amp, xlabel: 't [s]', ylabel: P.unit === 'm' ? 'x [m]' : 'θ [rad]', fx: function (x) { return F(x, 1); }, fy: function (y) { return F(y, 2); } });
  if (P.z > 0 && P.z < 1) { var gm = P.z * P.wn, env = [], env2 = []; for (i = 0; i <= 80; i++) { var tt = t0 + tw * i / 80, e = X0 / Math.sqrt(1 - P.z * P.z) * Math.exp(-gm * tt); env.push([tt, e]); env2.push([tt, -e]); } gX.line(env, 'rgba(255,94,94,.6)', 1.4, [5, 4]); gX.line(env2, 'rgba(255,94,94,.6)', 1.4, [5, 4]); }
  if (S.mode === 'pen') { var lin = []; for (i = 0; i <= 200; i++) { var t2 = t0 + tw * i / 200; lin.push([t2, X0 * Math.cos(P.wn * t2)]); } gX.line(lin, 'rgba(94,200,255,.55)', 1.4, [5, 4]); gX.text(t0 + tw * 0.02, -amp * 0.88, 'stiplet: lineariseret sin θ ≈ θ', '#5ec8ff'); }
  gX.line(S.hist.filter(function (p) { return p[0] >= t0; }).map(function (p) { return [p[0], p[1]]; }), '#ff7a59', 2.2); gX.hline(0, 'rgba(255,210,122,.5)'); gX.end();
  var vm = Math.max(X0 * P.wn * 1.25, 0.01);
  gP.begin({ xmin: -amp, xmax: amp, ymin: -vm, ymax: vm, xlabel: P.unit === 'm' ? 'x' : 'θ', ylabel: P.unit === 'm' ? 'ẋ [m/s]' : 'θ̇ [rad/s]', fx: function (x) { return F(x, 2); }, fy: function (y) { return F(y, 1); } });
  gP.line(S.hist.map(function (p) { return [p[1], p[2]]; }), '#ffd27a', 1.8); gP.dot(S.x[0], S.x[1], '#ff7a59', 5); gP.end();
  var f;
  if (S.mode === 'msd') f = Lab.F('mẍ + cẋ + kx = 0, &nbsp;ω<sub>n</sub> = √(k/m) = √(' + n(S.k, 0) + '/' + n(S.m, 1) + ') = ' + n(P.wn, 3) + ' rad/s', 'Newton II på massen (22-1). Tyngden går ud mod fjederens forspænding, når x måles fra ligevægt (slides Vibrationer I, s. 5).') + Lab.F('c<sub>c</sub> = 2mω<sub>n</sub> = ' + n(P.cc, 2) + ' N·s/m, &nbsp;ζ = c/c<sub>c</sub> = ' + n(P.z, 3) + ', &nbsp;γ = c/(2m) = ' + n(S.c / (2 * S.m), 3) + ' s⁻¹', 'Karakteristisk ligning mλ² + cλ + k = 0. Under kritisk: x = De<sup>−γt</sup>sin(ω<sub>d</sub>t + φ) (slides Vibrationer III).');

  else { var Pp = rodP(); f = Lab.F('I<sub>A</sub>θ̈ + ca²θ̇ + kb²θ = 0, I<sub>A</sub> = mL²/3 = ' + n(Pp.I, 2) + ' kg·m² ⇒ ω<sub>n</sub> = √(kb²/I<sub>A</sub>) = ' + n(P.wn, 3) + ' rad/s', 'Momentligning om A for små udsving: fjederen giver moment kb²θ og dæmperen ca²θ̇.') + Lab.F('ζ = ca²/(2√(kb²·I<sub>A</sub>)) = ' + n(P.z, 3) + ';&nbsp; kritisk når a = √(2√(kb²I<sub>A</sub>)/c) = ' + n(Math.sqrt(2 * Math.sqrt(Pp.keq * Pp.I) / Math.max(S.cr, 1e-6)), 3) + ' m', 'Del (c) i eksamensopgaven: hvor skal dæmperen sidde for kritisk dæmpning? Dæmpet periode τ<sub>d</sub> = 2π/ω<sub>d</sub>' + (P.z < 1 ? ' = ' + F(2 * PI / (P.wn * Math.sqrt(1 - P.z * P.z)), 3) + ' s' : '') + '.'); }
  UI.formulas.innerHTML = f;
  lab.render(rdt);
}, { button: pauseBtn, flag: UI.paused });
})();
