<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masse-inertimoment · 3D-lab</title>
<meta name="description" content="Kapløb mellem to legemer med samme masse og samme moment: stang, skive, ring og kugle. Masse-inertimoment, gyrationsradius og flyttesætningen I = I_G + md².">
<link rel="stylesheet" href="../assets/lab.css">
</head>
<body>
<script src="../assets/three.min.js"></script>
<script src="../assets/lab.js"></script>
<script>
(function () {
'use strict';
var F = Lab.fmt, n = Lab.n, PI = Math.PI;
var UI = Lab.build({
  chip: 'DYN2 · HI 17.1 · Kinetik I', title: 'Masse-inertimoment: kapløb ved samme moment',
  src: 'Slides Kinetik I: I = ∫r²dm, I = mk² og flyttesætningen I = I<sub>G</sub> + md² · ΣM<sub>O</sub> = I<sub>O</sub>α',
  side: ['Venstre legeme (1)', 'Højre legeme (2)', 'Fælles', 'Aflæsning'],
  graphs: [{ id: 'gW', title: 'Vinkelhastighed under kapløbet', sub: 'ω = (M/I)·t' }, { id: 'gI', title: 'Masse-inertimomenter', sub: 'samme masse og ydre mål' }],
  notes: '<li><b>Kun afstanden til aksen tæller</b> (r² i integralet). En ring har al massen yderst og er derfor langsomst. En kugle har det meste tæt på aksen og er hurtigst.</li>' +
    '<li>Samme masse og samme moment, men forskellig vinkelacceleration α = M/I. Det er rotationens udgave af F = ma.</li>' +
    '<li><b>Flyttesætningen:</b> Flyt aksen væk fra tyngdepunktet med d, og I vokser med md². Derfor er I<sub>G</sub> det mindste inertimoment for en given akseretning. Prøv stangen om midten mod stangen om enden: 4 gange så stort.</li>' +
    '<li>Gyrationsradius k = √(I/m) er den afstand, hvor al massen kunne samles i én ring med samme I.</li>',
  model: '<li>Homogene legemer med samme masse m og samme ydre mål (stangens længde = 2R). Tabelformler: stang mL²/12 (om G), skive ½mR², ring mR², massiv kugle (2/5)mR², kugleskal (2/3)mR².</li>' +
    '<li>Ingen lejefriktion. Kapløbet stopper, når et legeme har drejet 5 omgange.</li>'
});
var lab = Lab.scene(UI.stage, { view: { target: new THREE.Vector3(0, 0.3, 0), theta: 0, phi: 1.05, radius: 5 } });
var BODIES = { rodG: ['Slank stang om midten', 1 / 12, 'L'], rodE: ['Slank stang om enden', 1 / 3, 'L'], disk: ['Massiv skive', 1 / 2, 'R'], ring: ['Tynd ring', 1, 'R'], sphere: ['Massiv kugle', 2 / 5, 'R'], shell: ['Tyndvægget kugleskal', 2 / 3, 'R'] };
var S = { b: [{ k: 'ring', d: 0 }, { k: 'sphere', d: 0 }], m: 5, R: 0.5, M: 2, t: 0, run: false, th: [0, 0], w: [0, 0], hist: [], done: false };

/* ---------- 3D ---------- */
var st = [], X = [-1.4, 1.4];
for (var i = 0; i < 2; i++) {
  var g = new THREE.Group(); g.position.x = X[i]; lab.scene.add(g);
  var base = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 0.2, 32), Lab.mat(0x2b3c50)); base.position.y = -0.6; g.add(base);
  var spin = new THREE.Group(); g.add(spin);
  var spindle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.3, 16), Lab.mat(0xffd27a)); spindle.position.y = -0.1; g.add(spindle);
  var mark = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.5), Lab.mat(0xffffff)); mark.position.set(0, 0.48, 0.25); spin.add(mark);
  var arc = Lab.arc(0x00d984, { thick: 0.014 }); arc.set(new THREE.Vector3(0, 0.62, 0), new THREE.Vector3(0, 1, 0), 0.25, 1, 4); g.add(arc);
  var tag = Lab.tag(lab, '', i ? '#ff7a59' : '#5ec8ff'), tagW = Lab.tag(lab, '', '#e3e9ef');
  st.push({ g: g, spin: spin, holder: null, tag: tag, tagW: tagW });
}
var mats = [Lab.mat(0x5ec8ff, { metal: 0.3, rough: 0.4 }), Lab.mat(0xff7a59, { metal: 0.3, rough: 0.4 })];
function buildBody(i) {
  var s = st[i], b = S.b[i], R = S.R, L = 2 * R, m;
  if (s.holder) { s.spin.remove(s.holder); }
  var h = new THREE.Group();
  if (b.k === 'rodG' || b.k === 'rodE') { m = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, L, 16), mats[i]); m.rotation.z = PI / 2; m.position.x = b.k === 'rodE' ? L / 2 : 0; }
  else if (b.k === 'disk') { m = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 0.08, 64), mats[i]); }
  else if (b.k === 'ring') { m = new THREE.Mesh(new THREE.TorusGeometry(R, 0.035, 12, 72), mats[i]); m.rotation.x = PI / 2; }
  else if (b.k === 'sphere') { m = new THREE.Mesh(new THREE.SphereGeometry(R * 0.7, 32, 24), mats[i]); }
  else { m = new THREE.Mesh(new THREE.SphereGeometry(R * 0.7, 32, 24), Lab.mat(i ? 0xff7a59 : 0x5ec8ff, { opacity: 0.55, double: true })); }
  h.add(m); h.position.x = b.d; h.position.y = 0.48;
  if (b.d > 0) { var arm = new THREE.Mesh(new THREE.BoxGeometry(b.d, 0.03, 0.06), Lab.mat(0x8fa3b8)); arm.position.set(-b.d / 2, 0, 0); h.add(arm); }
  s.spin.add(h); s.holder = h;
}
function I(i) { var b = S.b[i], B = BODIES[b.k], size = B[2] === 'L' ? 2 * S.R : (b.k === 'sphere' || b.k === 'shell' ? S.R * 0.7 : S.R); var IG = B[1] * S.m * size * size; if (b.k === 'rodE') { var dd = b.d + size / 2; return { I: S.m * size * size / 12 + S.m * dd * dd, IG: S.m * size * size / 12, d0: size / 2, size: size }; } return { I: IG + S.m * b.d * b.d, IG: IG, d0: 0, size: size }; }

/* ---------- kontroller ---------- */
var c = UI.side, sel = [];
[0, 1].forEach(function (i) {
  sel[i] = Lab.select(c[i], { label: 'Legeme', options: Object.keys(BODIES).map(function (k) { return { value: k, label: BODIES[k][0] }; }), value: S.b[i].k, onChange: function (v) { S.b[i].k = v; buildBody(i); reset(); } });
  Lab.slider(c[i], { label: 'Aksens afstand fra G, d', min: 0, max: 1, step: 0.05, value: 0, unit: 'm', fmt: function (x) { return F(x, 2); }, onInput: function (v) { S.b[i].d = v; buildBody(i); reset(); }, sub: 'Flyttesætningen: I = I<sub>G</sub> + md²' });
});
Lab.slider(c[2], { label: 'Masse m (begge)', min: 1, max: 20, step: 0.5, value: S.m, unit: 'kg', fmt: function (x) { return F(x, 1); }, onInput: function (v) { S.m = v; reset(); } });
Lab.slider(c[2], { label: 'Størrelse R (stang L = 2R)', min: 0.2, max: 0.8, step: 0.05, value: S.R, unit: 'm', fmt: function (x) { return F(x, 2); }, onInput: function (v) { S.R = v; buildBody(0); buildBody(1); reset(); } });
Lab.slider(c[2], { label: 'Moment M (begge)', min: 0.2, max: 10, step: 0.1, value: S.M, unit: 'N·m', fmt: function (x) { return F(x, 1); }, onInput: function (v) { S.M = v; } });
var br = Lab.btnRow(c[2]); Lab.button(br, '▶ Start kapløb', 'primary', function () { reset(); S.run = true; }); Lab.button(br, '↺ Nulstil', '', reset);
Lab.presets(c[2], [
  ['<b>Stang om midten mod stang om enden</b> (flyttesætningen)', function () { setB('rodG', 'rodE'); }],
  ['<b>Ring mod massiv skive</b>', function () { setB('ring', 'disk'); }],
  ['<b>Kugleskal mod massiv kugle</b>', function () { setB('shell', 'sphere'); }]
]);
function setB(a, b) { S.b[0] = { k: a, d: 0 }; S.b[1] = { k: b, d: 0 }; sel[0].set(a, true); sel[1].set(b, true); buildBody(0); buildBody(1); reset(); }
var ro = Lab.readouts(c[3], [['I1', 'I<sub>1</sub> om aksen'], ['I2', 'I<sub>2</sub> om aksen'], ['a1', 'α<sub>1</sub> = M/I<sub>1</sub>'], ['a2', 'α<sub>2</sub> = M/I<sub>2</sub>'], ['k1', 'k<sub>1</sub> = √(I<sub>1</sub>/m)'], ['k2', 'k<sub>2</sub> = √(I<sub>2</sub>/m)'], '-', ['n', 'Omgange (1 / 2)']]);
Lab.legendKeys(UI.legend, [['#5ec8ff', 'legeme 1'], ['#ff7a59', 'legeme 2'], ['#00d984', 'påført moment M'], ['#ffd27a', 'rotationsakse']]);
function reset() { S.t = 0; S.run = false; S.th = [0, 0]; S.w = [0, 0]; S.hist = []; S.done = false; st.forEach(function (s) { s.spin.rotation.y = 0; }); }
buildBody(0); buildBody(1);

var gW = Lab.plot(UI.graphs.gW), gI = Lab.plot(UI.graphs.gI);
Lab.loop(function (dt, rdt) {
  var I1 = I(0), I2 = I(1), Is = [I1.I, I2.I];
  if (S.run && !S.done) {
    S.t += dt;
    for (var i = 0; i < 2; i++) { var a = S.M / Is[i]; S.w[i] = a * S.t; S.th[i] = 0.5 * a * S.t * S.t; }
    S.hist.push([S.t, S.w[0], S.w[1]]);
    if (Math.max(S.th[0], S.th[1]) >= 5 * 2 * PI) { S.done = true; }
  }
  for (i = 0; i < 2; i++) { st[i].spin.rotation.y = S.th[i]; st[i].tag.set(new THREE.Vector3(X[i], -0.85, 0.5), BODIES[S.b[i].k][0] + (S.b[i].d > 0 ? ' (d = ' + F(S.b[i].d, 2) + ' m)' : '')); st[i].tagW.set(new THREE.Vector3(X[i], 1.05, 0), F(S.th[i] / (2 * PI), 2) + ' omg. · ω = ' + F(S.w[i], 1)); }
  var win = S.done ? (S.th[0] > S.th[1] ? 'Venstre (1) vandt' : S.th[1] > S.th[0] ? 'Højre (2) vandt' : 'Uafgjort') : '';
  Lab.setStatus(UI.status, S.done ? win + ': mindst I giver størst α' : S.run ? 'Kapløb: samme M, samme m' : 'Tryk "Start kapløb"', S.done ? '' : 'warn');
  UI.note.textContent = 't = ' + F(S.t, 2) + ' s · mål: 5 omgange';
  ro.set('I1', F(I1.I, 4) + ' kg·m²', 'hi'); ro.set('I2', F(I2.I, 4) + ' kg·m²', 'hi'); ro.set('a1', F(S.M / I1.I, 2) + ' rad/s²'); ro.set('a2', F(S.M / I2.I, 2) + ' rad/s²');
  ro.set('k1', F(Math.sqrt(I1.I / S.m), 3) + ' m'); ro.set('k2', F(Math.sqrt(I2.I / S.m), 3) + ' m'); ro.set('n', F(S.th[0] / (2 * PI), 2) + ' / ' + F(S.th[1] / (2 * PI), 2));
  var tm = Math.max(S.t, 1), wm = Math.max(S.w[0], S.w[1], 1) * 1.15;
  gW.begin({ xmin: 0, xmax: tm, ymin: 0, ymax: wm, xlabel: 't [s]', ylabel: 'ω [rad/s]', fx: function (x) { return F(x, 1); }, fy: function (y) { return F(y, 0); } });
  gW.line(S.hist.map(function (p) { return [p[0], p[1]]; }), '#5ec8ff', 2.2); gW.line(S.hist.map(function (p) { return [p[0], p[2]]; }), '#ff7a59', 2.2); gW.end();
  var keys = Object.keys(BODIES), vals = keys.map(function (k) { var B = BODIES[k], size = B[2] === 'L' ? 2 * S.R : (k === 'sphere' || k === 'shell' ? S.R * 0.7 : S.R); return B[1] * S.m * size * size; });
  var vm = Math.max.apply(null, vals.concat([I1.I, I2.I])) * 1.2;
  gI.begin({ xmin: 0, xmax: keys.length, ymin: 0, ymax: vm, xlabel: '', ylabel: 'I [kg·m²]', fx: function () { return ''; }, fy: function (y) { return F(y, 2); } });
  keys.forEach(function (k, j) { var col = (S.b[0].k === k ? '#5ec8ff' : S.b[1].k === k ? '#ff7a59' : 'rgba(143,163,184,.5)'); gI.fill([[j + 0.15, 0], [j + 0.15, vals[j]], [j + 0.85, vals[j]], [j + 0.85, 0]], col); gI.text(j + 0.5, vals[j] + vm * 0.04, BODIES[k][0].replace('Slank ', '').replace('Tyndvægget ', ''), '#cdd7e1', 'center'); });
  gI.end();
  function txt(i, Ii) { var B = BODIES[S.b[i].k], d = S.b[i].d; return 'I<sub>' + (i + 1) + '</sub> = ' + (S.b[i].k === 'rodE' ? '(1/12)mL² + m(d + L/2)²' : (B[1] === 1 ? '' : F(B[1], 3) + '·') + 'm' + B[2] + '²' + (d > 0 ? ' + md² = ' + n(Ii.I - S.m * d * d, 4) + ' + ' + n(S.m, 1) + '·' + n(d, 2) + '²' : '')) + ' = ' + n(Ii.I, 4) + ' kg·m²'; }
  UI.formulas.innerHTML = Lab.F(txt(0, I1), 'Masse-inertimoment fra tabel plus flyttesætningen (17-4). Flyttesætningen gælder kun mellem parallelle akser, og kun fra I<sub>G</sub>.') + Lab.F(txt(1, I2)) +
    Lab.F('ΣM<sub>O</sub> = I<sub>O</sub>α ⇒ α = M/I: ' + n(S.M, 1) + '/' + n(I1.I, 4) + ' = ' + n(S.M / I1.I, 2) + ' rad/s² mod ' + n(S.M / I2.I, 2) + ' rad/s²', 'Rotation om fast akse (17-16). Efter tiden t: ω = αt og θ = ½αt².');
  lab.render(rdt);
});
})();
</script>
</body>
</html>
