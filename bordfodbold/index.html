<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bordfodbold — Trophy Tracker</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title">🏆 Bordfodbold Trophy Tracker</div>
    <div class="subtitle" id="season-label">Season</div>
  </header>

  <section class="players" id="players"></section>

  <div class="cta-row">
    <button class="btn" id="open-modal-btn">＋ Log a match</button>
  </div>

  <section class="panel">
    <h2>Season standings</h2>
    <table class="standings">
      <thead>
        <tr><th></th><th>Player</th><th>Wins</th><th>Played</th><th>Goals</th><th>Diff</th><th>Rating</th></tr>
      </thead>
      <tbody id="standings-body"></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>Head-to-head</h2>
    <div class="h2h-picker">
      <div class="field">
        <label>Player</label>
        <select id="h2hPlayerA"></select>
      </div>
      <div class="h2h-vs">vs</div>
      <div class="field">
        <label>Player</label>
        <select id="h2hPlayerB"></select>
      </div>
    </div>
    <div id="h2h-results"></div>
  </section>

  <section class="panel">
    <details id="history-details">
      <summary class="panel-summary">Match history <span class="history-count" id="history-count"></span></summary>
      <div class="match-list" id="match-list"></div>
    </details>
  </section>

  <footer class="foot">🏆 = current trophy holder · 💩 = current poo holder · updates live for everyone · <a href="udfordringsstigen.html" style="color:inherit">udfordringsregler (forslag)</a></footer>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>Log a match</h3>
    <form id="match-form">
      <div class="field">
        <label>Match type</label>
        <div class="mode-toggle">
          <button type="button" class="mode-btn active" data-mode="1v1">1v1</button>
          <button type="button" class="mode-btn" data-mode="2v2">2v2 co-op</button>
        </div>
      </div>

      <div id="mode-1v1-fields">
        <div class="vs-row">
          <div class="field">
            <label>Player A</label>
            <select id="playerA"></select>
          </div>
          <div class="field">
            <label>Player B</label>
            <select id="playerB"></select>
          </div>
        </div>
      </div>

      <div id="mode-2v2-fields" style="display:none">
        <div class="team-block">
          <label class="team-label">Team A</label>
          <div class="vs-row">
            <div class="field"><select id="teamA1"></select></div>
            <div class="field"><select id="teamA2"></select></div>
          </div>
        </div>
        <div class="team-vs">vs</div>
        <div class="team-block">
          <label class="team-label">Team B</label>
          <div class="vs-row">
            <div class="field"><select id="teamB1"></select></div>
            <div class="field"><select id="teamB2"></select></div>
          </div>
        </div>
      </div>

      <div class="score-row">
        <div class="field">
          <label id="scoreALabel">Score A</label>
          <input type="number" id="scoreA" min="0" inputmode="numeric" required>
        </div>
        <div class="dash">–</div>
        <div class="field">
          <label id="scoreBLabel">Score B</label>
          <input type="number" id="scoreB" min="0" inputmode="numeric" required>
        </div>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="matchDate" required>
      </div>
      <div class="field">
        <label>PIN</label>
        <input type="password" id="pinInput" inputmode="numeric" placeholder="Shared PIN" required>
      </div>
      <div class="error-msg" id="form-error"></div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="close-modal-btn">Cancel</button>
        <button type="submit" class="btn">Save match</button>
      </div>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
