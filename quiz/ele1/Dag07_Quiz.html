<!DOCTYPE html>
<html lang="da"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — ELE1 Dag 7</title>
<style>
  :root{--bg:#0f1b2d;--card:#16263d;--acc:#2E86C1;--good:#2ecc71;--bad:#e74c3c;--txt:#e8eef5;--dim:#9fb3c8;--gold:#f1c40f}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#0f1b2d,#0a1220);color:var(--txt);min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px}
  header{text-align:center;margin-bottom:18px}
  h1{font-size:1.3rem;margin:.2em 0;color:#fff}
  .sub{color:var(--dim);font-size:.9rem}
  .hud{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:10px 16px;margin-bottom:16px;font-size:.9rem}
  .hud b{color:var(--gold);font-size:1.1rem}.combo{color:var(--acc)}
  .bar{height:6px;background:#0a1220;border-radius:4px;overflow:hidden;margin-bottom:18px}
  .bar>div{height:100%;background:var(--acc);width:0;transition:width .3s}
  .card{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .tag{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:20px;margin-bottom:10px;font-weight:600}
  .let{background:#1e4620;color:#8ef0a0}.mid{background:#4a3a17;color:#f4d47a}.svaer{background:#4a1e1e;color:#f4a0a0}
  .q{font-size:1.08rem;line-height:1.5;margin-bottom:16px}
  .opts{display:grid;gap:10px}
  .opt{background:#0f1e33;border:1.5px solid #26405f;border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--txt);font-size:.98rem;transition:.15s}
  .opt:hover{border-color:var(--acc)}.opt.correct{border-color:var(--good);background:#123020}
  .opt.wrong{border-color:var(--bad);background:#301616}.opt:disabled{cursor:default}
  .exp{margin-top:16px;padding:12px 14px;border-radius:10px;background:#0f1e33;font-size:.9rem;line-height:1.5;display:none}
  .exp .ref{color:var(--gold);font-weight:600}
  .next{margin-top:16px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;display:none}
  .end{text-align:center}.end .score{font-size:2.6rem;color:var(--gold);font-weight:700}
  .grade{font-size:1.3rem;margin:8px 0}
  .retry{margin-top:18px;padding:12px 26px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer;font-size:1rem}
</style></head><body><script src="../../assets/path-report.js"></script><script src="../../assets/quiz-result-ceremony.js"></script><div class="wrap">
  <header><h1>Dag 7: Elektriske maskiner, DC-motoren & kompleks effekt</h1><div class="sub">ELE1-A26 · Dag 7 · Test dig selv</div></header>
  <div class="hud"><span>Spg. <b id="qnum">1</b>/<span id="qtot">10</span></span>
    <span class="combo">Combo ×<span id="combo">1</span></span>
    <span>Score <b id="score">0</b></span></div>
  <div class="bar"><div id="prog"></div></div>
  <div id="stage"></div></div>
<script>
const QUIZ_POOL = [{"d": "let", "q": "Hvad er den komplekse effekt <b>S</b>?", "o": ["Ṽ · Ĩ* (konjugeret strøm)", "Ṽ · Ĩ", "Ṽ / Ĩ", "Ĩ² / Ṽ"], "a": 0, "e": "S = Ṽ·Ĩ*. Konjugeringen gør, at vinklen bliver impedansvinklen θ. <span class='ref'>[Rizzoni lign. 6.24, s. 311]</span>"}, {"d": "let", "q": "I S = P + jQ: hvad er Q?", "o": ["Reaktiv effekt [VAR]", "Aktiv effekt [W]", "Tilsyneladende effekt [VA]", "Effektfaktoren"], "a": 0, "e": "P er aktiv effekt, Q er reaktiv effekt, og |S| er den tilsyneladende effekt. <span class='ref'>[Rizzoni lign. 6.26, s. 312]</span>"}, {"d": "mid", "q": "S = 800 + j600 VA. Hvad er effektfaktoren?", "o": ["0,8", "0,6", "0,75", "1,33"], "a": 0, "e": "|S| = √(800² + 600²) = 1000 VA, så pf = P/|S| = 0,8. <span class='ref'>[Rizzoni s. 312–313, effekttrekanten]</span>"}, {"d": "mid", "q": "En last har Q < 0. Hvilken type last er det?", "o": ["Kapacitiv, førende pf", "Induktiv, haltende pf", "Rent resistiv", "Det kan ikke afgøres"], "a": 0, "e": "Negativ reaktiv effekt betyder kapacitiv last og førende effektfaktor. <span class='ref'>[Rizzoni s. 313]</span>"}, {"d": "mid", "q": "Hvorfor korrigeres en lav effektfaktor?", "o": ["For at mindske strømmen i ledningerne", "For at øge motorens effekt", "For at hæve spændingen", "For at sænke frekvensen"], "a": 0, "e": "Strømmen bestemmes af |S| = P/pf. Højere pf giver mindre strøm og mindre tab for samme effekt. <span class='ref'>[Rizzoni s. 318]</span>"}, {"d": "mid", "q": "Hvordan kobles kondensatoren ved effektfaktorkorrektion?", "o": ["Parallelt med lasten", "I serie med lasten", "I serie med sikringen", "Mellem nul og jord"], "a": 0, "e": "Parallelt, så lastens spænding og aktive effekt er uændrede, mens kondensatorens negative Q ophæver lastens positive Q. <span class='ref'>[Rizzoni eks. 6.8, s. 320]</span>"}, {"d": "svaer", "q": "Q₁ = 1500 VAR og ønsket Q₂ = 657 VAR ved 230 V, 50 Hz. Hvilken kapacitans kræves?", "o": ["≈ 51 µF", "≈ 90 µF", "≈ 5,1 µF", "≈ 510 µF"], "a": 0, "e": "C = (Q₁ − Q₂)/(ω·V²) = 843/(314·230²) ≈ 50,7 µF. <span class='ref'>[Rizzoni eks. 6.10, s. 322]</span>"}, {"d": "let", "q": "Hvilken af Flemings håndregler giver retningen af kraften på en strømførende leder i et magnetfelt (motoren)?", "o": ["Venstrehåndsreglen", "Højrehåndsreglen", "Skruereglen", "Lenz' lov"], "a": 0, "e": "Venstre hånd til motoren: tommelfinger = kraft, pegefinger = felt, langfinger = strøm. Højre hånd bruges til den inducerede emf i en generator. <span class='ref'>[Slides dag 7, slide 10]</span>"}, {"d": "let", "q": "Hvad angiver pegefingeren i Flemings håndregler?", "o": ["Magnetfeltets retning", "Strømmens retning", "Kraftens retning", "Bevægelsens retning"], "a": 0, "e": "I begge regler peger pegefingeren i feltets retning. Langfingeren er strøm/emf, og tommelfingeren er kraft/bevægelse. <span class='ref'>[Slides dag 7, slide 10]</span>"}, {"d": "mid", "q": "En 0,3 m lang leder fører 5 A vinkelret på et felt med B = 0,8 T. Hvor stor er kraften?", "o": ["1,2 N", "12 N", "0,48 N", "1,875 N"], "a": 0, "e": "F = B·I·L = 0,8 · 5 · 0,3 = 1,2 N. <span class='ref'>[Slides dag 7, slide 11; Rizzoni lign. 12.57, s. 671]</span>"}, {"d": "svaer", "q": "DC-motor: I<sub>a</sub> = 8 A, Φ = 0,02 Wb, P = 4 poler, Z = 800 ledere, A = 2 parallelle veje. Hvad er ankermomentet?", "o": ["≈ 40,7 N·m", "≈ 81,5 N·m", "≈ 20,4 N·m", "≈ 256 N·m"], "a": 0, "e": "T<sub>a</sub> = PΦZI<sub>a</sub>/(2πA) = 4·0,02·800·8/(2π·2) = 512/12,57 ≈ 40,7 N·m. <span class='ref'>[Slides dag 7, slide 12–13]</span>"}, {"d": "mid", "q": "I en DC-shuntmotor er ankerviklingen og feltviklingen forbundet …", "o": ["parallelt", "i serie", "via en transformer", "slet ikke, feltet kommer fra magneter"], "a": 0, "e": "Shunt = parallel, så fluxen er næsten konstant. I seriemotoren løber ankerstrømmen også gennem feltviklingen. <span class='ref'>[Slides dag 7, slide 7]</span>"}, {"d": "svaer", "q": "v(t) = 100 cos(ωt + 0,262) V og i(t) = 2 cos(ωt − 0,262) A. Hvad er den aktive effekt P?", "o": ["86,6 W", "173 W", "50 W", "100 W"], "a": 0, "e": "RMS: 70,71 V og 1,414 A. S = 100∠0,524 = 86,6 + j50 VA, så P = 86,6 W. Svaret 173 W fås, hvis RMS-omregningen glemmes. <span class='ref'>[Eksempel 7.4; Rizzoni eks. 6.4, s. 313]</span>"}, {"d": "mid", "q": "I p(t) = Ĩ²R(1 + cos 2ωt) + Ĩ²X sin 2ωt: hvad er middelværdien af reaktansens led Ĩ²X sin 2ωt?", "o": ["Nul", "Q", "Ĩ²X/2", "Ĩ²R"], "a": 0, "e": "Sinus har middelværdien nul. Reaktansen udfører derfor intet arbejde, og P<sub>av</sub> = Ĩ²R. Amplituden af leddet er Q. <span class='ref'>[Slides dag 7, slide 17]</span>"}, {"d": "let", "q": "Hvad er modspændingen E<sub>b</sub> i en DC-motor proportional med?", "o": ["Hastigheden ω", "Ankerstrømmen", "Ankermodstanden", "Forsyningsfrekvensen"], "a": 0, "e": "E_b = k·φ·ω_m, så den vokser med hastigheden. Ved stilstand er E_b = 0. <span class='ref'>[Rizzoni lign. 13.8, s. 706]</span>"}, {"d": "mid", "q": "Hvorfor er startstrømmen i en DC-motor stor?", "o": ["Modspændingen er nul ved stilstand", "Ankermodstanden er stor", "Fluxen er nul ved start", "Kommutatoren kortslutter"], "a": 0, "e": "V_a = R_a·I_a + E_b. Med E_b = 0 begrænser kun den lille R_a strømmen. <span class='ref'>[Rizzoni lign. 13.14, s. 707]</span>"}, {"d": "svaer", "q": "PM-motor: V<sub>s</sub> = 24 V, R<sub>a</sub> = 0,5 Ω, k = 0,1 V·s/rad. Hvad er hastigheden ved T = 1 N·m?", "o": ["190 rad/s", "240 rad/s", "48 rad/s", "200 rad/s"], "a": 0, "e": "ω = V/k − R_a·T/k² = 240 − 0,5·1/0,01 = 190 rad/s. <span class='ref'>[Rizzoni lign. 13.24, s. 710]</span>"}, {"d": "mid", "q": "I en DC-seriemotor er momentet proportionalt med …", "o": ["I<sub>a</sub>²", "I<sub>a</sub>", "1/I<sub>a</sub>", "√I<sub>a</sub>"], "a": 0, "e": "Fluxen følger ankerstrømmen, så T = k_a·k_S·I_a². Derfor stort startmoment. <span class='ref'>[Rizzoni lign. 13.28, s. 711]</span>"}];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const QUIZ = shuffle(QUIZ_POOL.slice()).slice(0, Math.min(10, QUIZ_POOL.length));
QUIZ.forEach(it=>{const p=it.o.map((t,idx)=>({t,c:idx===it.a}));shuffle(p);it.o=p.map(x=>x.t);it.a=p.findIndex(x=>x.c);});
const PTS={let:100,mid:150,svaer:200};
let i=0,score=0,combo=1,best=1;
const $=id=>document.getElementById(id);
$('qtot').textContent=QUIZ.length;
function render(){
  const it=QUIZ[i];$('qnum').textContent=i+1;$('prog').style.width=(i/QUIZ.length*100)+'%';
  const dn={let:'LET · 100p',mid:'MIDDEL · 150p',svaer:'SVÆR · 200p'}[it.d];
  let h=`<div class="card"><span class="tag ${it.d}">${dn}</span><div class="q">${it.q}</div><div class="opts">`;
  it.o.forEach((o,k)=>h+=`<button class="opt" onclick="answer(${k})">${o}</button>`);
  h+=`</div><div class="exp" id="exp">${it.e}</div><button class="next" id="next" onclick="next()">${i<QUIZ.length-1?'Næste →':'Se resultat →'}</button></div>`;
  $('stage').innerHTML=h;
}
function answer(k){
  const it=QUIZ[i];const btns=document.querySelectorAll('.opt');
  btns.forEach((b,j)=>{b.disabled=true;if(j===it.a)b.classList.add('correct');});
  if(k===it.a){btns[k].classList.add('correct');score+=PTS[it.d]*combo;combo++;if(combo>best)best=combo;}
  else{btns[k].classList.add('wrong');combo=1;}
  $('score').textContent=score;$('combo').textContent=combo;
  $('exp').style.display='block';$('next').style.display='block';
}
function next(){i++;if(i<QUIZ.length)render();else end();}
function end(){
  $('prog').style.width='100%';
  const maxS=(function(){let s=0,c=1;for(const q of QUIZ){s+=PTS[q.d]*c;c++;}return s;})();
  const ratio=score/maxS;if(window.reportPathQuiz)reportPathQuiz(ratio,score);let gr;
  if(ratio>=.85)gr='🏆 Fremragende!';else if(ratio>=.6)gr='👍 Godt gået';else if(ratio>=.35)gr='📚 Ikke dårligt';else gr='🔁 Læs kapitlet igen';
  $('stage').innerHTML=`<div class="card end"><div class="grade">${gr}</div><div class="score">${score}</div><div class="sub">point · længste combo ×${best}</div><button class="retry" onclick="location.reload()">Prøv igen</button></div>`;if(window.renderPathResultBanner)document.getElementById('stage').insertAdjacentHTML('beforeend',renderPathResultBanner(ratio));
}
render();
</script></body></html>
